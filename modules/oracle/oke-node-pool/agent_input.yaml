# Every resource this module creates is compartment-scoped, and the agent already knows
# which compartment it is deploying into, so this never has to be repeated in the config.
compartment_id: "{{ .agent.accountId }}"

cluster_id: "{{ .toutput.oke.cluster_id }}"
kubernetes_version: "{{ .toutput.oke.kubernetes_version }}"
subnet_ids: |
  ["{{ .toutput.vpc.private_subnets[0] }}"]
pod_subnet_ids: |
  ["{{ .toutput.vpc.pod_subnets[0] }}"]
# Without the cluster's NSGs nothing allows traffic in to these nodes' pods, so pods on the
# other pools cannot reach them.
nsg_ids: |
  ["{{ .toutput.oke.node_nsg_id }}"]
pod_nsg_ids: |
  ["{{ .toutput.oke.pod_nsg_id }}"]
