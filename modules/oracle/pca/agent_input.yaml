# Every resource this module creates is compartment-scoped, and the agent already knows
# which compartment it is deploying into, so this never has to be repeated in the config.
compartment_id: "{{ .agent.accountId }}"

# Optional on purpose (.toptout, not .toutput): a deployment that brings its own HSM key still
# has to plan. An empty ca_key_id then fails the precondition in main.tf with a message saying
# which module supplies it.
ca_key_id: "{{ .toptout.kms.ca_key_id }}"
