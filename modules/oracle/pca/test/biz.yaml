# The CA outlives a teardown: OCI holds a CA's name for 7 days after deletion is scheduled, so
# one created per run would collide with the previous one. oci-nuke-config.yml keeps an existing
# CA standing and this adopts it.
create_ca: false
# A literal rather than a name derived from the prefix, because the plain biz-net-pca-root-ca is
# taken by the CA this one replaces. The salt is the same convention modules/oracle/pca follows
# when name_salt is on.
ca_name: "biz-net-pca-root-ca-3pbbwkcu"
