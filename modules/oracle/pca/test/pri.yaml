# pri adopts its own authority, created by hand and kept by oci-nuke-config.yml, for the same
# reason biz does: a CA holds its name for 7 days after deletion is scheduled, so one created
# per run would collide with the previous one.
create_ca: false
# The step is named literally rather than taken from {{ .step.name }}: a per-module test run
# renames the step after its branch, and the CA to adopt keeps the name the net step gave it.
ca_name: "{{ .config.prefix }}-net-{{ .module.name }}-root-ca"
