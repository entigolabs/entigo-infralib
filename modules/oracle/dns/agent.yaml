version: v1
metadata:
  # Same keys as modules/aws-v2/route53, so a consumer reading a module of type
  # dns or certificates does not have to know which cloud answered. The values
  # behind them are OCIDs rather than ARNs, which is what the outputs are named.
  pub_cert_arn: "{{ .sout.pub_cert_ocid }}"
  pub_domain: "{{ .sout.pub_domain }}"
  pub_zone_id: "{{ .sout.pub_zone_id }}"
  int_cert_arn: "{{ .sout.int_cert_ocid }}"
  int_domain: "{{ .sout.int_domain }}"
  int_zone_id: "{{ .sout.int_zone_id }}"
module_types: [dns, certificates]
