# Both optional on purpose (.toptout, not .toutput): a deployment with no oracle/pca module,
# or none with private zones and so no need for a VCN, still has to plan.
#
# An empty certificate_authority_id leaves each domain to name its own, bring a
# certificate_ocid, or set create_certificate = false. An empty vcn_id only matters to a
# domain with private = true, which then fails a precondition naming what to set.
certificate_authority_id: "{{ .toptout.pca.certificate_authority_id }}"
vcn_id: "{{ .toptout.vpc.vpc_id }}"
