---
# One private zone. With a single domain the module infers it as both the public and the
# private default, so no default_private is needed.
#
# The certificate is issued by the authority modules/oracle/pca adopts for pri.
domains: |
  {
    "private" = {
      domain_name = "{{ .config.prefix }}-{{ .step.name }}-{{ .module.name }}-int.oci.infralib.entigo.io"
      private     = true
    }
  }
name_salt: true
