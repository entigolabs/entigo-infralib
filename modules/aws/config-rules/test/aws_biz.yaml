operational_best_practices_conformance_pack_enabled: true
iam_password_policy_enabled: true
multi_region_cloudtrail_enabled: false
recording_mode_override: |
  {
    description         = "Record EC2 instances daily"
    resource_types      = ["AWS::EC2::Instance"]
    recording_frequency = "DAILY"
  }
# The module is installed on some days only (run_days in module.yaml) and the
# test account is emptied daily, so its log buckets go with what AWS Config
# has delivered into them.
force_destroy: true
