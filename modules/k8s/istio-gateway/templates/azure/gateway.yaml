{{- if eq .Values.global.cloudProvider "azure" }}
{{- $cfg := .Values.global.azure.loadBalancer }}
{{- if or $cfg.enabled (and $cfg.namespace (eq .Release.Namespace $cfg.namespace)) }}
{{- $scheme := ternary "internal" "external" $cfg.internal }}
{{- $domain := ternary $cfg.intDomain $cfg.pubDomain $cfg.internal | required (printf "global.azure.loadBalancer.%s" (ternary "intDomain" "pubDomain" $cfg.internal)) }}
{{- $secret := printf "%s-%s-tls" .Release.Name $scheme }}
{{- $service := printf "%s-%s" .Values.gateway.name $scheme }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $service }}
  {{- if $cfg.internal }}
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
    {{- with $cfg.internalSubnet }}
    service.beta.kubernetes.io/azure-load-balancer-internal-subnet: {{ . | quote }}
    {{- end }}
  {{- end }}
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  {{- with $cfg.sourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    istio: {{ .Values.gateway.name | trimPrefix "istio-" }}
  ports:
    - name: http2
      port: 80
      targetPort: 80
      protocol: TCP
    - name: https
      port: 443
      targetPort: 443
      protocol: TCP
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $secret }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretName: {{ $secret }}
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: {{ $cfg.certificateIssuer }}
  dnsNames:
    - {{ $domain | quote }}
    - {{ printf "*.%s" $domain | quote }}
  privateKey:
    {{- toYaml $cfg.certificatePrivateKey | nindent 4 }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $cfg.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  gatewayClassName: istio
  addresses:
    - type: Hostname
      value: {{ printf "%s.%s.svc.cluster.local" $service .Release.Namespace }}
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            group: ""
            name: {{ $secret }}
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
{{- if $cfg.sslRedirect }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $cfg.name }}-redirect
  annotations:
    external-dns.kubernetes.io/controller: none
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $cfg.name }}
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
      matches:
        - path:
            type: PathPrefix
            value: /
{{- end }}
{{- end }}
{{- end }}
