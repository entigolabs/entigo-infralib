{{- if eq .Values.global.cloudProvider "azure" }}
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
spec:
  selector:
    app: {{ .Values.gateway.name }}
  servers:
  - hosts:
    - "*"
    port:
      name: http
      number: 8080
      protocol: HTTP
{{- end }}