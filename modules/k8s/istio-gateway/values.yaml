global:
  cloudProvider: ""
  # Route target. createRoute and the gateway come from agent_input.yaml, from
  # aws-alb on AWS and google-gateway on google. Empty hostnames makes the
  # route the lowest precedence fallback on the shared gateway.
  createRoute: false
  hostnames: []
  gateway:
    name: ""
    namespace: ""

gateway:
  name: "istio-gateway"
  imagePullPolicy: "IfNotPresent"
  annotations:
    kube-score/ignore: pod-networkpolicy,pod-probes,container-image-tag # "auto:latest" will be populated at runtime by the mutating webhook. See https://istio.io/latest/docs/setup/additional-setup/sidecar-injection/#customizing-injection
  service:
    # Type of service. Set to "None" to disable the service entirely
    type: ClusterIP
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app: istio-gateway
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
      ephemeral-storage: 100Mi
    limits:
      cpu: 2000m
      memory: 1024Mi
      ephemeral-storage: 1Gi
