global:
  cloudProvider: azure
  # Public entry: route on azure-gateway (AGC) to these pods
  createRoute: true

  azure:
    # Gateway API gateway (HTTPRoute sectionName https) behind an own Azure load balancer, TLS in istio.
    # Internal: until AGC has a private frontend (https://github.com/Azure/AKS/issues/5739). Public: istio without azure-gateway.
    loadBalancer:
      # Also created in the namespace azure-gateway internalGatewayNamespace names
      enabled: false
      namespace: ""
      internal: true
      name: gateway
      # int_domain for internal, pub_domain for public
      intDomain: ""
      pubDomain: ""
      # Client CIDRs allowed through the load balancer, empty allows everything
      sourceRanges: []
      certificateIssuer: letsencrypt
      certificatePrivateKey:
        algorithm: ECDSA
        size: 384
        rotationPolicy: Always
      sslRedirect: true

gateway:
  service:
    ports:
      - name: status-port
        port: 15021
        protocol: TCP
        targetPort: 15021
      - name: http2
        port: 80
        protocol: TCP
        targetPort: 8080
      - name: https
        port: 443
        protocol: TCP
        targetPort: 443
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 90
          preference:
            matchExpressions:
              - key: tools
                operator: In
                values:
                  - "true"
  tolerations:
    - key: "tools"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
    - key: "CriticalAddonsOnly"
      operator: "Exists"
      effect: "NoSchedule"
  # Count only zones of nodes the pods can run on
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      nodeTaintsPolicy: Honor
      labelSelector:
        matchLabels:
          app: istio-gateway
