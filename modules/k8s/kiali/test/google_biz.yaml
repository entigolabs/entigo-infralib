# No gateway pin here: the chain in agent_input.yaml resolves it, and
# google-gateway/test points internalGateway at the external gateway,
# which is the one this test probes.
kiali-server:
  server:
    web_fqdn: "{{ .module.name }}.{{ .toutput.dns.pub_domain }}"
  auth:
    strategy: openid
    openid:
      client_id: "343161092010274846"
      disable_rbac: true
      issuer_uri: "https://entigo-dev-if3upz.zitadel.cloud"
      scopes: ["openid", "profile", "email", "roles"]
      username_claim: "email"
