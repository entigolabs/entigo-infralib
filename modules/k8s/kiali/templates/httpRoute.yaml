{{- if .Values.global.createRoute }}
{{- $kiali := index .Values "kiali-server" }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.global.gateway.name }}
      namespace: {{ .Values.global.gateway.namespace }}
      sectionName: https
  hostnames:
    - {{ $kiali.server.web_fqdn | quote }}
  rules:
    - backendRefs:
        - group: ''
          kind: Service
          name: {{ .Release.Name }}
          port: {{ $kiali.server.port }}
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: {{ $kiali.server.web_root | default "/kiali" }}
{{- end }}
