installProviderConfig: true

global:
  azure:
    subscriptionId: ""
    tenantId: ""
    clientId: ""
    resourceGroupName: ""
    location: ""
    oidcIssuerUrl: ""
    identityPrefix: ""
    nodeResourceGroupName: ""

  providerVersion: v2.7.2

  deploymentRuntimeConfig:
    args:
      - --enable-management-policies

  extraProviders: []
  observerProviders: []
  requiredProviders: ["managedidentity", "authorization", "storage"]
  createObservers: false
  createNamespacedObservers: false

workloadIdentity:
  enabled: true
  # Roles a WorkloadIdentity may grant, each only on scopes matching one of its regexes (whole lower case scope).
  # {rg}: agent resource group id, {nodeRg}: AKS node resource group id, {encryptionKeyIds}: one of encryptionKeyIds.
  # A role without a matching pattern (e.g. {nodeRg} or {encryptionKeyIds} unset) is not allowed at all.
  roles:
    AcrPull:
      - '{rg}/providers/microsoft\.containerregistry/registries/[a-z0-9]+'
    Key Vault Secrets User:
      - '{rg}/providers/microsoft\.keyvault/vaults/[a-z0-9-]+(/secrets/[a-z0-9-]+)?'
    Storage Blob Data Contributor:
      - '{rg}/providers/microsoft\.storage/storageaccounts/[a-z0-9]+/blobservices/default/containers/[a-z0-9-]+'
    DNS Zone Contributor:
      - '{rg}/providers/microsoft\.network/dnszones/[a-z0-9][a-z0-9.-]*'
    Private DNS Zone Contributor:
      - '{rg}/providers/microsoft\.network/privatednszones/[a-z0-9][a-z0-9.-]*'
    Monitoring Reader:
      - '{rg}(/providers/.+)?'
      - '{nodeRg}(/providers/.+)?'
    # Customer managed keys, only for a WorkloadIdentity without serviceAccountName
    Key Vault Crypto Service Encryption User:
      - '{encryptionKeyIds}'
  # Key resource ids for {encryptionKeyIds} (kms telemetry key)
  encryptionKeyIds: []
  functions:
    goTemplating:
      image: docker.io/entigolabs/function-go-templating
      tag: v0.12.4
    autoReady:
      image: docker.io/entigolabs/function-auto-ready
      tag: v0.7.0
