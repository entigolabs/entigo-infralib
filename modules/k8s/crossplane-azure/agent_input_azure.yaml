global:
  azure:
    clientId: "{{ .toutput.crossplane.client_id }}"
    tenantId: "{{ .toutput.crossplane.tenant_id }}"
    subscriptionId: "{{ .toutput.crossplane.subscription_id }}"
    resourceGroupName: "{{ .agent.resourceGroup }}"
    location: "{{ .toutput.aks.region }}"
    oidcIssuerUrl: "{{ .toutput.aks.cluster_oidc_issuer_url }}"
    identityPrefix: "{{ .toutput.aks.cluster_name }}"
    nodeResourceGroupName: "{{ .toutput.aks.node_resource_group }}"
entigo-infralib-apis:
  iam:
    environmentConfig:
      azure:
        encryptionKeyIds:
          - "{{ .toptout.kms.telemetry_key_resource_id }}"
