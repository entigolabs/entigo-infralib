{{- if .Values.workloadIdentity.enabled }}
{{- $az := .Values.global.azure }}
{{- range $k := list "subscriptionId" "resourceGroupName" "location" "oidcIssuerUrl" "identityPrefix" }}
{{- $_ := required (printf "global.azure.%s is required for workloadIdentity" $k) (get $az $k) }}
{{- end }}
{{- $wi := .Values.workloadIdentity }}
{{- $rgPrefix := printf "/subscriptions/%s/resourcegroups/" $az.subscriptionId }}
{{- /* placeholder -> values, a pattern is repeated per value and dropped without one (one placeholder per pattern) */}}
{{- $vars := dict "{rg}" (list (print $rgPrefix $az.resourceGroupName)) "{nodeRg}" list "{encryptionKeyIds}" (compact $wi.encryptionKeyIds) }}
{{- if $az.nodeResourceGroupName }}{{ $_ := set $vars "{nodeRg}" (list (print $rgPrefix $az.nodeResourceGroupName)) }}{{ end }}
{{- $roles := dict }}
{{- range $role, $patterns := $wi.roles }}
{{- $out := list }}
{{- range $p := $patterns }}
{{- $var := "" }}
{{- range $k, $_ := $vars }}{{ if contains $k $p }}{{ $var = $k }}{{ end }}{{ end }}
{{- if not $var }}{{ $out = append $out $p }}{{ end }}
{{- range $v := dig $var list $vars }}{{ $out = append $out (replace $var (lower $v | regexQuoteMeta) $p) }}{{ end }}
{{- end }}
{{- if $out }}{{ $_ := set $roles $role $out }}{{ end }}
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-workload-identity
  labels:
    rbac.crossplane.io/aggregate-to-crossplane: "true"
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: function-workload-identity
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  deploymentTemplate:
    spec:
      selector: {}
      template:
        metadata:
          annotations:
            prometheus.io/scrape: "true"
            prometheus.io/port: "8080"
            prometheus.io/path: "/metrics"
        spec:
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - preference:
                    matchExpressions:
                      - key: tools
                        operator: In
                        values:
                          - 'true'
                  weight: 90
          containers:
            - name: package-runtime
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 1000m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
          securityContext:
            fsGroup: 2000
            runAsUser: 65532
            runAsGroup: 65532
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          tolerations:
            - effect: NoSchedule
              key: tools
              operator: Equal
              value: 'true'
            - effect: NoSchedule
              key: CriticalAddonsOnly
              operator: Exists
---
apiVersion: pkg.crossplane.io/v1beta1
kind: Function
metadata:
  name: function-workload-identity
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  package: {{ $wi.function.image }}:{{ $wi.function.tag }}
  runtimeConfigRef:
    apiVersion: pkg.crossplane.io/v1beta1
    kind: DeploymentRuntimeConfig
    name: function-workload-identity
---
apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: workload-identity
  annotations:
    argocd.argoproj.io/sync-wave: "3"
data:
  azure:
    subscriptionId: {{ $az.subscriptionId | quote }}
    resourceGroupName: {{ $az.resourceGroupName | quote }}
    location: {{ $az.location | quote }}
    oidcIssuerUrl: {{ $az.oidcIssuerUrl | quote }}
    identityPrefix: {{ $az.identityPrefix | quote }}
    providerConfigName: {{ .Release.Name }}
    roles:
      {{- toYaml $roles | nindent 6 }}
---
apiVersion: pkg.crossplane.io/v1
kind: Configuration
metadata:
  name: configuration-workload-identity
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  package: {{ .Values.workloadIdentity.package.image }}:{{ .Values.workloadIdentity.package.tag }}
  skipDependencyResolution: true
---
apiVersion: apiextensions.crossplane.io/v1alpha1
kind: ManagedResourceActivationPolicy
metadata:
  name: {{ .Release.Name }}
  annotations:
    argocd.argoproj.io/sync-wave: "6"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  activate:
  - 'userassignedidentities.managedidentity.azure.m.upbound.io'
  - 'federatedidentitycredentials.managedidentity.azure.m.upbound.io'
  - 'roleassignments.authorization.azure.m.upbound.io'
{{- end }}
