{{- if or .Values.job.deleteUnusedCrds .Values.job.deleteInactiveProviderRevisions .Values.job.deleteInactiveFunctionRevisions }}

apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-cleanup
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-cleanup
rules:
- apiGroups: ["pkg.crossplane.io"]
  resources: ["providerrevisions", "functionrevisions"]
  verbs: ["*"]
- apiGroups: ["pkg.crossplane.io"]
  resources: ["providers"]
  verbs: ["get", "list"]
- apiGroups: ["apiextensions.crossplane.io"]
  resources: ["managedresourceactivationpolicies", "managedresourcedefinitions"]
  verbs: ["*"]
- apiGroups: ["aws.upbound.io", "gcp.upbound.io", "k8s.crossplane.io"]
  resources: ["providerconfigusages"]
  verbs: ["get", "list"]
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["get", "list", "delete", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-cleanup
subjects:
- kind: ServiceAccount
  name: {{ .Release.Name }}-cleanup
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ .Release.Name }}-cleanup
  apiGroup: rbac.authorization.k8s.io
{{- if and .Values.job.deleteInactiveProviderRevisions .Values.job.restartOnInvalidProviderRevisions }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-cleanup
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  resourceNames: ["crossplane"]
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-cleanup
subjects:
- kind: ServiceAccount
  name: {{ .Release.Name }}-cleanup
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ .Release.Name }}-cleanup
  apiGroup: rbac.authorization.k8s.io
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-cleanup
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    kube-score/ignore: pod-networkpolicy
spec:
{{- if and .Values.job.deleteInactiveProviderRevisions .Values.job.restartOnInvalidProviderRevisions }}
  activeDeadlineSeconds: {{ add (mul 2 (.Values.job.invalidProviderRevisionsWaitSeconds | default 900)) 900 }}
{{- else }}
  activeDeadlineSeconds: 600
{{- end }}
  parallelism: 1
  completions: 1
  template:
    spec:
      serviceAccountName: {{ .Release.Name }}-cleanup
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 90
            preference:
              matchExpressions:
              - key: tools
                operator: In
                values:
                - "true"
      tolerations:
        - key: "tools"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      containers:
      - name: kubectl
        image: {{ .Values.job.image }}:{{ .Values.job.tag }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          limits:
            cpu: 1000m
            memory: 512Mi
            ephemeral-storage: 200Mi
          requests:
            cpu: 1m
            memory: 16Mi
            ephemeral-storage: 2Mi
        command:
        - /bin/bash
        - -c
        - |
          #!/bin/bash
{{- if .Values.job.deleteInactiveProviderRevisions | default false }}
{{- if .Values.job.restartOnInvalidProviderRevisions | default false }}
          # Crossplane can mark a ProviderRevision Healthy with a truncated
          # status.objectRefs when the package fetch times out mid-stream (every
          # package re-fetches at once on a Crossplane upgrade, see
          # crossplane/crossplane#7817). Such a revision never takes control of
          # the MRDs missing from its list, so they stay controlled by the old
          # revision: SafeStart providers stay scaled to zero and the
          # rbac-manager ClusterRoles miss API groups. The Inactive revisions
          # must not be deleted while that is the case, because their
          # ClusterRoles are what keeps the cluster working. So: wait for the
          # revision roll to settle, restart the crossplane deployment if any
          # Active MRD is not controlled by an Active revision (every Active
          # revision re-parses its package on start), wait for that to clear,
          # and only then clean up.
          NAMESPACE="{{ .Release.Namespace }}"
          WAIT_SECONDS={{ .Values.job.invalidProviderRevisionsWaitSeconds | default 900 }}
          SETTLE_SECONDS={{ .Values.job.invalidProviderRevisionsSettleSeconds | default 60 }}

          # Prints one line per Active MRD whose controller is not an Active ProviderRevision, nothing when all is well.
          invalid_revisions() {
            local active
            active=$(kubectl get providerrevisions.pkg.crossplane.io -o json | jq '[.items[] | select(.spec.desiredState == "Active") | .metadata.name]')
            kubectl get managedresourcedefinitions.apiextensions.crossplane.io -o json | jq -r --argjson active "$active" '
              .items[]
              | select(.spec.state == "Active")
              | .metadata.name as $mrd
              | ([.metadata.ownerReferences[]? | select(.controller == true and .kind == "ProviderRevision")] | first) as $ctrl
              | select($ctrl == null or (($active | index($ctrl.name)) == null))
              | "active MRD \($mrd) is controlled by \($ctrl.name // "no ProviderRevision")"'
          }

          # True once every Provider reports Healthy=True and no ProviderRevision was created in the last SETTLE_SECONDS.
          roll_settled() {
            local cutoff
            cutoff=$(( $(date +%s) - SETTLE_SECONDS ))
            kubectl get providers.pkg.crossplane.io -o json | jq -e '
              [.items[] | select(([.status.conditions[]? | select(.type == "Healthy" and .status == "True")] | length) == 0)] | length == 0' >/dev/null \
            && kubectl get providerrevisions.pkg.crossplane.io -o json | jq -e --argjson cutoff "$cutoff" '
              [.items[] | select((.metadata.creationTimestamp | fromdateiso8601) > $cutoff)] | length == 0' >/dev/null
          }

          echo "Waiting for the ProviderRevision roll to settle (up to ${WAIT_SECONDS}s)..."
          START=$(date +%s)
          sleep "$SETTLE_SECONDS"
          INVALID=""
          while true; do
            INVALID=$(invalid_revisions)
            if [ -n "$INVALID" ]; then
              echo "Active MRDs not controlled by an Active ProviderRevision, waiting ${SETTLE_SECONDS}s for the rest of the roll to land:"
              echo "$INVALID"
              sleep "$SETTLE_SECONDS"
              INVALID=$(invalid_revisions)
              break
            fi
            if roll_settled; then
              echo "All Providers are Healthy and no new ProviderRevisions appeared in the last ${SETTLE_SECONDS}s."
              break
            fi
            if [ $(( $(date +%s) - START )) -ge "$WAIT_SECONDS" ]; then
              echo "WARNING: Providers did not all become Healthy within ${WAIT_SECONDS}s, continuing with what is there:"
              kubectl get providers.pkg.crossplane.io
              break
            fi
            sleep 15
          done

          if [ -z "$INVALID" ]; then
            echo "Every active MRD is controlled by an Active ProviderRevision, no restart needed."
          else
            echo "Still not controlled after settling, restarting the crossplane deployment:"
            echo "$INVALID"
            kubectl -n "$NAMESPACE" rollout restart deployment crossplane
            echo "Waiting for the crossplane deployment to roll out..."
            START=$(date +%s)
            while true; do
              if kubectl -n "$NAMESPACE" get deployment crossplane -o json | jq -e '
                  .status.observedGeneration >= .metadata.generation
                  and .status.updatedReplicas == .spec.replicas
                  and .status.availableReplicas == .spec.replicas
                  and ((.status.unavailableReplicas // 0) == 0)' >/dev/null; then
                echo "crossplane deployment rolled out."
                break
              fi
              if [ $(( $(date +%s) - START )) -ge "$WAIT_SECONDS" ]; then
                echo "ERROR: crossplane deployment did not roll out within ${WAIT_SECONDS}s."
                kubectl -n "$NAMESPACE" get deployment crossplane
                exit 1
              fi
              sleep 10
            done
            echo "Waiting for the Active ProviderRevisions to take control of their MRDs (up to ${WAIT_SECONDS}s)..."
            START=$(date +%s)
            while true; do
              INVALID=$(invalid_revisions)
              if [ -z "$INVALID" ]; then
                echo "Every active MRD is controlled by an Active ProviderRevision."
                break
              fi
              if [ $(( $(date +%s) - START )) -ge "$WAIT_SECONDS" ]; then
                echo "ERROR: active MRDs are still not controlled by an Active ProviderRevision after the restart, not deleting the Inactive revisions:"
                echo "$INVALID"
                exit 1
              fi
              sleep 15
            done
          fi
{{- end }}
          # Get all ProviderRevisions with desiredState = Inactive
          INACTIVE_REVISIONS=$(kubectl get providerrevisions.pkg.crossplane.io -o json | \
          jq -r '.items[] | select(.spec.desiredState == "Inactive") | .metadata.name')

          if [ -z "$INACTIVE_REVISIONS" ]; then
              echo "No inactive ProviderRevisions found."
          else
              echo "Found inactive ProviderRevisions to delete:"
              echo "$INACTIVE_REVISIONS"
              echo ""
              
              # Loop through and delete each inactive revision
              for revision in $INACTIVE_REVISIONS; do
                  echo "Deleting ProviderRevision: $revision"
                  kubectl delete providerrevisions.pkg.crossplane.io "$revision"
              done
              
              echo ""
              echo "ProviderRevision cleanup complete!"
          fi
{{- end }}
{{- if .Values.job.deleteInactiveFunctionRevisions | default false }}
          # Get all ProviderRevisions with desiredState = Inactive
          INACTIVE_FREVISIONS=$(kubectl get functionrevisions.pkg.crossplane.io -o json | \
          jq -r '.items[] | select(.spec.desiredState == "Inactive") | .metadata.name')

          if [ -z "$INACTIVE_FREVISIONS" ]; then
              echo "No inactive FunctionRevisions found."
          else
              echo "Found inactive FunctionRevisions to delete:"
              echo "$INACTIVE_FREVISIONS"
              echo ""

              # Loop through and delete each inactive revision
              for revision in $INACTIVE_FREVISIONS; do
                  echo "Deleting FunctionRevision: $revision"
                  kubectl delete functionrevisions.pkg.crossplane.io "$revision"
              done

              echo ""
              echo "ProviderRevision cleanup complete!"
          fi
{{- end }}
{{- if .Values.job.deleteUnusedCrds | default false }}
          # Get CRDs actually in use from providerconfigusages
          AWSUSEDAPIS=$(kubectl get providerconfigusages.aws.upbound.io -o json | \
          jq -r '.items[]?.resourceRef? | select(. != null) | "\(.kind)|\(.apiVersion)"' | \
          sort -u | \
          while IFS='|' read -r kind apiVersion; do
              # Extract group from apiVersion
              group=$(echo "$apiVersion" | cut -d'/' -f1)
              
              # Query CRDs to find the one matching this kind and group
              kubectl get crd -o json | \
              jq -r --arg kind "$kind" --arg group "$group" \
              '.items[] | select(.spec.group == $group and .spec.names.kind == $kind) | .metadata.name' 
          done | sort -u)
          
          GCPUSEDAPIS=$(kubectl get providerconfigusages.gcp.upbound.io -o json | \
          jq -r '.items[]?.resourceRef? | select(. != null) | "\(.kind)|\(.apiVersion)"' | \
          sort -u | \
          while IFS='|' read -r kind apiVersion; do
              # Extract group from apiVersion
              group=$(echo "$apiVersion" | cut -d'/' -f1)
              
              # Query CRDs to find the one matching this kind and group
              kubectl get crd -o json | \
              jq -r --arg kind "$kind" --arg group "$group" \
              '.items[] | select(.spec.group == $group and .spec.names.kind == $kind) | .metadata.name' 
          done | sort -u)
          
          KSUSEDAPIS=$(kubectl get providerconfigusages.k8s.crossplane.io -o json | \
          jq -r '.items[]?.resourceRef? | select(. != null) | "\(.kind)|\(.apiVersion)"' | \
          sort -u | \
          while IFS='|' read -r kind apiVersion; do
              # Extract group from apiVersion
              group=$(echo "$apiVersion" | cut -d'/' -f1)
              
              # Query CRDs to find the one matching this kind and group
              kubectl get crd -o json | \
              jq -r --arg kind "$kind" --arg group "$group" \
              '.items[] | select(.spec.group == $group and .spec.names.kind == $kind) | .metadata.name' 
          done | sort -u)

          # Get CRDs from ManagedResourceActivationPolicies
          ACTIVATE=$(kubectl get managedresourceactivationpolicies.apiextensions.crossplane.io -o json | \
          jq -r '.items[].spec.activate[]' | \
          sort -u)
          if [ "$ACTIVATE" == "" ]
          then
            echo "Unable to find any managedresourceactivationpolicies. Aborting."
            exit 1
          fi
          # Combine both lists and deduplicate
          KEEP_APIS=$(echo -e "$AWSUSEDAPIS\n$GCPUSEDAPIS\n$KSUSEDAPIS\n$ACTIVATE" | sort -u | grep -v '^$')

          echo "APIs to keep:"
          echo "$KEEP_APIS"
          echo ""

          # Get all ManagedResourceDefinitions and delete those not in the keep list
          echo "Checking ManagedResourceDefinitions for deletion..."

          # Get all MRDs
          ALL_MRDS=$(kubectl get managedresourcedefinitions.apiextensions.crossplane.io -o json | \
          jq -r '.items[] | select(.spec.state == "Active") | .metadata.name' | sort -u)

          # Loop through MRDs and delete those not in the keep list
          for mrd in $ALL_MRDS; do
              # Check if this MRD is in the keep list
              if echo "$KEEP_APIS" | grep -q "^${mrd}$"; then
                  echo "Keeping: $mrd"
              else
                  echo "Deleting: $mrd"
                  kubectl delete managedresourcedefinitions.apiextensions.crossplane.io "$mrd"
                  kubectl delete customresourcedefinition "$mrd"
              fi
          done

          echo ""
          echo "Cleanup complete!"
          echo "Checking for inactive ProviderRevisions..."
{{- end }}

      restartPolicy: Never
  backoffLimit: 5
{{- end }}
