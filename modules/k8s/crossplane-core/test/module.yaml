# Installed once per environment: a pull request applies it under its regular
# name instead of a per-branch copy.
pin_step: true
# kube-score checks skipped on top of the framework's defaults: the upstream crossplane chart ships no NetworkPolicy, ephemeral storage limits or probes.
kube_score_ignore:
  - pod-networkpolicy
  - container-ephemeral-storage-request-and-limit
  - pod-probes
