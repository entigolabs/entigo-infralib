{{- if eq .Values.global.cloudProvider "azure" }}
apiVersion: iam.entigo.com/v1alpha1
kind: WorkloadIdentity
metadata:
  name: {{ .Release.Name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  serviceAccountName: {{ index .Values "trivy-operator" "serviceAccount" "name" }}
  {{- with .Values.global.azure.acrId }}
  azurePermissions:
    - role: AcrPull
      scope: {{ . }}
  {{- end }}
{{- end }}
