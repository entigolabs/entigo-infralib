# Installed once per environment: a pull request applies it under its regular
# name instead of a per-branch copy.
pin_step: true
# kube-score checks skipped on top of the framework's defaults: the upstream trivy-operator chart sets no ephemeral storage or resources on scan jobs and ships no NetworkPolicy.
kube_score_ignore:
  - container-ephemeral-storage-request-and-limit
  - container-resources
  - pod-networkpolicy
