global:
  cloudProvider: ""
  providerConfigRefName: ""
  google:
    projectID: ""

trivy-operator:
  serviceAccount:
    name: "trivy"
  service:
    headless: true
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8080"
      prometheus.io/path: "/metrics"
  resources:
    requests:
      cpu: 5m
      memory: 50Mi
    limits:
      cpu: 100m
      memory: 256Mi
  trivyOperator:
    scanJobAutomountServiceAccountToken: true
    scanJobCompressLogs: true
    scanJobPodTemplatePodSecurityContext:
      runAsNonRoot: true
      RunAsUser: 10000
      RunAsGroup: 10000
      seccompProfile:
        type: RuntimeDefault
    scanJobAffinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 50
            preference:
              matchExpressions:
                - key: mon
                  operator: In
                  values:
                    - "true"
          - weight: 50
            preference:
              matchExpressions:
                - key: tools
                  operator: In
                  values:
                    - "true"
    scanJobTolerations:
      - key: "mon"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      - key: "tools"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
  trivy:
    slow: true
    # The server keeps the database in an emptyDir and downloads it again when the pod is
    # replaced, so it needs no storage class and no volume tied to one zone.
    storageClassEnabled: false
    server:
      # Measured on the biz and pri test clusters through a database download and a scan of every
      # workload: 29Mi at rest, 88Mi and 12m at the peak. The database is read through the page
      # cache, which the memory limit has to leave room for.
      # The database is a 1.7Gi file in an emptyDir. An update downloads the new copy to /tmp,
      # another emptyDir, before it replaces the old one, so the limit covers two copies and
      # growth. A pod over the ephemeral storage limit is evicted.
      resources:
        requests:
          cpu: 5m
          memory: 64Mi
          ephemeral-storage: 2Gi
        limits:
          cpu: 1
          memory: 1Gi
          ephemeral-storage: 5Gi
      podSecurityContext:
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
    # severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
    severity: HIGH,CRITICAL
    resources:
      requests:
        cpu: 200m
        memory: 400Mi
      limits:
        cpu: 1
        memory: 2Gi

  operator:
    # One trivy server per cluster holds the vulnerability database and scan jobs query it
    # (ClientServer mode). In Standalone mode every scan job downloaded its own copy.
    builtInTrivyServer: true
    scanJobsConcurrentLimit: 1
    scanJobTimeout: 20m
    metricsFindingsEnabled: true
    metricsVulnIdEnabled: false
    exposedSecretScannerEnabled: false
    sbomGenerationEnabled: false
    configAuditScannerEnabled: false
    rbacAssessmentScannerEnabled: false
    infraAssessmentScannerEnabled: false
    clusterComplianceEnabled: false
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 90
          preference:
            matchExpressions:
              - key: mon
                operator: In
                values:
                  - "true"
        - weight: 10
          preference:
            matchExpressions:
              - key: tools
                operator: In
                values:
                  - "true"
  tolerations:
    - key: "mon"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
    - key: "tools"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"

  nodeCollector:
    tolerations:
      - key: "mon"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      - key: "tools"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
