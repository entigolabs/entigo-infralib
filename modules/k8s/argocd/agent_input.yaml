argocd:
  server:
    httproute:
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: '{{ .toptin.aws-alb.global.internalGateway | .toptin.google-gateway.global.internalGateway | required }}'
          namespace: '{{ .toptmodule.aws-alb | .toptmodule.google-gateway | required }}'
          sectionName: https
      hostnames:
        - "{{ .module.name }}.{{ .toptout.route53.int_domain | .toptout.dns.int_domain | required }}"
      # default rules (single PathPrefix /) are correct, no override needed

  global:
    domain: |
      {{ .module.name }}.{{ .toptout.route53.int_domain | .toptout.dns.int_domain | required }}
    image:
      repository: '{{ .toptout.ecr-proxy.quay_registry | .toptout.gar-proxy.quay_registry | "quay.io" }}/argoproj/argocd'
  dex:
    image:
      repository: '{{ .toptout.ecr-proxy.ghcr_registry | .toptout.gar-proxy.ghcr_registry | "ghcr.io" }}/dexidp/dex'
  redis:
    image:
      repository: '{{ .toptout.ecr-proxy.ecr_registry | .toptout.gar-proxy.ecr_registry | "public.ecr.aws" }}/docker/library/redis'
job:
  image: '{{ .toptout.ecr-proxy.hub_registry | .toptout.gar-proxy.hub_registry | "docker.io" }}/entigolabs/entigo-infralib-kubectl'
mcp:
  image: '{{ .toptout.ecr-proxy.hub_registry | .toptout.gar-proxy.hub_registry | "docker.io" }}/entigolabs/mcp-for-argocd'
