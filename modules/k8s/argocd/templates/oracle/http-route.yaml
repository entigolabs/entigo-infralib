{{- if and (eq .Values.global.cloudProvider "oracle") (.Capabilities.APIVersions.Has "gateway.networking.k8s.io/v1/HTTPRoute") }}
# Gated on the CRD actually existing, not just the cloud provider: argocd_helm_bootstrap
# (images/tools/functions-argocd.sh) installs this chart with a raw `helm upgrade --install`
# before ArgoCD itself exists, and the Gateway API CRDs only ever arrive through ArgoCD-managed
# apps (istio-base / oci-ingress) - a real circular dependency on a fresh cluster, not a timing
# race. Skipping this resource when the CRD isn't registered yet lets that bootstrap install
# succeed; ArgoCD's own repo-server re-evaluates Capabilities on every sync, so once the CRD
# lands the next reconciliation renders and applies this normally with no special-casing needed.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.global.oracle.gateway.name }}
      namespace: {{ .Values.global.oracle.gateway.namespace }}
      sectionName: {{ .Values.global.oracle.gateway.sectionName }}
  hostnames:
    - {{ .Values.argocd.global.domain }}
  rules:
    - backendRefs:
        - group: ''
          kind: Service
          # server.insecure is set for oracle, so argocd-server speaks plain HTTP.
          name: {{ .Release.Name }}-server
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
{{- end }}
