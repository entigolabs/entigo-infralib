argocd:
  server:
    ingress:
      enabled: "{{ .tinput.aws-alb.global.createIngress }}"
    httproute:
      enabled: "{{ .tinput.aws-alb.global.createRoute }}"
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: "{{ .tinput.aws-alb.global.internalGatway }}"
          namespace: "{{ .tmodule.aws-alb }}"
          sectionName: https
      hostnames:
        - "{{ .module.name }}.{{ .toutput.route53.int_domain }}"
      # default rules (single PathPrefix /) are correct, no override needed
    grpcroute:
      enabled: "{{ .tinput.aws-alb.global.createRoute }}"
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: "{{ .tinput.aws-alb.global.internalGatway }}"
          namespace: "{{ .tmodule.aws-alb }}"
          sectionName: https
      hostnames:
        - "{{ .module.name }}.{{ .toutput.route53.int_domain }}"
      rules:
        - {}   # no matches = match all gRPC; the chart injects the backendRef
  global:
    domain: |
      {{ .module.name }}.{{ .toutput.route53.int_domain }}
    image:
      repository: '{{ .toptout.ecr-proxy.quay_registry | "quay.io" }}/argoproj/argocd'
  dex:
    image:
      repository: '{{ .toptout.ecr-proxy.ghcr_registry | "ghcr.io" }}/dexidp/dex'
  redis:
    image:
      repository: '{{ .toptout.ecr-proxy.ecr_registry | "public.ecr.aws" }}/docker/library/redis'
job:
  image: '{{ .toptout.ecr-proxy.hub_registry | "docker.io" }}/entigolabs/entigo-infralib-kubectl'
mcp:
  image: '{{ .toptout.ecr-proxy.hub_registry | "docker.io" }}/entigolabs/mcp-for-argocd'
