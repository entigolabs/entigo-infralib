global:
  cloudProvider: oracle

argocd:
  configs:
    params:
      # TLS terminates in the Istio gateway, which then talks plain HTTP to argocd-server.
      server.insecure: true
  server:
    ingress:
      # No Ingress (ingress-nginx is gone) and, deliberately, no HTTPRoute in this chart
      # either: argocd is installed with `helm upgrade --install` during the apps step's
      # bootstrap, which happens before any ArgoCD Application exists and therefore before
      # the Gateway API CRDs are installed - a Gateway API kind here fails the bootstrap
      # outright with "no matches for kind HTTPRoute".
      #
      # argocd's HTTPRoute is created for it by modules/k8s/oracle-gateway (its `routes`
      # value) once the CRDs are in place, into this namespace so the backend reference
      # stays same-namespace. The certificate comes from the gateway's own listener.
      enabled: false
