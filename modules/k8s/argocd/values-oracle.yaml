global:
  cloudProvider: oracle

argocd:
  configs:
    params:
      server.insecure: true
  server:
    ingress:
      enabled: true
      # modules/k8s/ingress-nginx - TLS terminates in nginx (SNI), so every app has
      # its own cert-manager certificate. hostname defaults to global.domain (set in
      # agent_input_oracle.yaml).
      ingressClassName: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
        # argocd-server itself speaks plain HTTP (server.insecure above).
        nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
      tls: true
