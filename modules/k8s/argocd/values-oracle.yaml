global:
  cloudProvider: oracle

  oracle:
    # The shared Gateway API gateway from modules/k8s/oracle-gateway. sectionName pins this
    # app to its own HTTPS listener - without it the route would also attach to the
    # gateway's port-80 listener (whose hostname is unset, so it matches everything) and
    # argocd would be served over plaintext HTTP too.
    gateway:
      name: oracle-gateway
      namespace: oracle-gateway
      sectionName: https-argocd

argocd:
  configs:
    params:
      # TLS terminates in the Istio gateway, which then talks plain HTTP to argocd-server.
      server.insecure: true
  server:
    ingress:
      # Exposed with an HTTPRoute (templates/oracle/http-route.yaml) instead of the chart's
      # own Ingress - ingress-nginx is gone. The certificate is issued by cert-manager
      # against the gateway's listener, so nothing cert-related belongs here anymore.
      enabled: false
