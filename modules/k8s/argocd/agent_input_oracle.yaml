argocd:
  server:
    ingress:
      annotations:
        # The shared wildcard certificate in OCI Certificates (modules/oracle/dns). One
        # certificate for every host under the zone, because NIC terminates all of them on
        # a single load balancer listener and a listener carries exactly one key pair.
        oci-native-ingress.oraclecloud.com/certificate-ocid: "{{ .toutput.dns.int_cert_ocid }}"
  global:
    domain: |
      {{ .module.name }}.{{ .toutput.dns.int_domain }}
    image:
      repository: 'quay.io/argoproj/argocd'
  dex:
    image:
      repository: 'ghcr.io/dexidp/dex'
  redis:
    image:
      repository: 'public.ecr.aws/docker/library/redis'
job:
  image: 'docker.io/entigolabs/entigo-infralib-kubectl'
mcp:
  image: 'docker.io/entigolabs/mcp-for-argocd'
