---
# One repo-server: a PR test copies the branch into a single repo-server pod, and requests
# reaching any other replica fail with "repository not found".
argocd:
  repoServer:
    # Test environments only. The agent copies a pull request's checkout into
    # this pod (/tmp/conf, the file:// source of the Applications it creates),
    # and a rolled pod took the copy with it, failing argocd's own upgrade and
    # every other pull request running on the cluster. The copy lives on a
    # volume now; Recreate, since a rolling update's second pod could not
    # attach it. fsGroup (global below) makes the volume writable for argocd.
    deploymentStrategy:
      type: Recreate
    volumes:
      - name: local-sources
        persistentVolumeClaim:
          claimName: "{{ .module.name }}-repo-server-local-sources"
    volumeMounts:
      - name: local-sources
        mountPath: /tmp/conf
    autoscaling:
      maxReplicas: 1
  global:
    securityContext:
      fsGroup: 999
  extraObjects:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: "{{ .module.name }}-repo-server-local-sources"
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
