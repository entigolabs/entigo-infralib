mcp:
  enabled: true
argocd:
  dex:
    enabled: false
  repoServer:
    # Test environments only. The agent copies a pull request's checkout into
    # this pod (/tmp/conf, the file:// source of the Applications it creates),
    # and a rolled pod took the copy with it, failing argocd's own upgrade and
    # every other pull request running on the cluster. The copy lives on a
    # volume now; Recreate, since a rolling update's second pod could not
    # attach it. fsGroup (global below) makes the volume writable for argocd.
    deploymentStrategy:
      type: Recreate
    volumes:
      - name: local-sources
        persistentVolumeClaim:
          claimName: "{{ .module.name }}-repo-server-local-sources"
    volumeMounts:
      - name: local-sources
        mountPath: /tmp/conf
    autoscaling:
      maxReplicas: 1
  server:
    ingress:
      annotations:
        alb.ingress.kubernetes.io/group.name: external
        alb.ingress.kubernetes.io/scheme: internet-facing
  extraObjects:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: "{{ .module.name }}-repo-server-local-sources"
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
  global:
    securityContext:
      fsGroup: 999
    domain: |
      {{ .module.name }}.{{ .toutput.route53.int_domain }}
  configs:
    params:
      server.dex.server: ""
    rbac:
      policy.csv: |
        g, web-admin-258953744228679165, role:admin
        g, web-admin-390876846557773807, role:admin
        p, infralib, applications, get, */*, allow
        p, infralib, applications, sync, */*, allow
        p, infralib, projects, get, *, allow
      policy.default: role:readonly
    cm:
      oidc.config: |
        name: Zitadel
        issuer: https://entigo-dev-if3upz.zitadel.cloud
        clientID: "390876948932411375"
        clientSecret: "{{ .output-custom./argocd-pri/clientSecret }}"
        requestedScopes:
          - openid
          - profile
          - email
          - groups
        logoutURL: https://entigo-dev-if3upz.zitadel.cloud/oidc/v1/end_session
