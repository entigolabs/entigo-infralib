argocd:
  server:
    httproute:
      hostnames:
        - "{{ .module.name }}.{{ .toutput.dns.pub_domain }}"
  dex:
    enabled: false
  repoServer:
    autoscaling:
      maxReplicas: 1
  global:
    domain: |
      {{ .module.name }}.{{ .toutput.dns.pub_domain }}
  configs:
    params:
      server.dex.server: ""
    rbac:
      policy.csv: |
        g, web-admin-258953744228679165, role:admin
        g, web-admin-390876846557773807, role:admin
        p, infralib, applications, get, */*, allow
        p, infralib, applications, sync, */*, allow
        p, infralib, projects, get, *, allow
      policy.default: role:readonly
    cm:
      oidc.config: |
        name: Zitadel
        issuer: https://entigo-dev-if3upz.zitadel.cloud
        clientID: "396964871700220069"
        clientSecret: "{{ .output-custom.argocd-biz-client-secret }}"
        requestedScopes:
          - openid
          - profile
          - email
          - groups
        logoutURL: https://entigo-dev-if3upz.zitadel.cloud/oidc/v1/end_session
