argocd:
  repoServer:
    # Test environments only. The agent copies a pull request's checkout into
    # this pod (/tmp/conf, the file:// source of the Applications it creates),
    # and a rolled pod took the copy with it, failing argocd's own upgrade and
    # every other pull request running on the cluster. The copy lives on a
    # volume now; Recreate, since a rolling update's second pod could not
    # attach it. fsGroup (global below) makes the volume writable for argocd.
    deploymentStrategy:
      type: Recreate
    volumes:
      - name: local-sources
        persistentVolumeClaim:
          claimName: "{{ .module.name }}-repo-server-local-sources"
    volumeMounts:
      - name: local-sources
        mountPath: /tmp/conf
    autoscaling:
      maxReplicas: 1
  server:
    ingress:
      annotations:
        alb.ingress.kubernetes.io/group.name: external
        alb.ingress.kubernetes.io/scheme: internet-facing
    httproute:
      hostnames:
        - "{{ .module.name }}.{{ .toutput.route53.pub_domain }}"
  extraObjects:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: "{{ .module.name }}-repo-server-local-sources"
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
  global:
    securityContext:
      fsGroup: 999
    domain: |
      {{ .module.name }}.{{ .toutput.route53.pub_domain }}
  configs:
    rbac:
      policy.csv: |
        g, web-admin-258953744228679165, role:admin
        g, web-admin-390876846557773807, role:admin
        p, infralib, applications, get, */*, allow
        p, infralib, applications, sync, */*, allow
        p, infralib, projects, get, *, allow
      policy.default: role:readonly
    cm:
      dex.config: |
        connectors:
          - type: oidc
            id: zitadel
            name: Zitadel
            config:
              issuer: https://entigo-dev-if3upz.zitadel.cloud
              clientID: "390876939453361249"
              clientSecret: "{{ .output-custom./argocd-biz/clientSecret }}"
              insecureEnableGroups: true
              scopes:
                - openid
                - profile
                - email
                - groups

argocd-apps:
    applications:
        extra:
            destination:
                namespace: "extra"
                server: https://kubernetes.default.svc
            namespace: "{{ .module.name }}"
            project: default
            source:
                helm:
                    valueFiles:
                        - values.yaml
                    values: |
                      image:
                        registry: '{{ .toptout.ecr-proxy.hub_registry | "docker.io" }}/nginxinc/nginx-unprivileged'
                path: modules/k8s/hello-world
                repoURL: https://github.com/entigolabs/entigo-infralib-release.git
                targetRevision: main
            syncPolicy:
                automated: {}
                syncOptions:
                    - CreateNamespace=true
                managedNamespaceMetadata:
                  labels:
                    pod-security.kubernetes.io/enforce: restricted
                    pod-security.kubernetes.io/warn: restricted
