apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: {{ .Name }}
  namespace: {{ .Namespace }}
spec:
  refreshInterval: 1m
  deletionPolicy: Delete
  secretStoreRefs:
    - name: {{ .Store }}
      kind: ClusterSecretStore
  selector:
    secret:
      name: {{ .Source }}
  data:
    - match:
        secretKey: value
        remoteRef:
          remoteKey: {{ .RemoteKey }}
{{- if .Zone }}
      metadata:
        apiVersion: kubernetes.external-secrets.io/v1alpha1
        kind: PushSecretMetadata
        spec:
          tags:
            "entigo:zone": "{{ .Zone }}"
{{- end }}
