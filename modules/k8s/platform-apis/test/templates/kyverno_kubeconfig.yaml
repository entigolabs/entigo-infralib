apiVersion: v1
kind: Config
clusters:
- cluster:
    certificate-authority-data: {{ .CA }}
    server: {{ .Server }}
  name: role-cluster
contexts:
- context:
    cluster: role-cluster
    user: role-user
  name: role-context
current-context: role-context
users:
- name: role-user
  user:
    token: {{ .Token }}