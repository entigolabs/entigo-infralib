apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: b-denied
  namespace: b-apps
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: b-apps
  project: b
  source:
    # Repo not in the environment sourceRepos allow-list — ArgoCD must reject this.
    chart: platform-apis-test-b-apps
    repoURL: ghcr.io/not-entigolabs
    targetRevision: '*.*.*-0'
    helm:
      releaseName: b-denied
  syncPolicy: {}
