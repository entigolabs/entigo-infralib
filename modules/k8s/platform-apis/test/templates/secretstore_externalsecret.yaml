apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Name }}
  namespace: {{ .Namespace }}
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: {{ .Store }}
    kind: ClusterSecretStore
  target:
    name: {{ .Name }}
  data:
    - secretKey: value
      remoteRef:
        key: {{ .RemoteKey }}
