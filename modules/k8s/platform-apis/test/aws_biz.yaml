platform-apis:
  zone:
    clusterResourceWhitelist:
    - group: '*'
      kind: '*'
    environmentConfig:
      granularEgress: true
      roleMapping:
        - roleRef: maintainer
          groups: ["web-read-only-343159627493470238", "maintainer"]
      appProject:
        namespaceResourceBlacklist: []
        namespaceResourceWhitelist:
        - group: '*'
          kind: '*'
      tags:
        etag: etest
        eutag: eutest
  artifact:
    environmentConfig:
      lifecycleRules:
        - tagPrefixes:
            - release
            - DEPLOYED
          keepCount: 10
        - tagPatterns:
            - "*.*.*"
          keepCount: 30
        - tagPatterns:
            - "feature-*"
            - "*-cloud"
          keepCount: 5
        - untagged: true
          expireAfterDays: 7
        - expireAfterDays: 90
  kafka:
    install: true
    environmentConfig:
      kafkaNamespace: crossplane-kafka-biz
  mariadb:
    install: true
  rabbitmq:
    install: true
  database:
    environmentConfig:
      postgresBackupBeforeDeletion: false
      mariaDBBackupBeforeDeletion: false
      valkeyBackupBeforeDeletion: false
      backupRetentionPeriod: 0
  functions:
    function-go-templating:
      install: true
    function-auto-ready:
      install: true
    function-sequencer:
      install: true
    function-patch-and-transform:
      install: true
    function-extra-resources:
      install: true
