global:
  # Restrict every Zone's AppProject to the test chart registry so the negative
  # sourcerepos-allow-list check can prove an out-of-list repo is rejected.
  sourceRepos:
  - ghcr.io/entigolabs
platform-apis:
  zone:
    # The sweep that picks up edits to an existing Application runs on this interval, so the
    # tests would otherwise wait 10 minutes to see one.
    namespaceMetadata:
      syncInterval: 1m
    environmentConfig:
      granularEgress: false
  database:
    environmentConfig:
      backupBeforeDeletion: false
      backupRetentionPeriod: 0
  functions:
    function-go-templating:
      install: false
    function-auto-ready:
      install: false
    function-sequencer:
      install: false
    function-patch-and-transform:
      install: false
