global:
  # Restrict every Zone's AppProject to the test chart registry so the negative
  # sourcerepos-allow-list check can prove an out-of-list repo is rejected.
  sourceRepos:
  - ghcr.io/entigolabs
platform-apis:
  # pri runs zone access from RoleGrants in kcp root:martin:pri; biz stays on roleMapping groups.
  authz:
    enabled: true
    organization: martin
    workspace: pri
  zone:
    # The sweep that picks up edits to an existing Application runs on this interval, so the
    # tests would otherwise wait 10 minutes to see one.
    namespaceMetadata:
      syncInterval: 1m
    environmentConfig:
      granularEgress: false
      # Also set by the infralib agent_input, repeated so these tests do not depend on that release
      secretStoreNamespace: "{{ .tmodule.external-secrets }}"
      # `roleMapping` and `namespaceRole` ignored in authz mode, needed if pri is switched back.
      roleMapping:
        - roleRef: maintainer
          groups: ["web-read-only-343159627493470238", "maintainer"]
      namespaceRole:
        # e2e: exercises additionalRules (see aws_biz.yaml).
        additionalRules:
          - apiGroups: ["example.entigo.com"]
            resources: ["widgets"]
            verbs: ["create", "get"]
  database:
    environmentConfig:
      postgresBackupBeforeDeletion: false
      mariaDBBackupBeforeDeletion: false
      valkeyBackupBeforeDeletion: false
      backupRetentionPeriod: 0
  functions:
    function-go-templating:
      install: false
    function-auto-ready:
      install: false
    function-sequencer:
      install: false
    function-patch-and-transform:
      install: false
