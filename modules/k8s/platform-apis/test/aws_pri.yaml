platform-apis:
  zone:
    # The sweep that picks up edits to an existing Application runs on this interval, so the
    # tests would otherwise wait 10 minutes to see one.
    namespaceMetadata:
      syncInterval: 1m
    environmentConfig:
      granularEgress: false
      roleMapping:
        - roleRef: maintainer
          groups: ["web-read-only-343159627493470238", "maintainer"]
  database:
    environmentConfig:
      backupBeforeDeletion: false
      backupRetentionPeriod: 0
  functions:
    function-go-templating:
      install: false
    function-auto-ready:
      install: false
    function-sequencer:
      install: false
    function-patch-and-transform:
      install: false
    function-extra-resources:
      install: false
