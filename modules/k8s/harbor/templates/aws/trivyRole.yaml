{{- /*
The IAM role Harbor's trivy assumes through IRSA to download the vulnerability databases
from the ECR pull through cache. Only created when the platform has an ecr-proxy.
*/ -}}
{{- if and (eq .Values.global.cloudProvider "aws") .Values.global.aws.ecrPolicy }}
apiVersion: iam.aws.upbound.io/v1beta1
kind: Role
metadata:
  name: {{ .Release.Name }}-trivy
  annotations:
    crossplane.io/external-name: "{{ .Release.Name }}-trivy"
    argocd.argoproj.io/sync-wave: '-2'
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  forProvider:
    tags:
      created-by: entigo-infralib
    assumeRolePolicy: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Principal": {
              "Federated": "arn:aws:iam::{{ .Values.global.aws.account }}:oidc-provider/{{ .Values.global.aws.clusterOIDC }}"
            },
            "Action": "sts:AssumeRoleWithWebIdentity",
            "Condition": {
              "StringEquals": {
                "{{ .Values.global.aws.clusterOIDC }}:aud": "sts.amazonaws.com",
                "{{ .Values.global.aws.clusterOIDC }}:sub": "system:serviceaccount:{{ .Release.Namespace }}:{{ .Values.harbor.trivy.serviceAccountName }}"
              }
            }
          }
        ]
      }
  providerConfigRef:
    name: {{ .Values.global.providerConfigRefName }}
{{- end }}
