{{- /*
The service account Harbor's trivy runs as. It carries the IRSA role only when the platform
has an ecr-proxy, which is when the role exists.
*/ -}}
{{- if eq .Values.global.cloudProvider "aws" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.harbor.trivy.serviceAccountName }}
  {{- if .Values.global.aws.ecrPolicy }}
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::{{ .Values.global.aws.account }}:role/{{ .Release.Name }}-trivy
  {{- end }}
{{- end }}
