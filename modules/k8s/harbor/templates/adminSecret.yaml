{{- if .Values.global.generateAdminSecret }}
{{- $secretName := required "harbor.existingSecretAdminPassword must name the generated Secret" .Values.harbor.existingSecretAdminPassword }}
{{- if ne $secretName .Values.harbor.existingSecretSecretKey }}
{{- fail "harbor.existingSecretAdminPassword and harbor.existingSecretSecretKey must name the same Secret when global.generateAdminSecret is true" }}
{{- end }}
# Generated once by External Secrets and never rotated (refreshPolicy: CreatedOnce).
# Harbor reads HARBOR_ADMIN_PASSWORD only when it creates its database and uses
# secretKey to encrypt stored credentials, so neither may change after install.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ .Release.Name }}-admin-password
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  # No symbols: the value goes into curl -u and JSON in the proxy job. Harbor
  # requires upper case, lower case and a digit.
  length: 32
  digits: 5
  symbols: 0
  noUpper: false
  allowRepeat: true
  secretKeys:
    - {{ .Values.harbor.existingSecretAdminPasswordKey }}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ .Release.Name }}-secret-key
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  # Harbor requires exactly 16 characters, and the chart reads the key "secretKey".
  length: 16
  digits: 4
  symbols: 0
  noUpper: false
  allowRepeat: true
  secretKeys:
    - secretKey
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secretName }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  # CreatedOnce leaves an existing Secret alone, so an install that already has
  # an admin password can pre-create this Secret with its current values.
  # Orphan keeps the Secret if the app is removed, as the database PVC may stay.
  refreshPolicy: CreatedOnce
  target:
    name: {{ $secretName }}
    creationPolicy: Orphan
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ .Release.Name }}-admin-password
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ .Release.Name }}-secret-key
{{- end }}
