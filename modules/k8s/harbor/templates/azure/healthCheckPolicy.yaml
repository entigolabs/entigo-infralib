{{- if eq .Values.global.cloudProvider "azure" }}
apiVersion: alb.networking.azure.io/v1
kind: HealthCheckPolicy
metadata:
  name: {{ .Release.Name }}-portal
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  targetRef:
    group: ""
    kind: Service
    name: {{ .Release.Name }}-portal
    namespace: {{ .Release.Namespace }}
  default:
    interval: 5s
    timeout: 5s
    healthyThreshold: 1
    unhealthyThreshold: 3
    http:
      path: /
      match:
        statusCodes:
          - start: 200
            end: 399
---
apiVersion: alb.networking.azure.io/v1
kind: HealthCheckPolicy
metadata:
  name: {{ .Release.Name }}-core
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  targetRef:
    group: ""
    kind: Service
    name: {{ .Release.Name }}-core
    namespace: {{ .Release.Namespace }}
  default:
    interval: 5s
    timeout: 5s
    healthyThreshold: 1
    unhealthyThreshold: 3
    http:
      path: /api/v2.0/ping
      match:
        statusCodes:
          - start: 200
            end: 399
{{- end }}
