job:
  image: '{{ .toptout.ecr-proxy.hub_registry | .toptout.gar-proxy.hub_registry | .toptout.acr-proxy.hub_registry | "docker.io" }}/entigolabs/entigo-infralib-kubectl'
harbor:
  externalURL: "https://{{ .module.name }}.{{ .toptout.route53.pub_domain | .toptout.dns.pub_domain | required }}"
  expose:
    route:
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: '{{ .toptin.aws-alb.global.externalGateway | .toptin.google-gateway.global.externalGateway | .toptin.azure-gateway.global.externalGateway | required }}'
          namespace: '{{ .toptmodule.aws-alb | .toptmodule.google-gateway | .toptmodule.azure-gateway | required }}'
          sectionName: https
      hosts:
        - "{{ .module.name }}.{{ .toptout.route53.pub_domain | .toptout.dns.pub_domain | required }}"

  portal:
    image:
      repository: '{{ .toptout.ecr-proxy.hub_registry | .toptout.gar-proxy.hub_registry | .toptout.acr-proxy.hub_registry | "docker.io" }}/goharbor/harbor-portal'
  core:
    image:
      repository: '{{ .toptout.ecr-proxy.hub_registry | .toptout.gar-proxy.hub_registry | .toptout.acr-proxy.hub_registry | "docker.io" }}/goharbor/harbor-core'
  jobservice:
    image:
      repository: '{{ .toptout.ecr-proxy.hub_registry | .toptout.gar-proxy.hub_registry | .toptout.acr-proxy.hub_registry | "docker.io" }}/goharbor/harbor-jobservice'
  registry:
    registry:
      image:
        repository: '{{ .toptout.ecr-proxy.hub_registry | .toptout.gar-proxy.hub_registry | .toptout.acr-proxy.hub_registry | "docker.io" }}/goharbor/registry-photon'
    controller:
      image:
        repository: '{{ .toptout.ecr-proxy.hub_registry | .toptout.gar-proxy.hub_registry | .toptout.acr-proxy.hub_registry | "docker.io" }}/goharbor/harbor-registryctl'
  trivy:
    image:
      repository: '{{ .toptout.ecr-proxy.hub_registry | .toptout.gar-proxy.hub_registry | .toptout.acr-proxy.hub_registry | "docker.io" }}/goharbor/trivy-adapter-photon'
    # The vulnerability databases come through the ECR pull through cache of Docker Hub when
    # the platform has one, so they are fetched inside the region instead of through the NAT
    # gateway. mirror.gcr.io and ghcr.io are the subchart's own defaults: the second entry is
    # only tried when the first one answers with a temporary error.
    dbRepository:
      - '{{ .toptout.ecr-proxy.hub_registry | "mirror.gcr.io" }}/aquasec/trivy-db'
      - "ghcr.io/aquasecurity/trivy-db"
    javaDBRepository:
      - '{{ .toptout.ecr-proxy.hub_registry | "mirror.gcr.io" }}/aquasec/trivy-java-db'
      - "ghcr.io/aquasecurity/trivy-java-db"
  database:
    internal:
      image:
        repository: '{{ .toptout.ecr-proxy.hub_registry | .toptout.gar-proxy.hub_registry | .toptout.acr-proxy.hub_registry | "docker.io" }}/goharbor/harbor-db'
  redis:
    internal:
      image:
        repository: '{{ .toptout.ecr-proxy.hub_registry | .toptout.gar-proxy.hub_registry | .toptout.acr-proxy.hub_registry | "docker.io" }}/goharbor/valkey-photon'
  exporter:
    image:
      repository: '{{ .toptout.ecr-proxy.hub_registry | .toptout.gar-proxy.hub_registry | .toptout.acr-proxy.hub_registry | "docker.io" }}/goharbor/harbor-exporter'
  nginx:
    image:
      repository: '{{ .toptout.ecr-proxy.hub_registry | .toptout.gar-proxy.hub_registry | .toptout.acr-proxy.hub_registry | "docker.io" }}/goharbor/nginx-photon'
