metadata:
  annotations:
    # Wave 0: earlier than everything else on purpose. cert-manager (wave 1) only checks
    # for the Gateway API CRDs at startup - if they appear afterwards its Gateway API
    # support stays inactive until the pod is restarted - and istiod (wave 1) silently
    # ignores TLSRoute/ReferenceGrant if the CRDs aren't v1.5.x when it starts.
    infralib.entigo.io/sync-wave: "0"
spec:
  syncPolicy:
    syncOptions:
    # ServerSideApply: these CRDs are far too large for client-side apply, which would
    # try to stash the whole manifest in the last-applied-configuration annotation and
    # blow the 262144-byte limit.
    - ServerSideApply=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/warn: restricted
        tenancy.entigo.com/zone: infralib
