{{- if and (eq .Values.global.cloudProvider "azure") .Values.global.createClusterSecretStore }}
apiVersion: identity.entigo.com/v1alpha1
kind: WorkloadIdentity
metadata:
  name: secret-manager-operator
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  serviceAccountName: secret-manager-operator
  azurePermissions:
    - role: Key Vault Secrets User
      scope: {{ required "global.azure.vaultId" .Values.global.azure.vaultId }}
{{- end }}
