# Cloud neutral defaults. Keys under `tempo.tempo:` mirror the upstream chart's
# own `tempo:` config block 1:1 — verified against
# https://github.com/grafana-community/helm-charts/blob/tempo-2.2.3/charts/tempo/values.yaml
# (the version pinned in Chart.yaml). Re-diff this file whenever that version
# is bumped: `distributor`/`compactor` are NOT keys in this chart's values —
# the config template fills `distributor.receivers` from `tempo.tempo.receivers`
# and `compactor.compaction.block_retention` from `tempo.tempo.retention`.

global:
  cloudProvider: ""
  providerConfigRefName: ""
  bucketName: "tempo"
  prefix: ""

tempo:
  fullnameOverride: tempo
  nameOverride: tempo

  serviceAccount:
    create: false # we create our own SA in templates/aws/ and templates/google/serviceAccount.yaml
    name: tempo

  securityContext:
    seccompProfile:
      type: RuntimeDefault

  ingress:
    enabled: false

  networkPolicy:
    enabled: false # this repo owns network policy for the module instead, see templates/networkpolicy.yaml

  persistence:
    enabled: false # single binary keeps its working set on local disk + S3; no PVC needed to start

  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 90
          preference:
            matchExpressions:
              - key: mon
                operator: In
                values:
                  - "true"
        - weight: 10
          preference:
            matchExpressions:
              - key: tools
                operator: In
                values:
                  - "true"
  tolerations:
    - key: "mon"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
    - key: "tools"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"

  # The upstream chart's `tempo:` block: container settings (resources,
  # extraEnv, probes, securityContext) plus Tempo config keys (retention,
  # storage, server, overrides) that the chart's `config:` template reads.

  tempo:
    # Container-level half of the "restricted" Pod Security level set on the
    # namespace in argo-apps.yaml; the pod-level half comes from the chart.
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL

    resources:
      limits:
        cpu: 1
        memory: 1Gi
        ephemeral-storage: 1Gi
      requests:
        cpu: 50m
        memory: 256Mi
        ephemeral-storage: 100Mi

    # Chart default is 24h; 14 days is a cheap first default for a new
    # install, tune once real trace volume is known.
    retention: 336h

    storage:
      trace:
        backend: local # overridden to "s3" in values-aws.yaml and "gcs" in values-google.yaml
        local:
          path: /var/tempo/traces
        wal:
          path: /var/tempo/wal
        s3:
          endpoint: null
          region: ""
          bucket: ""
          access_key: null
          secret_key: null
          insecure: false
          forcepathstyle: false

    # Chart default already enables both jaeger and otlp receivers; only
    # override `receivers` here if you need to narrow that down.

    server:
      http_listen_port: 3200

    # Chart default uses /ready for both probes, which kube-score rejects
    # (pod-probes). Liveness hits /metrics, which answers as soon as the HTTP
    # server is up, so a slow /ready (e.g. while replaying the WAL) takes the
    # pod out of the Service instead of restarting it. (tcpSocket isn't an
    # option: a parent chart can't null out the subchart's httpGet default.)
    livenessProbe:
      httpGet:
        path: /metrics
        port: 3200
      initialDelaySeconds: 60
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
      successThreshold: 1
    readinessProbe:
      httpGet:
        path: /ready
        port: 3200
      initialDelaySeconds: 20
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
      successThreshold: 1
