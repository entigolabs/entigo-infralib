# Cloud neutral defaults. Keys under `tempo.tempo:` mirror the upstream chart's
# own `tempo:` config block 1:1 — verified against
# https://github.com/grafana-community/helm-charts/blob/tempo-2.2.3/charts/tempo/values.yaml
# (the version pinned in Chart.yaml). Re-diff this file whenever that version
# is bumped: `distributor`/`compactor` are NOT keys in this chart's values —
# the config template fills `distributor.receivers` from `tempo.tempo.receivers`
# and `compactor.compaction.block_retention` from `tempo.tempo.retention`.

global:
  cloudProvider: ""
  providerConfigRefName: ""
  bucketName: "tempo"
  prefix: ""

tempo:
  fullnameOverride: tempo
  nameOverride: tempo

  serviceAccount:
    create: false # we create our own SA in templates/aws/serviceAccount.yaml
    name: tempo

  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault

  ingress:
    enabled: false

  networkPolicy:
    enabled: false # this repo owns network policy for the module instead, see templates/

  persistence:
    enabled: false # single binary keeps its working set on local disk + S3; no PVC needed to start

  resources:
    limits:
      cpu: 1
      memory: 1Gi
      ephemeral-storage: 1Gi
    requests:
      cpu: 50m
      memory: 256Mi
      ephemeral-storage: 100Mi

  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 90
          preference:
            matchExpressions:
              - key: mon
                operator: In
                values:
                  - "true"
        - weight: 10
          preference:
            matchExpressions:
              - key: tools
                operator: In
                values:
                  - "true"
  tolerations:
    - key: "mon"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
    - key: "tools"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"

  # The upstream chart's own config block — this whole map is dumped verbatim
  # into Tempo's config file, so keys here are tempo.tempo.*, not tempo.*.
  tempo:
    # Chart default is 24h; 14 days is a cheap first default for a new
    # install, tune once real trace volume is known.
    retention: 336h

    storage:
      trace:
        backend: local # overridden to "s3" in values-aws.yaml
        local:
          path: /var/tempo/traces
        wal:
          path: /var/tempo/wal
        s3:
          endpoint: null
          region: ""
          bucket: ""
          access_key: null
          secret_key: null
          insecure: false
          forcepathstyle: false

    # Chart default already enables both jaeger and otlp receivers; only
    # override `receivers` here if you need to narrow that down.

    server:
      http_listen_port: 3200
