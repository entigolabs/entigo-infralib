{{- if eq .Values.global.cloudProvider "google" }}

# Workload Identity Federation: the "tempo" Kubernetes ServiceAccount is granted
# access to the bucket directly, no Google service account is needed.
apiVersion: storage.gcp.upbound.io/v1beta2
kind: BucketIAMMember
metadata:
  name: {{ .Release.Name }}-storage-object-admin
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  forProvider:
    bucketRef:
      name: {{ .Values.global.bucketName }}
    member: serviceAccount:{{ .Values.global.google.projectID }}.svc.id.goog[{{ .Release.Namespace }}/{{ .Values.tempo.serviceAccount.name }}]
    role: roles/storage.objectAdmin
  providerConfigRef:
    name: {{ .Values.global.providerConfigRefName }}

{{- end }}
