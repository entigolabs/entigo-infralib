 
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-delete-gp2
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-delete-gp2
rules:
- apiGroups: ["storage.k8s.io"]
  resources: ["storageclasses"]
  verbs: ["list", "get", "delete", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-delete-gp2
subjects:
- kind: ServiceAccount
  name: {{ .Release.Name }}-delete-gp2
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ .Release.Name }}-delete-gp2
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-delete-gp2
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    kube-score/ignore: pod-networkpolicy
spec:
  activeDeadlineSeconds: 600
  parallelism: 1
  completions: 1
  template:
    spec:
      serviceAccountName: {{ .Release.Name }}-delete-gp2
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 90
            preference:
              matchExpressions:
              - key: tools
                operator: In
                values:
                - "true"
      tolerations:
        - key: "tools"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: kubectl
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        image: {{ .Values.job.image }}:{{ .Values.job.tag }}
        resources:
          limits:
            cpu: 1000m
            memory: 512Mi
            ephemeral-storage: 200Mi
          requests:
            cpu: 1m
            memory: 16Mi
            ephemeral-storage: 20Mi
        command:
        - /bin/bash
        - -ec
        # Replace the EKS-provided in-tree gp2 class with a copy of gp2-retain backed by the EBS CSI driver.
        # Bound PVs are not affected by deleting or recreating their StorageClass (the class is only read at
        # provisioning and expansion time), so this runs regardless of existing volumes. The replacement is
        # rendered before the delete so a missing gp2-retain cannot leave the cluster without a gp2 class.
        - |
          set -o pipefail
          SC="{{ .Values.global.sc_prefix }}gp2"
          if kubectl get sc "$SC" -o jsonpath='{.provisioner}' 2>/dev/null | grep -q '^kubernetes.io/aws-ebs$'; then
            NEW="$(kubectl get sc {{ .Values.global.sc_prefix }}gp2-retain -o json | jq --arg n "$SC" '.metadata.name = $n | del(.metadata.labels."argocd.argoproj.io/instance")')"
            if [ -z "$NEW" ]; then echo "{{ .Values.global.sc_prefix }}gp2-retain not found, leaving $SC in place"; exit 1; fi
            kubectl delete sc "$SC"
            echo "$NEW" | kubectl apply -f -
          fi
      restartPolicy: Never
  backoffLimit: 3

