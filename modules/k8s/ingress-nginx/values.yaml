ingress-nginx:
  controller:
    ingressClassResource:
      name: nginx
      default: true
    # Sets status.loadBalancer on Ingresses from the controller Service's LB address -
    # external-dns and cert-manager's HTTP-01 self-check both rely on this.
    publishService:
      enabled: true
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 90
            preference:
              matchExpressions:
                - key: tools
                  operator: In
                  values:
                    - "true"
    tolerations:
      - key: "tools"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
    resources:
      limits:
        cpu: 1000m
        memory: 512Mi
        ephemeral-storage: 1Gi
      requests:
        cpu: 10m
        memory: 128Mi
        ephemeral-storage: 24Mi
    admissionWebhooks:
      patch:
        tolerations:
          - key: "tools"
            operator: "Equal"
            value: "true"
            effect: "NoSchedule"
