{{- if eq .Values.global.cloudProvider "oracle" }}
# Serves the server's public key over HTTP, so a client can fetch it without anyone copying
# secrets around by hand. Same purpose as templates/google/{service,http-route}.yaml.
#
# A Service plus an HTTPRoute rather than an extra port on the WireGuard load balancer, which is
# how aws does it: that load balancer is an OCI *network* load balancer, pure layer 4 with no
# TLS termination, so there is no way to attach the wildcard certificate to it. The public
# oracle-gateway already terminates TLS for every other app, so the key rides along there
# instead.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-pubkey
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: {{ .Release.Name }}-wireguard
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8080
  type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-pubkey
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.global.oracle.gateway.name }}
      namespace: {{ .Values.global.oracle.gateway.namespace }}
      sectionName: {{ .Values.global.oracle.gateway.sectionName }}
  hostnames:
    - {{ .Values.global.oracle.pubkeyHostname }}
  rules:
    - backendRefs:
        - group: ''
          kind: Service
          name: {{ .Release.Name }}-pubkey
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
{{- end }}
