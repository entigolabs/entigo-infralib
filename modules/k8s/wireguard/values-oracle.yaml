global:
  cloudProvider: "oracle"
  oracle:
    # Filled by agent_input_oracle.yaml.
    # Hostname the pubkey sidecar is served on, through the shared ingress load balancer.
    pubkeyHostname: ""
    # OCID of the wildcard certificate that ingress listener terminates with.
    certificateOcid: ""

wireguard:
  service:
    annotations:
      # WireGuard is UDP, and an OCI *classic* Load Balancer - the one
      # oci-native-ingress-controller drives - carries TCP and HTTP only. A UDP Service has to
      # become a Network Load Balancer, which the OCI cloud-controller-manager selects on this
      # annotation. Without it the Service stays Pending forever with no useful event.
      oci.oraclecloud.com/load-balancer-type: "nlb"
      # The NLB never sees the VCN's security lists, and the CCM will happily edit them if left
      # to its own devices. None keeps it out, and the NSG below is what actually opens 51820 -
      # wired from modules/oracle/oke's nlb_nsg_id.
      oci-network-load-balancer.oraclecloud.com/security-list-management-mode: "None"
      oci.oraclecloud.com/oci-network-security-groups: ""
      # NO is-preserve-source, deliberately, and it is worth saying why since it looks like the
      # obvious thing to set.
      #
      # Turning it on starts a chain that defeats itself: OCI then rejects the Service unless
      # externalTrafficPolicy is Local ("is-preserve-source annotation cannot be set when
      # externalTrafficPolicy is set to Cluster", after which the Service sits at <pending>
      # forever and only events say why). With Local, packets reach a node's nodePort still
      # carrying the *client's* public source address - which the node NSG in
      # modules/oracle/oke does not allow, since it accepts the VCN CIDR only. The load
      # balancer reports healthy backends and every packet is dropped at the node.
      #
      # Opening the NSG instead would mean allowing UDP from 0.0.0.0/0 across the whole
      # 30000-32767 nodePort range, because Local allocates that port dynamically and terraform
      # cannot know it. Not worth it: WireGuard identifies peers by public key, not by source
      # address, so clients arriving behind the load balancer's address are no different from
      # clients behind any NAT - which is what PersistentKeepalive already handles.
      #
      # So the default Cluster policy stands, the NLB source-NATs to its own in-VCN address,
      # and the existing node NSG rule accepts it.

    # No extraPorts, unlike aws. There the public key is served on the NLB's 443 with
    # aws-load-balancer-ssl-cert, but an OCI network load balancer is pure layer 4 with no TLS
    # termination at all, so there is no certificate to attach. The pubkey goes through the
    # ordinary ingress instead - templates/oracle/ - which is also what google does with an
    # HTTPRoute rather than an extra port.
