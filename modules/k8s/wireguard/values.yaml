global:
  cloudProvider: ""

  # Public key download route, google only. On AWS the public key is served on
  # an extra TCP 443 port of the wireguard NLB, which terminates TLS with an
  # ACM certificate. Google's passthrough load balancer cannot terminate TLS,
  # and it takes a regional address while the external gateway is global, so
  # the two can share neither an address nor a hostname. All three are filled
  # from agent_input_google.yaml, from google-gateway.
  pubkeyHostname: ""
  gateway:
    name: ""
    namespace: ""

wireguard:
  wireguard:
    serverAddress: ""
    serverCidr: ""
    clients: []
  image:
    tag: "20260617-f411a1e"
    pullPolicy: IfNotPresent
  initContainer:
    image:
      tag: "1.37.0"
  replicaCount: 2
  disruptionBudget:
    minAvailable: 1
  autoscaling:
    enabled: false
  metrics:
    enabled: false
    serviceMonitor:
      enabled: false
  healthSideCar:
    enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
        ephemeral-storage: 8Mi
      limits:
        cpu: 100m
        memory: 256Mi
        ephemeral-storage: 128Mi
    service:
      enabled: false
  podAnnotations:
    kube-score/ignore: pod-networkpolicy,pod-probes,container-security-context-privileged
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
      ephemeral-storage: 8Mi
    limits:
      cpu: 1000m
      memory: 128Mi
      ephemeral-storage: 128Mi
  keygenJob:
    useWireguardManager: true
    wireguardMgrImage:
      tag: 20260612-d825c4b
      pullPolicy: IfNotPresent
    image:
      tag: 20250626-7d8d487
      pullPolicy: IfNotPresent
    podAnnotations:
      kube-score/ignore: pod-networkpolicy,pod-probes
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 90
            preference:
              matchExpressions:
                - key: tools
                  operator: In
                  values:
                    - "true"
    tolerations:
      - key: "tools"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      - key: "mon"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
    containerSecurityContext:
      capabilities:
        drop:
          - ALL
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 90
          preference:
            matchExpressions:
              - key: tools
                operator: In
                values:
                  - "true"
        - weight: 10
          preference:
            matchExpressions:
              - key: mon
                operator: In
                values:
                  - "true"
  tolerations:
    - key: "tools"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
    - key: "mon"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
