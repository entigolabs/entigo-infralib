global:
  azure:
    agcSubnetIds:
      - "{{ .toutput.vpc.public_agc_subnets[0] }}"
certificateIssuer: '{{ .toptin.cert-manager.clusterIssuer.name | "letsencrypt" }}'
gateways:
  external:
    domain: "{{ .toutput.dns.pub_domain }}"
  internal:
    domain: "{{ .toutput.dns.int_domain }}"
    annotations:
      alb.networking.azure.io/alb-id: "{{ .toutput.agc.agc_id }}"
    addresses:
      - type: alb.networking.azure.io/alb-frontend
        value: "{{ .toutput.agc.frontend_name }}"
  service:
    enabled: '{{ .toutput.vpc.service_agc_subnet_names }}'
    domain: "{{ .toutput.dns.int_domain }}"
    annotations:
      alb.networking.azure.io/alb-id: "{{ .optout.infra.agc-service.agc_id }}"
    addresses:
      - type: alb.networking.azure.io/alb-frontend
        value: "{{ .optout.infra.agc-service.frontend_name }}"
alb-controller:
  albController:
    namespace: "{{ .module.name }}"
    podIdentity:
      clientID: "{{ .toutput.aks.alb_controller_client_id }}"
