{{- if .Values.applicationLoadBalancer.create }}
apiVersion: alb.networking.azure.io/v1
kind: ApplicationLoadBalancer
metadata:
  name: {{ .Release.Name }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  {{- if not .Values.global.azure.agcSubnetIds }}
  {{- fail "global.azure.agcSubnetIds must list the AGC subnet" }}
  {{- end }}
  associations:
    {{- toYaml .Values.global.azure.agcSubnetIds | nindent 4 }}
{{- end }}
