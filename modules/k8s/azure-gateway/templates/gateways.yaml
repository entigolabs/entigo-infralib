{{- $certs := dict }}
{{- range $name, $_ := .Values.gateways }}
{{- if .enabled }}
{{- if not (hasKey $certs .domain) }}
{{- $certs = set $certs .domain $name }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $name }}-tls
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretName: {{ $name }}-tls
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: {{ $.Values.certificateIssuer }}
  dnsNames:
    - {{ .domain }}
    - "*.{{ .domain }}"
  privateKey:
    {{- toYaml $.Values.certificatePrivateKey | nindent 4 }}
{{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $name }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    {{- if not .addresses }}
    alb.networking.azure.io/alb-namespace: {{ $.Release.Namespace }}
    alb.networking.azure.io/alb-name: {{ $.Release.Name }}
    {{- end }}
    {{- range $k, $v := .annotations }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
  {{- with .labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  gatewayClassName: {{ .gatewayClassName }}
  {{- with .addresses }}
  addresses:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            group: ""
            name: {{ index $certs .domain }}-tls
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
{{- with .sslPolicy }}
---
apiVersion: alb.networking.azure.io/v1
kind: FrontendTLSPolicy
metadata:
  name: {{ $name }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ $name }}
    namespace: {{ $.Release.Namespace }}
    sectionNames:
      - https
  default:
    policyType:
      type: predefined
      name: {{ . | quote }}
{{- end }}
{{- if .sslRedirect }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}-redirect
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $name }}
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
      matches:
        - path:
            type: PathPrefix
            value: /
{{- end }}
{{- end }}
{{- end }}
