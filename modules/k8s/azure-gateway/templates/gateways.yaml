{{- $albName := .Values.applicationLoadBalancer.name | default .Release.Name }}
{{- $albNamespace := .Values.applicationLoadBalancer.namespace | default .Release.Namespace }}
{{- range $name, $cfg := .Values.gateways }}
{{- if and (kindIs "map" $cfg) $cfg.enabled }}
{{- $gateway := printf "%s-%s" $.Release.Name $name }}
{{- $secret := printf "%s-tls" $gateway }}
{{- $domain := required (printf "gateways.%s.domain" $name) $cfg.domain }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $secret }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretName: {{ $secret }}
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: {{ $.Values.certificateIssuer }}
  dnsNames:
    - {{ $domain | quote }}
    - {{ printf "*.%s" $domain | quote }}
  privateKey:
    {{- toYaml $.Values.certificatePrivateKey | nindent 4 }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $gateway }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    alb.networking.azure.io/alb-namespace: {{ $albNamespace }}
    alb.networking.azure.io/alb-name: {{ $albName }}
    {{- range $k, $v := $cfg.annotations }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
  {{- with $cfg.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  gatewayClassName: {{ required (printf "gateways.%s.gatewayClassName" $name) $cfg.gatewayClassName }}
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            group: ""
            name: {{ $secret }}
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
{{- with $cfg.sslPolicy }}
---
apiVersion: alb.networking.azure.io/v1
kind: FrontendTLSPolicy
metadata:
  name: {{ $gateway }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ $gateway }}
    namespace: {{ $.Release.Namespace }}
    sectionNames:
      - https
  default:
    policyType:
      type: predefined
      name: {{ . | quote }}
{{- end }}
{{- if or (not (hasKey $cfg "sslRedirect")) $cfg.sslRedirect }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $gateway }}-redirect
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $gateway }}
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
      matches:
        - path:
            type: PathPrefix
            value: /
{{- end }}
{{- end }}
{{- end }}
