{{- if eq .Values.global.cloudProvider "oracle" }}
# Plain ServiceAccount with no cloud identity attached. aws annotates this with an IRSA role
# and google pairs it with a GCP service account, both so mimir can reach object storage as
# itself. Neither pattern is available here: mimir authenticates with a Customer Secret Key
# because OCI's S3-compatibility endpoint accepts nothing else, so the credential is
# templated straight into mimir.config instead (see templates/oracle/credentials.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ index .Values "mimir-distributed" "serviceAccount" "name" }}
  namespace: {{ .Release.Namespace }}
{{- end }}
