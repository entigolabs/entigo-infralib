{{- if eq .Values.global.cloudProvider "oracle" }}
{{- $iamName := printf "%s-%s" .Values.global.prefix .Release.Name }}
# IAM policy granting mimir's classic tenancy User read/write on its own bucket only.
#
# Why mimir needs a classic User at all, rather than the Workload Identity every other Oracle
# module here uses: mimir's blocks_storage/ruler_storage only support a handful of named
# backends (s3 among them), and OCI has no OCI-native one - so the only route to Object
# Storage is the S3-compatibility endpoint, which authenticates solely with a Customer Secret
# Key, a credential of a *user*. Same situation as modules/k8s/loki.
#
# Minting a User (or a Group, or an Identity Domain to hold either compartment-scoped) is a
# tenancy-root-only operation with no compartment-scoped or workload-identity equivalent - see
# modules/oracle/oke's comment above oci_identity_policy.controllers. So this module creates
# none of that: the client creates the classic User + CustomerSecretKey once, manually, with
# their own tenancy access, puts the User in the classic Group named below, and hands the key
# to the agent via `ei-agent add-custom --key=mimir-attribute-id --value=<the access key>` and
# `--key=mimir-attribute-key --value=<key secret>` - the S3-compatibility endpoint signs
# requests the AWS way, so `mimir-attribute-id` must be the access key `oci iam
# customer-secret-key list` shows as `id`, not any other identifier the Console may also show
# for this resource - see agent_input_oracle.yaml, which reads those same two fixed keys back
# via the agent's output-custom replacement tag (never write that tag literally in this file -
# Helm templates comments too, and the tag's hyphen is not a legal Go template field
# character). What this module *can* create, compartment-scoped, is the Policy granting that
# (client-managed) Group access to this one bucket - creating a Policy is the one thing every
# identity in this compartment is already trusted to do.
#
# NOTE: the output-custom value renders as a literal string wherever it's referenced, so this
# key ends up in the rendered Application manifest (and the agent's git repo), unlike a
# Kubernetes-Secret-only credential. Accepted tradeoff for now, same as loki - revisit if that
# stops being acceptable.
apiVersion: identity.oci.upbound.io/v1alpha1
kind: Policy
metadata:
  name: {{ .Release.Name }}
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  forProvider:
    compartmentId: {{ .Values.global.oracle.compartmentId }}
    name: {{ $iamName }}
    description: Grants mimir's user read/write on its own bucket only
    freeformTags:
      created-by: "entigo-infralib"
    statements:
      # Scoped to this one bucket by name. inspect buckets is needed separately because
      # manage objects does not imply the ability to see the bucket it lives in. A classic
      # (non-domain) group is referenced by plain name, unlike a domain-scoped one.
      - Allow group {{ .Values.global.oracle.serviceAccountGroupName }} to manage objects in compartment id {{ .Values.global.oracle.compartmentId }} where target.bucket.name='{{ .Values.global.bucketName }}'
      - Allow group {{ .Values.global.oracle.serviceAccountGroupName }} to inspect buckets in compartment id {{ .Values.global.oracle.compartmentId }}
  providerConfigRef:
    name: {{ .Values.global.providerConfigRefName }}
{{- end }}
