{{- if eq .Values.global.cloudProvider "azure" }}
{{- $scope := .Values.global.bucketName | replace "-" "" | trunc 63 }}
{{- with .Values.global.azure.telemetryKeyId }}
# Container encrypted with the kms telemetry key instead of the storage account key
apiVersion: storage.azure.upbound.io/v1beta1
kind: EncryptionScope
metadata:
  name: {{ $scope }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  deletionPolicy: Orphan
  forProvider:
    storageAccountId: {{ $.Values.global.azure.storageAccountId }}
    source: Microsoft.KeyVault
    keyVaultKeyId: {{ . }}
  providerConfigRef:
    name: {{ $.Values.global.providerConfigRefName }}
---
{{- end }}
apiVersion: storage.azure.upbound.io/v1beta1
kind: Container
metadata:
  name: {{ .Values.global.bucketName }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  deletionPolicy: Orphan
  forProvider:
    storageAccountId: {{ required "global.azure.storageAccountId" .Values.global.azure.storageAccountId }}
    containerAccessType: private
    {{- if .Values.global.azure.telemetryKeyId }}
    defaultEncryptionScope: {{ $scope }}
    encryptionScopeOverrideEnabled: false
    {{- end }}
  providerConfigRef:
    name: {{ .Values.global.providerConfigRefName }}
{{- end }}
