{{- if and (eq .Values.global.cloudProvider "aws") .Values.global.aws.migrateBlocksPrefix }}
# Mimir used to keep its blocks at the root of the bucket on aws and now keeps them under
# blocks/, next to ruler/ and alertmanager/ (storage_prefix in values-aws.yaml), as google
# and azure always have. Blocks written before that are still at the root, where Mimir no
# longer looks, so this moves them: every top level prefix that is not part of the new layout
# is a tenant of the old one and goes to blocks/<tenant>/, the old ruler prefix rules/ goes
# to ruler/rules/. Set global.aws.migrateBlocksPrefix to false once it has run.
#
# A PostSync hook, so it only starts once every Mimir pod runs with the new prefix and
# nothing writes to the root any more. It runs after every sync and finds nothing to do once
# the root is clean; a run that is interrupted is picked up by the next one. The first run
# copies every object once, which on a large bucket outlasts the agent's wait for the
# Application - the Job keeps going and the next agent run finds it finished.
# The moved blocks show up in queries when the compactor next rewrites the bucket index
# (15 minutes by default).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-blocks-prefix
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    kube-score/ignore: pod-networkpolicy
spec:
  activeDeadlineSeconds: 86400
  parallelism: 1
  completions: 1
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: {{ index .Values "mimir-distributed" "serviceAccount" "name" }}
      restartPolicy: Never
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 90
            preference:
              matchExpressions:
              - key: tools
                operator: In
                values:
                - "true"
      tolerations:
        - key: "tools"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
      - name: aws-cli
        image: {{ .Values.job.image }}:{{ .Values.job.tag }}
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        env:
          - name: HOME
            value: /tmp
          - name: AWS_DEFAULT_REGION
            value: {{ .Values.global.aws.region | quote }}
          - name: BUCKET
            value: {{ .Values.global.bucketName | quote }}
        volumeMounts:
          - name: tmp
            mountPath: /tmp
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
            ephemeral-storage: 200Mi
          requests:
            cpu: 10m
            memory: 128Mi
            ephemeral-storage: 20Mi
        command:
        - /bin/sh
        - -ec
        - |
          aws configure set default.s3.max_concurrent_requests 50
          # Fails the Job on a listing error instead of reporting an empty root.
          aws s3api list-objects-v2 --bucket "$BUCKET" --delimiter / --query 'CommonPrefixes[].Prefix' --output text > /tmp/listing
          tr '\t' '\n' < /tmp/listing | sed 's|/$||' > /tmp/prefixes
          while read -r tenant; do
            case "$tenant" in
              # No prefixes at all.
              ""|None) continue ;;
              # The new layout, and the cluster seed, which the new layout has its own copy of.
              blocks|ruler|alertmanager|__mimir_cluster) continue ;;
              # The ruler's rule groups, from when the ruler shared the root with the blocks.
              rules)
                echo "moving rules/ to ruler/rules/"
                aws s3 mv "s3://$BUCKET/rules/" "s3://$BUCKET/ruler/rules/" --recursive --copy-props none --only-show-errors
                continue ;;
            esac
            echo "moving $tenant/ to blocks/$tenant/"
            # --copy-props none: a multipart copy otherwise reads and writes object tags, which
            # the mimir role is not allowed to and the blocks do not have.
            # Listed and moved in key order, so a block's meta.json arrives after its chunks
            # and index: the block only becomes visible under blocks/ once it is complete.
            # The bucket index is left behind, the compactor writes a new one that also knows
            # the blocks written since the change.
            aws s3 mv "s3://$BUCKET/$tenant/" "s3://$BUCKET/blocks/$tenant/" --recursive --copy-props none --only-show-errors --exclude "bucket-index.json.gz"
            aws s3 rm "s3://$BUCKET/$tenant/bucket-index.json.gz" --only-show-errors
          done < /tmp/prefixes
          echo "nothing left to move"
{{- end }}
