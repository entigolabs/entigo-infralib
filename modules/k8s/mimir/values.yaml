      enabled: false
    prometheusRule:
      enabled: false
    grafanaAgent:
      enabled: false
  enterprise:
    enabled: false
  tokengenJob:
    enable: false
  graphite:
    enabled: false
  gr-aggr-cache:
    enabled: false
  gr-metricname-cache:
    enabled: false
  continuous_test:
