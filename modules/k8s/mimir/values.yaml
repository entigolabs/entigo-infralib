    tolerations:
      - key: "mon"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      - key: "tools"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"

  query_scheduler:
    enabled: true
    replicas: 2
    podAnnotations:
      kube-score/ignore: pod-probes,pod-networkpolicy

    resources:
      limits:
        cpu: 2
        memory: 2Gi
        ephemeral-storage: 2Gi
      requests:
        cpu: 100m
        memory: 128Mi
        ephemeral-storage: 128Mi
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 90
            preference:
              matchExpressions:
                - key: mon
                  operator: In
                  values:
                    - "true"
          - weight: 10
            preference:
              matchExpressions:
                - key: tools
                  operator: In
                  values:
                    - "true"
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: mimir
                  app.kubernetes.io/component: query-scheduler
    tolerations:
      - key: "mon"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      - key: "tools"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"

  store_gateway:
    # -- Total number of replicas for the store-gateway across all availability zones
    # If store_gateway.zoneAwareReplication.enabled=false, this number is taken as is.
    # Otherwise each zone starts `ceil(replicas / number_of_zones)` number of pods.
    #   E.g. if 'replicas' is set to 4 and there are 3 zones, then 4/3=1.33 and after rounding up it means 2 pods per zone are started.
    replicas: 3 #1

    podAnnotations:
      kube-score/ignore: pod-probes,pod-networkpolicy

    resources:
      limits:
        cpu: 2
        memory: 2Gi
        ephemeral-storage: 3Gi
      requests:
        cpu: 100m
        memory: 512Mi
        ephemeral-storage: 512Mi
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 90
            preference:
              matchExpressions:
                - key: mon
                  operator: In
                  values:
                    - "true"
          - weight: 10
            preference:
              matchExpressions:
                - key: tools
                  operator: In
                  values:
                    - "true"
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: mimir
                  app.kubernetes.io/component: store-gateway
    tolerations:
      - key: "mon"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      - key: "tools"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
    persistentVolume:
      enabled: true
      accessModes:
        - ReadWriteOnce
      size: 50Gi
    zoneAwareReplication:
      enabled: false

  compactor:
    replicas: 1 #1
    podAnnotations:
      kube-score/ignore: pod-probes,pod-networkpolicy

    resources:
      limits:
        cpu: 2
        memory: 2Gi
        ephemeral-storage: 2Gi
      requests:
        cpu: 100m
        memory: 512Mi
        ephemeral-storage: 128Mi
    persistentVolume:
      enabled: true
      size: 50Gi
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 90
            preference:
              matchExpressions:
                - key: mon
                  operator: In
                  values:
                    - "true"
          - weight: 10
            preference:
