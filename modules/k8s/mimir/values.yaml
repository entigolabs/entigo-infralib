global:
  cloudProvider: ""
  # Route target. All three are filled from agent_input.yaml, from aws-alb on
  # AWS and google-gateway on google.
  createRoute: false
  hostname: ""
  gateway:
    name: ""
    namespace: ""
  providerConfigRefName: ""
  bucketName: "mimir"
  prefix: ""

mimir-distributed:
  fullnameOverride: mimir
  serviceAccount:
    create: false
    name: mimir

  # Chart 6.x defaults to the ingest-storage architecture (distributors -> Kafka
  # -> ingesters). We stay on the classic architecture (distributors push
  # directly to ingesters), matching 5.8.0 behaviour. Revisit when the in-chart
  # Kafka component matures.
  #
  # The chart's own classic-architecture.yaml nulls these keys out, but Helm
  # strips null entries while coalescing subchart values, so the 6.x defaults
  # would survive. They are restored to the Mimir defaults explicitly instead.
  kafka:
    enabled: false

  mimir:
    structuredConfig:
      ingest_storage:
        enabled: false
      distributor:
        # 6.x raises this to 5s because writing to Kafka is slower.
        remote_timeout: 2s
      ingester:
        # 6.x sets this false so ingesters only accept data from Kafka. Mimir
        # only permits disabling it when ingest-storage is enabled.
        push_grpc_method_enabled: true

  alertmanager:
    enabled: false

  distributor:
    replicas: 1

    podAnnotations:
      kube-score/ignore: pod-probes,pod-networkpolicy

    resources:
      limits:
        cpu: 2
        memory: 2Gi
        ephemeral-storage: 2Gi
      requests:
        cpu: 100m
        memory: 512Mi
        ephemeral-storage: 128Mi
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 90
            preference:
              matchExpressions:
                - key: mon
                  operator: In
                  values:
                    - "true"
          - weight: 10
            preference:
              matchExpressions:
                - key: tools
                  operator: In
                  values:
                    - "true"
    tolerations:
      - key: "mon"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      - key: "tools"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"

  ingester:
    replicas: 3 #3
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 90
            preference:
              matchExpressions:
                - key: mon
                  operator: In
                  values:
                    - "true"
          - weight: 10
            preference:
              matchExpressions:
                - key: tools
                  operator: In
                  values:
                    - "true"
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: mimir
                  app.kubernetes.io/component: ingester
    zoneAwareReplication:
      enabled: false
    tolerations:
      - key: "mon"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      - key: "tools"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
    statefulSet:
      enabled: true
    podAnnotations:
      kube-score/ignore: pod-probes,pod-networkpolicy

    resources:
      limits:
        cpu: 2
        memory: 8Gi
        ephemeral-storage: 2Gi
      requests:
        cpu: 100m
        memory: 2Gi
        ephemeral-storage: 128Mi

    persistentVolume:
      enabled: true
      size: 50Gi

  overrides_exporter:
    enabled: true
    replicas: 1
    podAnnotations:
      kube-score/ignore: pod-probes,pod-networkpolicy

    resources:
      limits:
        cpu: 2
        memory: 2Gi
        ephemeral-storage: 2Gi
      requests:
        cpu: 100m
        memory: 128Mi
        ephemeral-storage: 128Mi
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 90
            preference:
              matchExpressions:
                - key: mon
                  operator: In
                  values:
                    - "true"
          - weight: 10
            preference:
              matchExpressions:
                - key: tools
                  operator: In
                  values:
                    - "true"
    tolerations:
      - key: "mon"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      - key: "tools"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"

  ruler:
    enabled: true
    replicas: 1
    podAnnotations:
      kube-score/ignore: pod-probes,pod-networkpolicy

    resources:
      limits:
        cpu: 2
        memory: 2Gi
        ephemeral-storage: 2Gi
      requests:
        cpu: 100m
        memory: 128Mi
        ephemeral-storage: 128Mi
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 90
            preference:
              matchExpressions:
                - key: mon
                  operator: In
                  values:
                    - "true"
          - weight: 10
            preference:
              matchExpressions:
                - key: tools
                  operator: In
                  values:
