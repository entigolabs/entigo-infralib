      - key: "tools"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"

  index-cache:
    enabled: false
    replicas: 1
    allocatedMemory: 2048
    maxItemMemory: 5
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 90
            preference:
