ingressClass:
  service:
    enabled: false

global:
  routingResources: "both" #ingress, both, httproute
  createIngress: false
  createRoute: true
  createType: route
  internalGateway: external

serverHeader: true

accessLogs:
  enabled: true

gateways:
  internal:
    accessLogs:
      enabled: false
