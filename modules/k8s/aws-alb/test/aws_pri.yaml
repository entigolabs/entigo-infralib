ingressClass:
  service:
    enabled: false

global:
  routingResources: "both" #ingress, both, httproute
  createIngress: false
  createRoute: true
  createType: route
  internalGateway: external

serverHeader: true

accessLogs:
  enabled: true

gateways:
  internal:
    accessLogs:
      enabled: false
  external:
    sourceRanges: '"0.0.0.0/0", "10.0.0.0/8"'   # agent list outputs arrive comma-separated and per-element quoted
