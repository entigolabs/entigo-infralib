# IngressClass/IngressClassParams objects, kept while routingResources is "ingress" or "both"
# Deprecated: will be removed once all users have migrated to Gateway API HTTPRoutes
{{- $routing := .Values.global.routingResources | default "ingress" }}
{{- if or (eq $routing "ingress") (eq $routing "both") }}
{{- if .Values.ingressClass.internal.enabled }}
apiVersion: elbv2.k8s.aws/v1beta1
kind: IngressClassParams
metadata:
  name: internal
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  group:
    name: internal
  {{- if .Values.ingressClass.internal.subnets }}
  subnets:
    ids:
      {{- range split "," .Values.ingressClass.internal.subnets }}
      - {{ . | trim | trimAll "\"" }}
      {{- end }}
  {{- end }}
  scheme: internal
  targetType: ip
  listeners:
    {{- range list (list "HTTP" 80) (list "HTTPS" 443) }}
    - protocol: {{ index . 0 }}
      port: {{ index . 1 }}
      listenerAttributes:
        - key: routing.http.response.server.enabled
          value: {{ $.Values.serverHeader | quote }}
    {{- end }}
  {{- if .Values.ingressClass.tags }}
  tags:
    {{- toYaml .Values.ingressClass.tags | nindent 4 }}
  {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: internal
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  controller: ingress.k8s.aws/alb
  parameters:
    apiGroup: elbv2.k8s.aws
    kind: IngressClassParams
    name: internal
---
apiVersion: elbv2.k8s.aws/v1beta1
kind: IngressClassParams
metadata:
  name: internal-nogroup
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  {{- if .Values.ingressClass.internal.subnets }}
  subnets:
    ids:
      {{- range split "," .Values.ingressClass.internal.subnets }}
      - {{ . | trim | trimAll "\"" }}
      {{- end }}
  {{- end }}
  scheme: internal
  targetType: ip
  listeners:
    {{- range list (list "HTTP" 80) (list "HTTPS" 443) }}
    - protocol: {{ index . 0 }}
      port: {{ index . 1 }}
      listenerAttributes:
        - key: routing.http.response.server.enabled
          value: {{ $.Values.serverHeader | quote }}
    {{- end }}
  {{- if .Values.ingressClass.tags }}
  tags:
    {{- toYaml .Values.ingressClass.tags | nindent 4 }}
  {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
