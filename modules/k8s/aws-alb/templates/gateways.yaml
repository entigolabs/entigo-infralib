# Gateway API objects for AWS LBC (controller gateway.k8s.aws/alb, one Gateway = one ALB)
# Created only when routingResources is "httproute" or "both"
{{- $routing := .Values.global.routingResources | default "ingress" }}
{{- if or (eq $routing "httproute") (eq $routing "both") }}
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: alb
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  controllerName: gateway.k8s.aws/alb
# One Gateway (= one shared ALB) per entry in .Values.gateways.
# Any map entry with enabled: true becomes a gateway, so users can add custom
# gateways in values. Each entry must define its own scheme (internal | internet-facing).
# Non-gateway keys like "tags" are skipped by the map + enabled checks.
{{- range $name, $cfg := .Values.gateways }}
{{- if and (kindIs "map" $cfg) $cfg.enabled }}
{{- $scheme := required (printf "gateways.%s.scheme is required (internal | internet-facing)" $name) $cfg.scheme }}
---
# Replaces IngressClassParams {{ $name }}: scheme, subnets, tags
# Also carries settings that used to be per-Ingress annotations but apply to
# the whole ALB: ssl-policy, load-balancer-attributes, wafv2-acl-arn
apiVersion: gateway.k8s.aws/v1beta1
kind: LoadBalancerConfiguration
metadata:
  name: {{ $name }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  scheme: {{ $scheme }}
  {{- if or $cfg.certificates $cfg.sslPolicy }}
  # HTTPS listener settings: static certs (for hosts ACM discovery cannot find
  # via route hostnames, e.g. istio-managed domains behind the fallback route)
  # and/or the TLS security policy (replaces alb.ingress.kubernetes.io/ssl-policy)
  listenerConfigurations:
    - protocolPort: HTTPS:443
      alpnPolicy: None
      {{- if $cfg.sslPolicy }}
      sslPolicy: {{ $cfg.sslPolicy }}
      {{- end }}
      {{- if $cfg.certificates }}
      {{- $certs := splitList "," $cfg.certificates }}
      defaultCertificate: {{ first $certs | trim }}
      {{- if gt (len $certs) 1 }}
      certificates:
        {{- range rest $certs }}
        - {{ . | trim }}
        {{- end }}
      {{- end }}
      {{- end }}
  {{- end }}
  {{- if $cfg.wafv2AclArn }}
  # Replaces alb.ingress.kubernetes.io/wafv2-acl-arn
  wafV2:
    webACL: {{ $cfg.wafv2AclArn }}
  {{- end }}
  {{- if $cfg.loadBalancerAttributes }}
  # Replaces alb.ingress.kubernetes.io/load-balancer-attributes
  # values format: map of attribute -> value; converted to the CRD's key/value list,
  # values quoted since the CRD expects strings
  loadBalancerAttributes:
    {{- range $k, $v := $cfg.loadBalancerAttributes }}
    - key: {{ $k }}
      value: {{ $v | quote }}
    {{- end }}
  {{- end }}
  {{- if $cfg.subnets }}
  loadBalancerSubnets:
    {{- range split "," $cfg.subnets }}
    - identifier: {{ . | trim | trimAll "\"" }}
    {{- end }}
  {{- end }}
  {{- if $.Values.gateways.tags }}
  # LoadBalancerConfiguration takes tags as a map, gateways.tags is a key/value list
  tags:
    {{- range $.Values.gateways.tags }}
    {{ .key | quote }}: {{ .value | quote }}
    {{- end }}
  {{- end }}
  # Default target group settings for every backend attached to this Gateway
  defaultTargetGroupConfiguration:
    name: {{ $name }}-defaults
---
# Replaces targetType: ip from IngressClassParams; must not set targetReference.
# targetGroupAttributes here are gateway-wide defaults; per-Service TGCs created
# by app teams override/extend them (merged at the key level by the controller)
apiVersion: gateway.k8s.aws/v1beta1
kind: TargetGroupConfiguration
metadata:
  name: {{ $name }}-defaults
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  defaultConfiguration:
    targetType: ip
    {{- if $cfg.targetGroupAttributes }}
    # Replaces alb.ingress.kubernetes.io/target-group-attributes
    # values format: map of attribute -> value; converted to the CRD's key/value list,
    # values quoted since the CRD expects strings
    targetGroupAttributes:
      {{- range $k, $v := $cfg.targetGroupAttributes }}
      - key: {{ $k }}
        value: {{ $v | quote }}
      {{- end }}
    {{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $name }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  gatewayClassName: alb
  infrastructure:
    parametersRef:
      group: gateway.k8s.aws
      kind: LoadBalancerConfiguration
      name: {{ $name }}  # must be in the same namespace as this Gateway
  listeners:
    # ALB listeners materialize lazily, only once a route attaches to them
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All  # cross-namespace sharing, replaces group.name cost-sharing
    - name: https
      protocol: HTTPS
      port: 443
      # No tls block: LBC ignores certificateRefs, ACM certs are auto-discovered
      # from HTTPRoute hostnames (same behavior as with Ingress today)
      allowedRoutes:
        namespaces:
          from: All
---
{{- /* sslRedirect defaults to true; hasKey is needed because "default" would override an explicit false */}}
{{- $sslRedirect := true }}
{{- if hasKey $cfg "sslRedirect" }}{{- $sslRedirect = $cfg.sslRedirect }}{{- end }}
{{- if $sslRedirect }}
# Replaces alb.ingress.kubernetes.io/ssl-redirect: catch-all HTTP -> HTTPS.
# Host-specific user routes on the http listener take precedence over this
# hostname-less route, so plain HTTP is still possible per host if needed.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}-ssl-redirect
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $name }}
      namespace: {{ $.Release.Namespace }}
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
{{- end }}
{{- end }}
{{- end }}
