global:
  cloudProvider: oracle
  providerConfigRefName: crossplane-oracle

  oracle:
    # Filled by agent_input_oracle.yaml; consumed by templates/oracle/policy.yaml.
    compartmentId: ""
    dynamicGroupName: ""

cluster-autoscaler:
  cloudProvider: oci
  # Instance principal - the node's identity. Workload Identity would scope this per pod and
  # is available on this ENHANCED cluster, but nothing has been migrated to it yet.
  # The dynamic group comes from modules/oracle/oke;
  # the node-pool management policy is created by this module's own
  # templates/oracle/policy.yaml via crossplane-oracle.
  # OKE_USE_INSTANCE_PRINCIPAL also exists but is deprecated upstream.
  extraEnv:
    OCI_USE_INSTANCE_PRINCIPAL: "true"
    OCI_SDK_APPEND_USER_AGENT: oci-oke-cluster-autoscaler
  rbac:
    serviceAccount:
      create: true
