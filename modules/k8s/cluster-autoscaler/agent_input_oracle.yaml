global:
  oracle:
    compartmentId: "{{ .agent.accountId }}"
    clusterId: "{{ .toutput.oke.cluster_id }}"

cluster-autoscaler:
  # OCI_RESOURCE_PRINCIPAL_REGION has no default and the SDK cannot infer it under Workload
  # Identity - see the extraEnv comment in values-oracle.yaml. Same wiring as the ingress
  # controller's region input.
  extraEnv:
    OCI_RESOURCE_PRINCIPAL_REGION: "{{ .toutput.oke.region }}"
  image:
    # No Oracle registry-proxy module exists yet - hardcode the upstream registry (its
    # image includes the OCI provider; Oracle's OCIR builds are only needed for legacy
    # k8s versions).
    repository: registry.k8s.io/autoscaling/cluster-autoscaler
  # The chart renders no Deployment unless autoDiscovery.clusterName or autoscalingGroups is set,
  # and its OCI branch passes neither to the autoscaler.
  autoDiscovery:
    clusterName: "{{ .toutput.oke.cluster_name }}"
  # Node pools tagged cluster-autoscaler=enabled, by modules/oracle/oke or anything else creating
  # pools in the cluster. Each pool's own minSize and maxSize tags override min and max here.
  extraArgs:
    node-group-auto-discovery: "clusterId:{{ .toutput.oke.cluster_id }},compartmentId:{{ .agent.accountId }},nodepoolTags:cluster-autoscaler=enabled,min:0,max:0"
