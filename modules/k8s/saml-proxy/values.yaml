global:
  # Route target. All three are filled from agent_input_aws.yaml, from aws-alb.
  createRoute: false
  hostname: ""
  gateway:
    name: ""
    namespace: ""

  # Platform prefix, used for the session cookie name.
  prefix: ""

  aws:
    # Ingress is the AWS only alternative to the route, also from aws-alb.
    createIngress: true
    scheme: internet-facing
    groupName: external
    additionalIngressAnnotations: {}

targetService: ""

secretStore:
  name: ""
  kind: ClusterSecretStore

image:
  registry: docker.io/entigolabs/saml-proxy
  tag: "v0.0.1"

affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 90
        preference:
          matchExpressions:
            - key: tools
              operator: In
              values:
                - "true"
      - weight: 10
        preference:
          matchExpressions:
            - key: mon
              operator: In
              values:
                - "true"
tolerations:
  - key: "tools"
    operator: "Equal"
    value: "true"
    effect: "NoSchedule"
  - key: "mon"
    operator: "Equal"
    value: "true"
    effect: "NoSchedule"
