{{- if .Values.job.deleteInactiveProviderRevisions }}
# Same remedy as the crossplane-core cleanup Job, run as a PostSync hook after every sync of this module: a provider
# package bump re-fetches every package at once and a fetch cut short by the deadline leaves a Healthy
# ProviderRevision with a truncated object list (crossplane/crossplane#7817). Keep the script in sync
# with modules/k8s/crossplane-core/templates/delete_unused_crds.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-cleanup
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-cleanup
rules:
- apiGroups: ["pkg.crossplane.io"]
  resources: ["providerrevisions"]
  verbs: ["get", "list", "watch", "delete"]
- apiGroups: ["pkg.crossplane.io"]
  resources: ["providers"]
  verbs: ["get", "list"]
- apiGroups: ["apiextensions.crossplane.io"]
  resources: ["managedresourcedefinitions"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-cleanup
subjects:
- kind: ServiceAccount
  name: {{ .Release.Name }}-cleanup
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ .Release.Name }}-cleanup
  apiGroup: rbac.authorization.k8s.io
{{- if .Values.job.restartOnInvalidProviderRevisions }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-cleanup
  namespace: {{ .Values.job.crossplaneNamespace }}
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  resourceNames: ["crossplane"]
  verbs: ["get", "patch"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  resourceNames: ["crossplane-leader-election-core"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-cleanup
  namespace: {{ .Values.job.crossplaneNamespace }}
subjects:
- kind: ServiceAccount
  name: {{ .Release.Name }}-cleanup
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ .Release.Name }}-cleanup
  apiGroup: rbac.authorization.k8s.io
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-cleanup
  annotations:
    # A PostSync hook: runs after every sync of this module (every provider bump), is deleted and
    # recreated each time, so a changed template never hits the immutable Job spec.
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    kube-score/ignore: pod-networkpolicy
spec:
{{- if .Values.job.restartOnInvalidProviderRevisions }}
  activeDeadlineSeconds: {{ add (mul 2 (.Values.job.invalidProviderRevisionsWaitSeconds | default 900)) 900 }}
{{- else }}
  activeDeadlineSeconds: 600
{{- end }}
  parallelism: 1
  completions: 1
  template:
    spec:
      serviceAccountName: {{ .Release.Name }}-cleanup
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 90
            preference:
              matchExpressions:
              - key: tools
                operator: In
                values:
                - "true"
      tolerations:
        - key: "tools"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      containers:
      - name: kubectl
        image: {{ .Values.job.image }}:{{ .Values.job.tag }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          limits:
            cpu: 1000m
            memory: 512Mi
            ephemeral-storage: 200Mi
          requests:
            cpu: 1m
            memory: 16Mi
            ephemeral-storage: 2Mi
        command:
        - /bin/bash
        - -c
        - |
          #!/bin/bash
{{- if .Values.job.deleteInactiveProviderRevisions | default false }}
{{- if .Values.job.restartOnInvalidProviderRevisions | default false }}
          # Crossplane can mark a ProviderRevision Healthy with a truncated
          # status.objectRefs when the package fetch times out mid-stream (every
          # package re-fetches at once on a Crossplane upgrade, see
          # crossplane/crossplane#7817). Such a revision never takes control of
          # the MRDs missing from its list, so they stay controlled by the old
          # revision: SafeStart providers stay scaled to zero and the
          # rbac-manager ClusterRoles miss API groups. The Inactive revisions
          # must not be deleted while that is the case, because their
          # ClusterRoles are what keeps the cluster working. So: wait for the
          # revision roll to settle, restart the crossplane deployment if any
          # Active MRD is not controlled by an Active revision (every Active
          # revision re-parses its package on start), wait for that to clear,
          # and only then clean up.
          NAMESPACE="{{ .Values.job.crossplaneNamespace }}"
          WAIT_SECONDS={{ .Values.job.invalidProviderRevisionsWaitSeconds | default 900 }}
          SETTLE_SECONDS={{ .Values.job.invalidProviderRevisionsSettleSeconds | default 60 }}
          QUIET_SECONDS={{ .Values.job.providerRevisionRollQuietSeconds | default 120 }}

          # Prints one line per Active MRD whose controller is not an Active ProviderRevision, nothing when all is well.
          invalid_revisions() {
            local active
            active=$(kubectl get providerrevisions.pkg.crossplane.io -o json | jq '[.items[] | select(.spec.desiredState == "Active") | .metadata.name]')
            kubectl get managedresourcedefinitions.apiextensions.crossplane.io -o json | jq -r --argjson active "$active" '
              .items[]
              | select(.spec.state == "Active")
              | .metadata.name as $mrd
              | ([.metadata.ownerReferences[]? | select(.controller == true and .kind == "ProviderRevision")] | first) as $ctrl
              | select($ctrl == null or (($active | index($ctrl.name)) == null))
              | "active MRD \($mrd) is controlled by \($ctrl.name // "no ProviderRevision")"'
          }

          # Epoch seconds at which the current crossplane leader took the lease, or empty while the leader is
          # not a running, non-terminating pod of a fully rolled-out deployment. After an upgrade the new pod
          # can only start rolling revisions once it holds the lease, which took 95s on biz on 2026-09-25.
          leader_since() {
            kubectl -n "$NAMESPACE" get deployment crossplane -o json | jq -e '
              .status.observedGeneration >= .metadata.generation
              and .status.updatedReplicas == .spec.replicas
              and .status.availableReplicas == .spec.replicas
              and ((.status.unavailableReplicas // 0) == 0)' >/dev/null || return 0
            local lease holder pod
            lease=$(kubectl -n "$NAMESPACE" get lease.coordination.k8s.io crossplane-leader-election-core -o json 2>/dev/null) || return 0
            holder=$(echo "$lease" | jq -r '.spec.holderIdentity // ""')
            pod="${holder%%_*}"
            [ -n "$pod" ] || return 0
            kubectl -n "$NAMESPACE" get pod "$pod" -o json 2>/dev/null | jq -e '
              .metadata.deletionTimestamp == null and .status.phase == "Running"' >/dev/null || return 0
            echo "$lease" | jq -r '.spec.acquireTime | .[0:19] + "Z" | fromdateiso8601'
          }

          # True once the current leader has held the lease for QUIET_SECONDS, no ProviderRevision was created or
          # changed state in the last QUIET_SECONDS, every Provider is Installed (an unpack failure clears that) and every
          # Active ProviderRevision is established (RevisionHealthy). Ownership is fixed at establish time, so
          # the provider runtimes do not need to be up.
          roll_settled() {
            local now cutoff since revisions
            now=$(date +%s)
            cutoff=$(( now - QUIET_SECONDS ))
            since=$(leader_since)
            [ -n "$since" ] && [ "$since" -le "$cutoff" ] || return 1
            kubectl get providers.pkg.crossplane.io -o json | jq -e '
              [.items[] | select(([.status.conditions[]? | select(.type == "Installed" and .status == "True")] | length) == 0)] | length == 0' >/dev/null || return 1
            revisions=$(kubectl get providerrevisions.pkg.crossplane.io -o json)
            echo "$revisions" | jq -e '
              [.items[] | select(.spec.desiredState == "Active") | select(([.status.conditions[]? | select(.type == "RevisionHealthy" and .status == "True")] | length) == 0)] | length == 0' >/dev/null || return 1
            echo "$revisions" | jq -e --argjson cutoff "$cutoff" '
              [.items[] | ([.metadata.creationTimestamp] + [.status.conditions[]?.lastTransitionTime // empty])[] | select((.[0:19] + "Z" | fromdateiso8601) > $cutoff)] | length == 0' >/dev/null
          }

          echo "Waiting for the ProviderRevision roll to settle (up to ${WAIT_SECONDS}s)..."
          START=$(date +%s)
          INVALID=""
          while true; do
            if roll_settled; then
              echo "Leader stable, every Provider installed, every Active ProviderRevision established, nothing new in the last ${QUIET_SECONDS}s."
              INVALID=$(invalid_revisions)
              if [ -n "$INVALID" ]; then
                echo "Active MRDs not controlled by an Active ProviderRevision, waiting ${SETTLE_SECONDS}s before acting:"
                echo "$INVALID"
                sleep "$SETTLE_SECONDS"
                INVALID=$(invalid_revisions)
              fi
              break
            fi
            if [ $(( $(date +%s) - START )) -ge "$WAIT_SECONDS" ]; then
              echo "WARNING: the roll did not settle within ${WAIT_SECONDS}s, continuing with what is there:"
              kubectl -n "$NAMESPACE" get lease.coordination.k8s.io crossplane-leader-election-core -o jsonpath='{.spec.holderIdentity} {.spec.acquireTime}{"\n"}'
              kubectl get providers.pkg.crossplane.io
              kubectl get providerrevisions.pkg.crossplane.io
              INVALID=$(invalid_revisions)
              break
            fi
            sleep 10
          done

          if [ -z "$INVALID" ]; then
            echo "Every active MRD is controlled by an Active ProviderRevision, no restart needed."
          else
            echo "Still not controlled after settling, restarting the crossplane deployment:"
            echo "$INVALID"
            kubectl -n "$NAMESPACE" rollout restart deployment crossplane
            echo "Waiting for the crossplane deployment to roll out..."
            START=$(date +%s)
            while true; do
              if kubectl -n "$NAMESPACE" get deployment crossplane -o json | jq -e '
                  .status.observedGeneration >= .metadata.generation
                  and .status.updatedReplicas == .spec.replicas
                  and .status.availableReplicas == .spec.replicas
                  and ((.status.unavailableReplicas // 0) == 0)' >/dev/null; then
                echo "crossplane deployment rolled out."
                break
              fi
              if [ $(( $(date +%s) - START )) -ge "$WAIT_SECONDS" ]; then
                echo "ERROR: crossplane deployment did not roll out within ${WAIT_SECONDS}s."
                kubectl -n "$NAMESPACE" get deployment crossplane
                exit 1
              fi
              sleep 10
            done
            echo "Restarted. The Active ProviderRevisions re-establish their objects as the new pod takes the lease; not waiting for that."
            INVALID=$(invalid_revisions)
            [ -z "$INVALID" ] || { echo "Still to be taken over by the new revisions:"; echo "$INVALID"; }
          fi
{{- end }}
          # Get all ProviderRevisions with desiredState = Inactive
          INACTIVE_REVISIONS=$(kubectl get providerrevisions.pkg.crossplane.io -o json | \
          jq -r '.items[] | select(.spec.desiredState == "Inactive") | .metadata.name')

          if [ -z "$INACTIVE_REVISIONS" ]; then
              echo "No inactive ProviderRevisions found."
          else
              echo "Found inactive ProviderRevisions to delete:"
              echo "$INACTIVE_REVISIONS"
              echo ""
              
              # Loop through and delete each inactive revision
              for revision in $INACTIVE_REVISIONS; do
                  echo "Deleting ProviderRevision: $revision"
                  kubectl delete providerrevisions.pkg.crossplane.io "$revision"
              done
              
              echo ""
              echo "ProviderRevision cleanup complete!"
          fi
{{- end }}

      restartPolicy: Never
  backoffLimit: 5
{{- end }}
