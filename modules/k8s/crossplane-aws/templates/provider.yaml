apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: upbound-provider-family-aws
  annotations:
    argocd.argoproj.io/sync-wave: '2'
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  package: xpkg.upbound.io/upbound/provider-family-aws:v2.6.3
  runtimeConfigRef:
    name: {{ .Release.Name }}-family

{{- $uniqueProviders := include "crossplane-aws.providers" . | fromYamlArray }}

# Create Provider resources for each unique provider
{{- range $index, $provider := $uniqueProviders }}
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: upbound-provider-aws-{{ $provider }}
  annotations:
    argocd.argoproj.io/sync-wave: '{{ add 5 (div $index 4) }}'
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  skipDependencyResolution: true
  package: xpkg.upbound.io/upbound/provider-aws-{{ $provider }}:v2.6.3
  runtimeConfigRef:
{{- if hasKey $.Values.providerResources.providers $provider }}
    name: {{ $.Release.Name }}-{{ $provider }}
{{- else }}
    name: {{ $.Release.Name }}
{{- end }}
{{- end }}



