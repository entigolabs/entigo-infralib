global:
  # Name of the Gateway other modules attach their HTTPRoutes to. Gateways are
  # named <release name>-<key under gateways>, so these must be kept in sync
  # when the built-in entries are renamed or the module is deployed under a
  # different name. The agent sets both from the module name.
  internalGateway: google-gateway-internal
  externalGateway: google-gateway-external

  # Deprecated, use gateways.external.enabled / gateways.internal.enabled.
  # Still honoured: the built-in gateways are only created when both the
  # gateways.<name>.enabled and the matching flag below are true.
  createExternal: true
  createInternal: true

  google:
    # Deprecated, use gateways.external.certificateMap
    externalCertificateMap: ""
    # Deprecated, use gateways.internal.certManagerCerts
    internalCertificateMap: ""
    # Deprecated, use gateways.external.gatewayClassName
    externalGatewayClassName: gke-l7-global-external-managed
    # Deprecated, use gateways.internal.gatewayClassName
    internalGatewayClassName: gke-l7-rilb
    # Deprecated, use gateways.internal.allowGlobalAccess
    internalGatewayAllowGlobalAccess: false

# One Gateway (= one GKE load balancer) per entry. Any map entry with
# enabled: true becomes a gateway, so additional gateways can be defined by
# simply adding an entry. The Gateway object is named <release name>-<key>.
#
# Unlike aws-alb there is no per-gateway subnets setting: the google vpc module
# only supports the "default" subnet layout, so every gateway of the same class
# lands in the same subnet, chosen by GKE from the gateway class.
gateways:
  external:
    enabled: true
    gatewayClassName: ""       # defaults to global.google.externalGatewayClassName
    certificateMap: ""         # Certificate Manager map, networking.gke.io/certmap
    certManagerCerts: ""       # cert-manager secrets on the https listener, comma separated
    sslRedirect: true
    allowGlobalAccess: false   # only meaningful for regional internal gateway classes
    addresses: []
    # - type: NamedAddress
    #   value: my-reserved-address
    annotations: {}
    labels: {}
  internal:
    enabled: true
    gatewayClassName: ""       # defaults to global.google.internalGatewayClassName
    certificateMap: ""
    certManagerCerts: ""       # defaults to global.google.internalCertificateMap
    sslRedirect: true
    allowGlobalAccess: false   # defaults to global.google.internalGatewayAllowGlobalAccess
    addresses: []
    annotations: {}
    labels: {}
  # custom user-defined gateway, just add an entry
  # partner:
  #   enabled: true
  #   gatewayClassName: gke-l7-global-external-managed
  #   certificateMap: "projects/my-project/locations/global/certificateMaps/partner"
  #   sslRedirect: true
