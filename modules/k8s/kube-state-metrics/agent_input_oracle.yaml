kube-state-metrics:
  networkPolicy:
    egress:
    - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
        podSelector:
          matchLabels:
            k8s-app: kube-dns
      ports:
      - protocol: UDP
        port: 53
      - protocol: TCP
        port: 53
    # Kubernetes API
    - to:
      - ipBlock:
          cidr: "{{ .toutput.oke.kubernetes_service_ip }}/32"
      ports:
      - port: 443
        protocol: TCP
    # The same API server after Service translation, which is where Cilium checks it.
    - to:
      - ipBlock:
          cidr: "{{ .toutput.oke.private_endpoint_ip }}/32"
      ports:
      - port: 6443
        protocol: TCP
