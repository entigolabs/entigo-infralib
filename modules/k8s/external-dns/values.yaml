global:
  cloudProvider: ""
  providerConfigRefName: ""
external-dns:
  registry: txt
  policy: upsert-only
  sources:
    - service
    - ingress
    - istio-gateway
    - istio-virtualservice
    - gateway-httproute
    # DNSEndpoint CRs, for records that no Service/Ingress/Route can express
    # (e.g. a CNAME to a CDN in front of the cluster). The CRD ships with the
    # chart; this also adds the dnsendpoints RBAC to the ClusterRole.
    - crd
  extraArgs:
    - --metrics-address=:7979
  serviceAccount:
    name: "external-dns"
  serviceMonitor:
    enabled: false
    scrapeTimeout: 20s
    additionalLabels:
      kubernetes.io/metadata.name: monitoring
      release: prometheus
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 90
          preference:
            matchExpressions:
              - key: tools
                operator: In
                values:
                  - "true"
  tolerations:
    - key: "tools"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
  resources:
    limits:
      cpu: 1000m
      memory: 512Mi
      ephemeral-storage: 1Gi
    requests:
      cpu: 5m
      memory: 64Mi
      ephemeral-storage: 24Mi

  deploymentAnnotations:
    kube-score/ignore: pod-networkpolicy,pod-probes
