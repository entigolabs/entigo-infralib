global:
  cloudProvider: azure
  azure:
    tenantId: ""
    pubZoneId: ""
    # Private int zone, written by external-dns-private (azure-private-dns provider)
    intZoneId: ""

external-dns:
  provider:
    name: azure
  serviceAccount:
    create: false
    name: external-dns
  podLabels:
    azure.workload.identity/use: "true"
  extraVolumes:
    - name: azure-config-file
      secret:
        secretName: external-dns-azure
  extraVolumeMounts:
    - name: azure-config-file
      mountPath: /etc/kubernetes
      readOnly: true
  tolerations:
    - key: "tools"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
    - key: "CriticalAddonsOnly"
      operator: "Exists"
      effect: "NoSchedule"

external-dns-private:
  enabled: true
  provider:
    name: azure-private-dns
  registry: txt
  policy: upsert-only
  sources:
    - gateway-httproute
  extraArgs:
    metrics-address: ":7979"
  serviceAccount:
    create: false
    name: external-dns
  podLabels:
    azure.workload.identity/use: "true"
  extraVolumes:
    - name: azure-config-file
      secret:
        secretName: external-dns-azure
  extraVolumeMounts:
    - name: azure-config-file
      mountPath: /etc/kubernetes
      readOnly: true
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 90
          preference:
            matchExpressions:
              - key: tools
                operator: In
                values:
                  - "true"
  tolerations:
    - key: "tools"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
    - key: "CriticalAddonsOnly"
      operator: "Exists"
      effect: "NoSchedule"
  resources:
    limits:
      cpu: 1000m
      memory: 512Mi
      ephemeral-storage: 1Gi
    requests:
      cpu: 5m
      memory: 64Mi
      ephemeral-storage: 24Mi
  deploymentAnnotations:
    kube-score/ignore: pod-networkpolicy,pod-probes
