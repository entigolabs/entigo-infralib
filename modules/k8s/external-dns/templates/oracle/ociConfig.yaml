{{- if eq .Values.global.cloudProvider "oracle" }}
# external-dns's OCI config file, mounted at the path its --oci-config-file flag points to.
#
# This exists only because useWorkloadIdentity has no command-line equivalent: the OCI
# provider reads it exclusively from this YAML (provider/oci/oci.go's OCIAuthConfig), whereas
# instance principal has the --oci-auth-instance-principal flag and needs no file at all. So
# moving to Workload Identity means introducing a config file, which is a small step backwards
# in moving parts - but the file holds no credential, just a mode switch and the compartment.
#
# A Secret rather than a ConfigMap purely to match how the key-based auth path documents this
# same file upstream, keeping the shape familiar if anyone ever adds a private key here.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-oci-config
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
type: Opaque
stringData:
  oci.yaml: |
    auth:
      # No tenancy, user, key or fingerprint: the pod authenticates as its own service account
      # through the OKE Workload Identity provider, using the projected service account token.
      # Requires an ENHANCED cluster.
      #
      # The region, however, is NOT derived from the token and has to be given here. On this
      # path external-dns copies it straight into OCI_RESOURCE_PRINCIPAL_REGION for the SDK
      # (provider/oci/oci.go), so leaving it out sets that variable to the empty string rather
      # than leaving it unset - which slips past the SDK's presence check and builds requests
      # against "dns..oci.oraclecloud.com". The pod then logs nothing but soft DNS errors while
      # looking perfectly healthy, and records silently stop being published.
      region: {{ .Values.global.oracle.region }}
      useWorkloadIdentity: true
    compartment: {{ .Values.global.oracle.compartmentId }}
{{- end }}
