{{- if eq .Values.global.cloudProvider "azure" }}
{{- $id := splitList "/" (required "global.azure.pubZoneId" .Values.global.azure.pubZoneId) }}
apiVersion: v1
kind: Secret
metadata:
  name: external-dns-azure
type: Opaque
stringData:
  azure.json: |
    {
      "tenantId": {{ .Values.global.azure.tenantId | quote }},
      "subscriptionId": {{ index $id 2 | quote }},
      "resourceGroup": {{ index $id 4 | quote }},
      "useWorkloadIdentityExtension": true
    }
{{- if index .Values "external-dns-private" "enabled" }}
{{- $int := splitList "/" (.Values.global.azure.intZoneId | default .Values.global.azure.pubZoneId) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: external-dns-azure-private
type: Opaque
stringData:
  azure.json: |
    {
      "tenantId": {{ .Values.global.azure.tenantId | quote }},
      "subscriptionId": {{ index $int 2 | quote }},
      "resourceGroup": {{ index $int 4 | quote }},
      "useWorkloadIdentityExtension": true
    }
{{- end }}
{{- end }}
