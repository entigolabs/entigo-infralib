{{- if eq .Values.global.cloudProvider "azure" }}
apiVersion: iam.entigo.com/v1alpha1
kind: WorkloadIdentity
metadata:
  name: {{ .Release.Name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  serviceAccountName: {{ index .Values "external-dns" "serviceAccount" "name" }}
  {{- if .Values.global.azure.existingIdentityId }}
  azureIdentityId: {{ .Values.global.azure.existingIdentityId }}
  {{- else }}
  azurePermissions:
    {{- if contains "/dnszones/" (lower .Values.global.azure.pubZoneId) }}
    - role: DNS Zone Contributor
      scope: {{ .Values.global.azure.pubZoneId }}
    {{- end }}
    {{- if and (index .Values "external-dns-private" "enabled") (contains "/privatednszones/" (lower .Values.global.azure.intZoneId)) }}
    - role: Private DNS Zone Contributor
      scope: {{ .Values.global.azure.intZoneId }}
    {{- end }}
  {{- end }}
{{- end }}
