# Deliberately inert: not mounted, not referenced, no controller reads it.
#
# Its only job is to be REMOVED by the external-dns 0.22 upgrade. The agent
# auto-approves pipelines that add or change objects but stops for manual
# approval when one is deleted, so deleting this ConfigMap forces a human to
# look at the diff - and the diff is this warning. Release notes get skipped;
# an approval prompt does not.
#
# Remove this file in the same PR that bumps the external-dns chart to 1.22.0.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-annotation-migration
data:
  ACTION-REQUIRED-before-the-next-external-dns-upgrade: |
    external-dns 0.22 changes the annotation prefix it reads, from

        external-dns.alpha.kubernetes.io/

    to

        external-dns.kubernetes.io/

    It reads ONE prefix. There is no fallback and no parallel reading: the
    moment 0.22 starts, every object still carrying only the alpha prefix
    stops being a source of truth and its DNS records are deleted.

    WHAT YOU MUST DO, BEFORE approving the upgrade that deletes this ConfigMap:

    Find every object in your own applications that carries an
    external-dns.alpha.kubernetes.io/ annotation - Ingress, Service,
    Gateway, VirtualService, HTTPRoute - and add the same annotation a
    second time under the external-dns.kubernetes.io/ prefix. Keep both.

        kubectl get ingress,service,gateway,virtualservice,httproute -A -o json \
          | grep -o 'external-dns\.alpha\.kubernetes\.io/[a-z-]*'

    Example - before:

        metadata:
          annotations:
            external-dns.alpha.kubernetes.io/hostname: app.example.com
            external-dns.alpha.kubernetes.io/ttl: "60"

    After:

        metadata:
          annotations:
            external-dns.alpha.kubernetes.io/hostname: app.example.com
            external-dns.alpha.kubernetes.io/ttl: "60"
            external-dns.kubernetes.io/hostname: app.example.com
            external-dns.kubernetes.io/ttl: "60"

    Both prefixes are safe to carry at once: the running 0.21 ignores the
    new one, and 0.22 ignores the old one. Once every environment runs 0.22
    you can drop the alpha copies.

    The infralib modules themselves are already dual-annotated. This is
    about the annotations in YOUR application manifests.
