global:
  oracle:
    compartmentId: "{{ .agent.accountId }}"
    clusterId: "{{ .toutput.oke.cluster_id }}"
    # Written into the mounted oci.yaml. Mandatory under Workload Identity and not derivable
    # from the service account token, unlike everything else in that file.
    region: "{{ .toutput.oke.region }}"

external-dns:
  # The region also goes on the pod, purely so that changing it rolls the deployment.
  # Nothing else would: the region reaches the container through a mounted Secret, a Secret
  # change does not restart anything, and external-dns reads its config file once at
  # startup. Without this the pod keeps running happily on the old value - which is exactly
  # what happened when the region was first added, and it took a manual rollout restart to
  # notice the fix had not taken effect.
  podAnnotations:
    infralib.entigo.io/oci-region: "{{ .toutput.oke.region }}"
  extraArgs:
    - --metrics-address=:7979
    # Workload Identity is only selectable from the config file, so no auth flag here. The
    # compartment comes from the same file; --oci-compartment-ocid is ignored on this path.
    - --oci-config-file=/etc/kubernetes/oci.yaml
  image:
    # No Oracle registry-proxy module exists yet (same gap noted in modules/k8s/argocd's
    # agent_input_oracle.yaml) - hardcode the public default registry rather than
    # referencing a .toptout.<proxy> module that doesn't exist for this cloud.
    repository: registry.k8s.io/external-dns/external-dns
