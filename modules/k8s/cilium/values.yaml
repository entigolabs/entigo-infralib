---
cilium:
  operator:
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
            - key: tools
              operator: In
              values:
              - "true"
  hubble:
    tls:
      auto:
        method: cronJob
  certgen:
    annotations:
      cronJob:
        kube-score/ignore: cronjob-has-deadline
