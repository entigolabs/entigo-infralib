---
cilium:
  # cilium-secrets only holds the TLS Secrets the operator syncs there, no pods,
  # so the namespace can carry the restricted level the report expects.
  secretsNamespaceLabels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
  operator:
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
            - key: tools
              operator: In
              values:
              - "true"
  hubble:
    tls:
      auto:
        method: cronJob
  certgen:
    annotations:
      cronJob:
        kube-score/ignore: cronjob-has-deadline
