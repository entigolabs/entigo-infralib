# Installed once per environment: a pull request applies it under its regular
# name instead of a per-branch copy.
pin_step: true
# kube-score checks skipped on top of the framework's defaults: the agent loads eBPF programs into the node's kernel, so it runs privileged, without resource limits (an agent killed for memory takes the node's pod networking down with it), probes or a NetworkPolicy.
kube_score_ignore:
  - container-security-context-privileged
  - container-resources
  - container-ephemeral-storage-request-and-limit
  - pod-probes
  - pod-networkpolicy
