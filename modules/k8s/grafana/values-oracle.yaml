global:
  cloudProvider: "oracle"
  providerConfigRefName: "crossplane-oracle"
  datasources:
    loki:
      # Name of the loki module, or empty when loki isn't deployed - the Loki datasource is
      # then skipped entirely. Set from `.toptmodule.loki` in agent_input_oracle.yaml.
      module: ""

grafana:
  ingress:
    enabled: true
    # modules/k8s/oci-native-ingress-controller's IngressClass; the annotations are the OCI
    # equivalent of the alb ones in values-aws.yaml. See modules/k8s/argocd/values-oracle.yaml
    # for what each does - certificate-ocid is added by agent_input_oracle.yaml.
    ingressClassName: oci-ic
    annotations:
      oci-native-ingress.oraclecloud.com/https-listener-port: "443"
      oci-native-ingress.oraclecloud.com/backend-tls-enabled: "false"
    path: /
    # Empty rather than the aws-style list: the certificate is referenced by OCID, so no
    # Kubernetes TLS secret is involved. `hosts` is set in agent_input_oracle.yaml.
    tls: []
  persistence:
    # OKE's default StorageClass, named explicitly so the intent survives a cluster whose
    # default class differs. OCI Block Volume has a 50GB floor - a smaller request is
    # rounded up and billed at 50GB regardless - so ask for what we actually get rather
    # than the 2Gi the base values request.
    storageClassName: "oci-bv"
    size: 50Gi
  serviceAccount:
    # Created by templates/oracle/service-account.yaml. Unlike aws (IRSA role annotation)
    # and google (Workload Identity + a GCP service account), it carries no cloud identity:
    # grafana needs no OCI API access here, because there is no OCI equivalent of the
    # CloudWatch/Cloud Monitoring datasource wired in (see templates/oracle/config-map.yaml).
    create: false
    name: grafana
