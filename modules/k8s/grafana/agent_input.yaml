global:
  # `.toptmodule` (optional) rather than `.tmodule` (required): a missing module makes
  # `.tmodule` fail the whole apps step, and none of these has to be part of the platform.
  # The module name is passed rather than a full URL because an empty optional value would
  # otherwise render the nonsense "http://loki-gateway."; the configMap templates build the
  # URL and skip the datasource when the name is empty.
  datasources:
    loki:
      module: '{{ .toptmodule.loki }}'
    mimir:
      module: '{{ .toptmodule.mimir }}'
    prometheus:
      module: '{{ .toptmodule.prometheus }}'
grafana:
  grafana.ini:
    server:
      root_url: https://{{ .module.name }}.{{ .toptout.route53.int_domain | .toptout.dns.int_domain | required }}
    users:
      home_page: "https://{{ .module.name }}.{{ .toptout.route53.int_domain | .toptout.dns.int_domain | required }}/dashboards"

  route:
    main:
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: '{{ .toptin.aws-alb.global.internalGateway | .toptin.google-gateway.global.internalGateway | .toptin.oracle-gateway.global.internalGateway | .toptin.azure-gateway.global.internalGateway | required }}'
          namespace: '{{ .toptmodule.aws-alb | .toptmodule.google-gateway | .toptmodule.oracle-gateway | .toptmodule.azure-gateway | required }}'
          sectionName: https
      hostnames:
        - "{{ .module.name }}.{{ .toptout.route53.int_domain | .toptout.dns.int_domain | required }}"
  image:
    registry: '{{ .toptout.ecr-proxy.hub_registry | .toptout.gar-proxy.hub_registry | .toptout.acr-proxy.hub_registry | "docker.io" }}'
  sidecar:
    image:
      registry: '{{ .toptout.ecr-proxy.quay_registry | .toptout.gar-proxy.quay_registry | .toptout.acr-proxy.quay_registry | "quay.io" }}'
  initChownData:
    image:
      registry: '{{ .toptout.ecr-proxy.hub_registry | .toptout.gar-proxy.hub_registry | .toptout.acr-proxy.hub_registry | "docker.io" }}'
  downloadDashboardsImage:
    registry: '{{ .toptout.ecr-proxy.hub_registry | .toptout.gar-proxy.hub_registry | .toptout.acr-proxy.hub_registry | "docker.io" }}'
  imageRenderer:
    image:
      registry: '{{ .toptout.ecr-proxy.hub_registry | .toptout.gar-proxy.hub_registry | .toptout.acr-proxy.hub_registry | "docker.io" }}'
