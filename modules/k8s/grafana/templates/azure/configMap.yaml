{{- if eq .Values.global.cloudProvider "azure" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-loki
data:
{{ (.Files.Glob "dashboards/loki/*.json").AsConfig | indent 2 }}
---
{{- if not .Values.grafana.datasources }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  labels:
    grafana_datasource: 'true'
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: {{ .Values.global.datasources.prometheus.hostname }}
        access: proxy
        isDefault: true
      {{- with .Values.global.datasources.loki.module }}
      - name: Loki
        type: loki
        access: proxy
        url: http://{{ . }}-gateway.{{ . }}
        jsonData:
          maxLines: 1000
      {{- end }}
      - name: Azure Monitor
        type: grafana-azure-monitor-datasource
        access: proxy
        jsonData:
          azureAuthType: workloadidentity
          cloudName: azuremonitor
          subscriptionId: {{ .Values.global.azure.subscriptionId | quote }}
{{- end }}
{{- end }}
