{{- if eq .Values.global.cloudProvider "aws" }}

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-loki
data:
{{ (.Files.Glob "dashboards/loki/*.json").AsConfig | indent 2 }}
---
{{- if not .Values.grafana.datasources }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  labels:
    grafana_datasource: 'true'
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      {{- if .Values.global.datasources.prometheus.module }}
      - name: Prometheus
        type: prometheus
        url: {{ .Values.global.datasources.prometheus.hostname }}
        access: proxy
        isDefault: true
      {{- else }}
      - name: Prometheus
        type: prometheus
        url: {{ .Values.global.datasources.mimir.hostname }}
        access: proxy
        isDefault: true
        jsonData:
          httpHeaderName1: X-Scope-OrgID
        secureJsonData:
          httpHeaderValue1: {{ .Values.global.datasources.mimir.tenantHeader | quote }}
      {{- end }}
      - name: Loki
        type: loki
        access: proxy
        url: {{ .Values.global.datasources.loki.hostname }}
        jsonData:
          maxLines: 1000
      - name: CloudWatch
        type: cloudwatch
        jsonData:
          authType: default
          defaultRegion: {{ .Values.global.aws.region }}
{{- end }}


{{- end }}