{{- if eq .Values.global.cloudProvider "oracle" }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  # Same input keys aws-alb/google-gateway use (agent_input.yaml/agent_input_oracle.yaml) -
  # no Oracle-specific input shape needed here.
  parentRefs:
    {{- toYaml .Values.grafana.route.main.parentRefs | nindent 4 }}
  hostnames:
    {{- toYaml .Values.grafana.route.main.hostnames | nindent 4 }}
  rules:
    - backendRefs:
        - group: ''
          kind: Service
          name: grafana
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
{{- end }}
