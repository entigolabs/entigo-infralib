{{- if eq .Values.global.cloudProvider "oracle" }}
# Plain ServiceAccount with no cloud identity attached. aws annotates this with an IRSA role
# and google pairs it with a GCP service account for Workload Identity, both so Grafana can
# read that cloud's metrics API. Neither applies here: Basic OKE has no per-pod identity, and
# no OCI datasource is configured (see config-map.yaml), so Grafana needs no OCI access.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.grafana.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
{{- end }}
