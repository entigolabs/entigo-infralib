{{- if eq .Values.global.cloudProvider "oracle" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-loki
data:
{{ (.Files.Glob "dashboards/loki/*.json").AsConfig | indent 2 }}
---
{{- if not .Values.grafana.datasources }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  labels:
    grafana_datasource: 'true'
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: {{ .Values.global.datasources.prometheus.hostname }}
        access: proxy
        isDefault: true
      {{- with .Values.global.datasources.loki.module }}
      - name: Loki
        type: loki
        access: proxy
        url: http://{{ . }}-gateway.{{ . }}
        jsonData:
          maxLines: 1000
      {{- end }}
      # No cloud-provider datasource, unlike aws (CloudWatch) and google (Cloud Monitoring).
      # Grafana ships no built-in OCI datasource - Oracle publishes one as an external
      # plugin (oci-metrics-datasource) which would need installing and its own instance
      # principal or API-key credentials, so it is deliberately left out until someone
      # actually wants OCI service metrics in Grafana. Everything cluster-side is covered by
      # Prometheus above.
{{- end }}
{{- end }}
