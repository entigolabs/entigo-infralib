# No gateway pin here: the chain in agent_input.yaml resolves it, and
# google-gateway/test points internalGateway at the external gateway,
# which is the one this test probes.
grafana:
  route:
    main:
      hostnames:
        - "{{ .module.name }}.{{ .toutput.dns.pub_domain }}"
  grafana.ini:
    server:
      root_url: https://{{ .module.name }}.{{ .toutput.dns.pub_domain }}
    auth.generic_oauth:
      enabled: true
      name: zitadel
      allow_sign_up: true
      scopes: openid email profile roles 
      auth_url: https://entigo-dev-if3upz.zitadel.cloud/oauth/v2/authorize
      token_url: https://entigo-dev-if3upz.zitadel.cloud/oauth/v2/token
      api_url: https://entigo-dev-if3upz.zitadel.cloud/oidc/v1/userinfo
      use_pkce: true
      use_refresh_token: true
      client_id: "343161092010274846"
      role_attribute_path: "contains(groups[*], 'web-admin-343159627493470238') && 'Admin'"

  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: "{{ .config.prefix }}"
          type: prometheus
          url: http://mimir-gateway.{{ .tmodule.mimir }}/prometheus
          uid: "{{ .config.prefix }}"
          access: proxy
          jsonData:
            httpHeaderName1: X-Scope-OrgID
            manageAlerts: false
          secureJsonData:
            httpHeaderValue1: "{{ .config.prefix }}"
          isDefault: true
        - name: Prometheus
          type: prometheus
          url: "http://{{ .tmodule.prometheus }}-server.{{ .tmodule.prometheus }}"
          access: proxy
        - name: Loki
          type: loki
          access: proxy
          url: "http://{{ .tmodule.loki }}-gateway.{{ .tmodule.loki }}"
          jsonData:
            maxLines: 1000
        - name: Google Cloud Monitoring
          type: stackdriver
          access: proxy
          jsonData:
            authenticationType: gce