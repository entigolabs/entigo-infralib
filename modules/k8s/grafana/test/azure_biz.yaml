  # TODO: Zitadel login for the azure test environments (client ids added later)
  # grafana.ini:
  #   auth.generic_oauth:
  #     enabled: true
  #     name: zitadel
  #     allow_sign_up: true
  #     scopes: openid email profile roles
  #     auth_url: https://entigo-dev-if3upz.zitadel.cloud/oauth/v2/authorize
  #     token_url: https://entigo-dev-if3upz.zitadel.cloud/oauth/v2/token
  #     api_url: https://entigo-dev-if3upz.zitadel.cloud/oidc/v1/userinfo
  #     use_pkce: true
  #     use_refresh_token: true
  #     client_id: ""
  #     role_attribute_path: contains(groups[*], 'web-admin-390876846557773807') && 'Admin'
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Mimir
          type: prometheus
          url: http://mimir-gateway.{{ .tmodule.mimir }}/prometheus
          uid: '{{ .config.prefix }}'
          jsonData:
            httpHeaderName1: X-Scope-OrgID
            manageAlerts: false
            prometheusType: Mimir
          secureJsonData:
            httpHeaderValue1: '{{ .config.prefix }}'
          isDefault: true
          editable: false
        - name: Prometheus
          type: prometheus
          url: http://{{ .tmodule.prometheus }}-server.{{ .tmodule.prometheus }}
          access: proxy
        - name: Loki
          type: loki
          access: proxy
          url: http://{{ .tmodule.loki }}-gateway.{{ .tmodule.loki }}
          jsonData:
            maxLines: 1000
