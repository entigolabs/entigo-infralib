grafana:
  route:
    main:
      hostnames:
        - "{{ .module.name }}.{{ .toutput.dns.pub_domain }}"
  grafana.ini:
    server:
      root_url: https://{{ .module.name }}.{{ .toutput.dns.pub_domain }}
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Mimir
          type: prometheus
          url: http://mimir-gateway.{{ .tmodule.mimir }}/prometheus
          uid: '{{ .config.prefix }}'
          jsonData:
            httpHeaderName1: X-Scope-OrgID
            manageAlerts: false
            prometheusType: Mimir
          secureJsonData:
            httpHeaderValue1: '{{ .config.prefix }}'
          isDefault: true
          editable: false
        - name: Prometheus
          type: prometheus
          url: http://{{ .tmodule.prometheus }}-server.{{ .tmodule.prometheus }}
          access: proxy
        - name: Loki
          type: loki
          access: proxy
          url: http://{{ .tmodule.loki }}-gateway.{{ .tmodule.loki }}
          jsonData:
            maxLines: 1000
