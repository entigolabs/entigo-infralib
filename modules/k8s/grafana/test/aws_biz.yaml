grafana:
  grafana.ini:
    server:
      root_url: https://{{ .module.name }}.{{ .toutput.route53.pub_domain }}
    auth.generic_oauth:
      enabled: true
      name: zitadel
      allow_sign_up: true
      scopes: openid email profile roles 
      auth_url: https://entigo-dev-if3upz.zitadel.cloud/oauth/v2/authorize
      token_url: https://entigo-dev-if3upz.zitadel.cloud/oauth/v2/token
      api_url: https://entigo-dev-if3upz.zitadel.cloud/oidc/v1/userinfo
      use_pkce: true
      use_refresh_token: true
      client_id: "343161092010274846"
      role_attribute_path: "contains(groups[*], 'web-admin-343159627493470238') && 'Admin'"
  ingress:
    hosts:
    - "{{ .module.name }}.{{ .toutput.route53.pub_domain }}"
    annotations:
      alb.ingress.kubernetes.io/group.name: external
      alb.ingress.kubernetes.io/scheme: internet-facing
  route:
    main:
      hostnames:
        - "{{ .module.name }}.{{ .toutput.route53.pub_domain }}"

  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: "{{ .config.prefix }}"
          type: prometheus
          url: http://mimir-gateway.{{ .tmodule.mimir }}/prometheus
          uid: "{{ .config.prefix }}"
          access: proxy
          jsonData:
            httpHeaderName1: X-Scope-OrgID
            manageAlerts: false
          secureJsonData:
            httpHeaderValue1: "{{ .config.prefix }}"
          isDefault: true
        - name: Prometheus
          type: prometheus
          url: "http://{{ .tmodule.prometheus }}-server.{{ .tmodule.prometheus }}"
          access: proxy
        - name: Loki
          type: loki
          access: proxy
          url: "http://{{ .tmodule.loki }}-gateway.{{ .tmodule.loki }}"
          jsonData:
            maxLines: 1000
        - name: CloudWatch
          type: cloudwatch
          jsonData:
            authType: default
            defaultRegion: "{{ .toutput.eks.region }}"