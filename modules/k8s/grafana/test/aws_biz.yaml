grafana:
  grafana.ini:
    server:
      root_url: https://{{ .module.name }}.{{ .toutput.route53.pub_domain }}
    auth.generic_oauth:
      enabled: true
      name: zitadel
      allow_sign_up: true
      scopes: openid email profile roles
      auth_url: https://entigo-dev-if3upz.zitadel.cloud/oauth/v2/authorize
      token_url: https://entigo-dev-if3upz.zitadel.cloud/oauth/v2/token
      api_url: https://entigo-dev-if3upz.zitadel.cloud/oidc/v1/userinfo
      use_pkce: true
      use_refresh_token: true
      client_id: "390876939822514159"
      role_attribute_path: "contains(groups[*], 'web-admin-390876846557773807') && 'Admin'"
  ingress:
    hosts:
      - "{{ .module.name }}.{{ .toutput.route53.pub_domain }}"
    annotations:
      alb.ingress.kubernetes.io/group.name: external
      alb.ingress.kubernetes.io/scheme: internet-facing
  route:
    main:
      hostnames:
        - "{{ .module.name }}.{{ .toutput.route53.pub_domain }}"
  # No Prometheus module in biz, only Alloy with Mimir: bundled dashboards default to
  # "Prometheus" so existing infralib users aren't forced to change their
  # values, so biz/pri point them at Mimir instead until Prometheus is removed.
  dashboards:
    kubernetes:
      global:
        datasource: Mimir
      namespaces:
        datasource: Mimir
      nodes:
        datasource: Mimir
      pods:
        datasource: Mimir
      apiserver:
        datasource: Mimir
      limitsrequests:
        datasource: Mimir
      crossplane:
        datasource: Mimir
      pvc:
        datasource: Mimir
      trivy-operator-vulnerabilities:
        datasource: Mimir
