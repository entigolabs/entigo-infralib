logs:
  crds:
    create: false
  lokiEndpoint: "http://loki-gateway.loki/loki/api/v1/push"
  lokiTenantID: ""
  extraProcessStages: ""
  # extraProcessStages: |
  #   stage.multiline {
  #     firstline     = "^[^\\s].*\\d{2}:\\d{2}:\\d{2},\\d{3}"
  #     max_wait_time = "5s"
  #     max_lines     = 5000
  #   }

  # Traces: off by default so this module stays a pure log shipper for any
  # consumer that doesn't need it. Set traces.enabled: true (plus, usually,
  # traces.tailSamplingPolicies) in a per-stack config/apps/alloy.yaml to turn
  # this on. tempoNamespace is filled in by agent_input.yaml from the stack's
  # own tempo module reference; with traces enabled and neither it nor
  # tempoEndpoint set, rendering fails instead of silently dropping traces.
  traces:
    enabled: false
    otlpHttpPort: 4318
    otlpGrpcPort: 4317
    # Namespace of the tempo module. The tempo module pins its Service name to
    # "tempo" (fullnameOverride), so the exporter targets tempo.<namespace>:4317.
    tempoNamespace: ""
    # Explicit override for a tempo not deployed by this stack's tempo module.
    tempoEndpoint: ""
    # Pod label that becomes the `service.name` resource attribute, via
    # otelcol.processor.k8sattributes. "app" matches the label the logs
    # pipeline above already relabels onto every log line (see
    # discovery.relabel "kubernetes_pods" -> target_label "app"), and the
    # label Loki's own default_discover_service_name promotes to its
    # service_name — keeping traces and logs joined on one label with
    # nothing to configure per deployment.
    serviceNameLabel: "app"
    # How long otelcol.processor.tail_sampling waits, from the first span of
    # a trace, before deciding to keep or drop it. Generous default for SDKs
    # that stream spans over a request's lifetime; a consumer whose SDK sends
    # a whole trace in one batch at the end of the request (no late-arriving
    # spans to wait for) can safely set this much lower.
    decisionWait: "30s"
    # Raw otelcol.processor.tail_sampling `policy { ... }` blocks, inserted
    # verbatim into the processor body below. Generic default: always keep
    # errors, always keep slow traces, otherwise keep a flat baseline sample.
    # Override wholesale per stack (e.g. to carve out known high-volume,
    # low-value paths like pollers at their own lower rate) via a per-stack
    # config/apps/alloy.yaml.
    tailSamplingPolicies: |
      policy {
        name = "errors"
        type = "status_code"
        status_code {
          status_codes = ["ERROR"]
        }
      }
      policy {
        name = "slow"
        type = "latency"
        latency {
          threshold_ms = 5000
        }
      }
      policy {
        name = "baseline"
        type = "probabilistic"
        probabilistic {
          sampling_percentage = 10
        }
      }

  alloy:
    configMap:
      create: true
      content: |
        logging {
          level  = "warn"
          format = "json"
        }

        discovery.kubernetes "kubernetes_pods" {
          role = "pod"
          selectors {
            role  = "pod"
            field = "spec.nodeName=" + sys.env("HOSTNAME")
          }
        }

        discovery.relabel "kubernetes_pods" {
          targets = discovery.kubernetes.kubernetes_pods.targets

          rule {
            source_labels = ["__meta_kubernetes_pod_controller_name"]
            regex         = "([0-9a-z-.]+?)(-[0-9a-f]{8,10})?"
            target_label  = "__tmp_controller_name"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name", "__meta_kubernetes_pod_label_app", "__tmp_controller_name", "__meta_kubernetes_pod_name"]
            regex         = "^;*([^;]+)(;.*)?$"
            target_label  = "app"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_instance", "__meta_kubernetes_pod_label_instance"]
            regex         = "^;*([^;]+)(;.*)?$"
            target_label  = "instance"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component", "__meta_kubernetes_pod_label_component"]
            regex         = "^;*([^;]+)(;.*)?$"
            target_label  = "component"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_node_name"]
            target_label  = "node_name"
          }

          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }

          rule {
            source_labels = ["namespace", "app"]
            separator     = "/"
            target_label  = "job"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label  = "container"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
            separator     = "/"
            target_label  = "__path__"
            replacement   = "/var/log/pods/*$1/*.log"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_annotationpresent_kubernetes_io_config_hash", "__meta_kubernetes_pod_annotation_kubernetes_io_config_hash", "__meta_kubernetes_pod_container_name"]
            regex         = "true/(.*)"
            replacement   = "/var/log/pods/*$1/*.log"
            separator     = "/"
            target_label  = "__path__"
          }
        }

        local.file_match "kubernetes_pods" {
          path_targets = discovery.relabel.kubernetes_pods.output
        }

        local.file_match "all_container_logs" {
          path_targets = [{
            __path__ = "/var/log/containers/*.log",
          }]
        }

        loki.source.file "kubernetes_pods" {
          targets       = array.concat(local.file_match.kubernetes_pods.targets, local.file_match.all_container_logs.targets)
          forward_to    = [loki.process.kubernetes_pods.receiver]
          tail_from_end = true
        }

        loki.process "kubernetes_pods" {
          forward_to = [loki.write.default.receiver]
          stage.cri { }
          {{- if .Values.extraProcessStages }}
          {{- .Values.extraProcessStages | nindent 2 }}
          {{- end }}
        }

        loki.write "default" {
          endpoint {
            url = {{ .Values.lokiEndpoint | quote }}
            {{- if .Values.lokiTenantID }}
            tenant_id = {{ .Values.lokiTenantID | quote }}
            {{- end }}
          }
        }

        {{- if .Values.traces.enabled }}
        {{- $tempoEndpoint := .Values.traces.tempoEndpoint }}
        {{- if and (not $tempoEndpoint) .Values.traces.tempoNamespace }}
        {{- $tempoEndpoint = printf "tempo.%s:4317" .Values.traces.tempoNamespace }}
        {{- end }}
        {{- if not $tempoEndpoint }}
        {{- fail "traces.enabled is true but no tempo to send to: deploy the tempo module in this stack or set traces.tempoEndpoint" }}
        {{- end }}

        otelcol.receiver.otlp "traces" {
          grpc {
            endpoint = "0.0.0.0:{{ .Values.traces.otlpGrpcPort }}"
          }

          http {
            endpoint = "0.0.0.0:{{ .Values.traces.otlpHttpPort }}"
          }

          output {
            traces = [otelcol.processor.k8sattributes.traces.input]
          }
        }

        otelcol.processor.k8sattributes "traces" {
          extract {
            label {
              from     = "pod"
              key      = {{ .Values.traces.serviceNameLabel | quote }}
              tag_name = "service.name"
            }
          }

          output {
            traces = [otelcol.processor.tail_sampling.traces.input]
          }
        }

        otelcol.processor.tail_sampling "traces" {
          decision_wait = {{ .Values.traces.decisionWait | quote }}

          {{- .Values.traces.tailSamplingPolicies | nindent 2 }}

          output {
            traces = [otelcol.exporter.otlp.traces.input]
          }
        }

        otelcol.exporter.otlp "traces" {
          client {
            endpoint = {{ $tempoEndpoint | quote }}
            tls {
              insecure = true
            }
          }
        }
        {{- end }}

    mounts:
      varlog: true
    resources:
      requests:
        cpu: "10m"
        # Bumped from the log-only default (45Mi): otelcol.processor.tail_sampling
        # buffers every span of every in-flight trace for the duration of
        # traces.decisionWait before deciding to keep or drop it. Harmless when
        # traces.enabled is false. Revisit once real trace volume is known.
        memory: "128Mi"
        ephemeral-storage: "100Mi"
      limits:
        cpu: "500m"
        memory: "768Mi"
        ephemeral-storage: "50Gi"
    livenessProbe:
      httpGet:
        path: /-/healthy
        port: 12345
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    enableHttpServerPort: false
    enableReporting: false
    # hostPort so a pod can reach this node's collector via status.hostIP; a
    # Service would load-balance across nodes and defeat the point of a local,
    # same-node receiver. Harmless when traces.enabled is false (nothing binds
    # the port, since otelcol.receiver.otlp isn't created in the config then).
    extraPorts:
      - name: otlp-grpc
        port: 4317
        targetPort: 4317
        hostPort: 4317
        protocol: TCP
      - name: otlp-http
        port: 4318
        targetPort: 4318
        hostPort: 4318
        protocol: TCP

  service:
    enabled: false

  serviceAccount:
    create: true

  configReloader:
    enabled: false

  networkPolicy:
    enabled: true
    policyTypes:
      - Ingress
      - Egress
    ingress:
      # No `from`: any pod, any namespace, may reach the OTLP gRPC/HTTP
      # receivers. "Same node only" isn't expressible as a NetworkPolicy
      # selector; the ports only matter once traces.enabled turns the
      # receiver on.
      - ports:
          - port: 4317
            protocol: TCP
          - port: 4318
            protocol: TCP
    egress:
      - ports:
          - port: 53
            protocol: UDP
          - port: 53
            protocol: TCP
        to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
      - ports:
          - port: 80
            protocol: TCP
          - port: 8080
            protocol: TCP
        to:
          - namespaceSelector: {}
            podSelector:
              matchLabels:
                app.kubernetes.io/name: loki
                app.kubernetes.io/component: gateway
      # Harmless when traces.enabled is false: nothing tries this connection
      # if otelcol.exporter.otlp "traces" was never created in the config.
      - ports:
          - port: 4317
            protocol: TCP
        to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: tempo

  controller:
    type: "daemonset"
    replicas: 1
    priorityClassName: "alloy"
    tolerations:
      - effect: NoSchedule
        operator: Exists
