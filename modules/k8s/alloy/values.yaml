global:
  # Install Prometheus Operator CRDs (ServiceMonitor/PodMonitor)
  # Required if you enable cluster-metrics.serviceMonitors/podMonitors
  installPrometheusOperatorCRDs: false

prometheus-operator-crds:
  crds:
    annotations:
      argocd.argoproj.io/sync-options: ServerSideApply=true

# ---------------------------------------------------------------------------
# node-agent: per-node DaemonSet. Toggle each signal independently with logs.enabled / metrics.enabled.
# ---------------------------------------------------------------------------
node-agent:
  enabled: true
  crds:
    create: false

  logs:
    enabled: true
    lokiEndpoint: "http://loki-gateway.loki/loki/api/v1/push"
    lokiTenantID: ""
    extraProcessStages: ""

  metrics:
    enabled: false
    mimirEndpoint: "http://mimir-gateway.mimir/api/v1/push"
    mimirTenantID: ""
    
    externalLabels: {}
    scrapeInterval: "60s"
    selfMonitor: true

  extraConfig: ""

  alloy:
    configMap:
      create: true
      content: |
        logging {
          level  = "warn"
          format = "json"
        }
        {{- if .Values.metrics.enabled }}

        prometheus.remote_write "default" {
          {{- if .Values.metrics.externalLabels }}
          external_labels = {
            {{- range $k, $v := .Values.metrics.externalLabels }}
            {{ $k }} = {{ $v | quote }},
            {{- end }}
          }
          {{- end }}
          endpoint {
            url = {{ .Values.metrics.mimirEndpoint | quote }}
            {{- if .Values.metrics.mimirTenantID }}
            headers = {
              "X-Scope-OrgID" = {{ .Values.metrics.mimirTenantID | quote }},
            }
            {{- end }}
          }
        }

        prometheus.exporter.unix "node" {
          rootfs_path = "/host/root"
          procfs_path = "/host/proc"
          sysfs_path  = "/host/sys"

          filesystem {
            mount_points_exclude = "^/(dev|proc|sys|run/credentials/.+|var/lib/docker/.+|var/lib/kubelet/.+)($|/)"
            fs_types_exclude     = "^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$"
          }
          netclass {
            ignored_devices = "^(veth.*|cali.*|[a-f0-9]{15})$"
          }
        }

        discovery.relabel "node_exporter" {
          targets = prometheus.exporter.unix.node.targets
          rule {
            target_label = "job"
            replacement  = "node-exporter"
          }
          rule {
            target_label = "instance"
            replacement  = sys.env("HOSTNAME")
          }
          rule {
            target_label = "node"
            replacement  = sys.env("HOSTNAME")
          }
        }

        prometheus.scrape "node_exporter" {
          targets         = discovery.relabel.node_exporter.output
          forward_to      = [prometheus.remote_write.default.receiver]
          scrape_interval = {{ .Values.metrics.scrapeInterval | quote }}
        }

        discovery.kubernetes "local_node" {
          role = "node"
          selectors {
            role  = "node"
            field = "metadata.name=" + sys.env("HOSTNAME")
          }
        }

        discovery.relabel "kubelet" {
          targets = discovery.kubernetes.local_node.targets
          rule {
            source_labels = ["__meta_kubernetes_node_name"]
            target_label  = "node"
          }
          rule {
            target_label = "instance"
            replacement  = sys.env("HOSTNAME")
          }
        }

        prometheus.scrape "kubelet" {
          targets           = discovery.relabel.kubelet.output
          forward_to        = [prometheus.remote_write.default.receiver]
          job_name          = "kubelet"
          scheme            = "https"
          bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
          scrape_interval   = {{ .Values.metrics.scrapeInterval | quote }}
          tls_config {
            insecure_skip_verify = true
          }
        }

        prometheus.scrape "cadvisor" {
          targets           = discovery.relabel.kubelet.output
          forward_to        = [prometheus.remote_write.default.receiver]
          job_name          = "cadvisor"
          scheme            = "https"
          metrics_path      = "/metrics/cadvisor"
          bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
          scrape_interval   = {{ .Values.metrics.scrapeInterval | quote }}
          tls_config {
            insecure_skip_verify = true
          }
        }
        {{- if .Values.metrics.selfMonitor }}

        prometheus.exporter.self "alloy" { }

        discovery.relabel "alloy_self" {
          targets = prometheus.exporter.self.alloy.targets
          rule {
            target_label = "alloy_role"
            replacement  = "node-agent"
          }
          rule {
            target_label = "instance"
            replacement  = sys.env("HOSTNAME")
          }
          rule {
            target_label = "node"
            replacement  = sys.env("HOSTNAME")
          }
        }

        prometheus.scrape "alloy_self" {
          targets         = discovery.relabel.alloy_self.output
          forward_to      = [prometheus.remote_write.default.receiver]
          scrape_interval = {{ .Values.metrics.scrapeInterval | quote }}
        }
        {{- end }}
        {{- end }}
        {{- if .Values.logs.enabled }}

        discovery.kubernetes "kubernetes_pods" {
          role = "pod"
          selectors {
            role  = "pod"
            field = "spec.nodeName=" + sys.env("HOSTNAME")
          }
        }

        discovery.relabel "kubernetes_pods" {
          targets = discovery.kubernetes.kubernetes_pods.targets

          rule {
            source_labels = ["__meta_kubernetes_pod_controller_name"]
            regex         = "([0-9a-z-.]+?)(-[0-9a-f]{8,10})?"
            target_label  = "__tmp_controller_name"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name", "__meta_kubernetes_pod_label_app", "__tmp_controller_name", "__meta_kubernetes_pod_name"]
            regex         = "^;*([^;]+)(;.*)?$"
            target_label  = "app"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_instance", "__meta_kubernetes_pod_label_instance"]
            regex         = "^;*([^;]+)(;.*)?$"
            target_label  = "instance"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component", "__meta_kubernetes_pod_label_component"]
            regex         = "^;*([^;]+)(;.*)?$"
            target_label  = "component"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_node_name"]
            target_label  = "node_name"
          }

          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }

          rule {
            source_labels = ["namespace", "app"]
            separator     = "/"
            target_label  = "job"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label  = "container"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
            separator     = "/"
            target_label  = "__path__"
            replacement   = "/var/log/pods/*$1/*.log"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_annotationpresent_kubernetes_io_config_hash", "__meta_kubernetes_pod_annotation_kubernetes_io_config_hash", "__meta_kubernetes_pod_container_name"]
            regex         = "true/(.*)"
            replacement   = "/var/log/pods/*$1/*.log"
            separator     = "/"
            target_label  = "__path__"
          }
        }

        local.file_match "kubernetes_pods" {
          path_targets = discovery.relabel.kubernetes_pods.output
        }

        local.file_match "all_container_logs" {
          path_targets = [{
            __path__ = "/var/log/containers/*.log",
          }]
        }

        loki.source.file "kubernetes_pods" {
          targets       = array.concat(local.file_match.kubernetes_pods.targets, local.file_match.all_container_logs.targets)
          forward_to    = [loki.process.kubernetes_pods.receiver]
          tail_from_end = true
        }

        loki.process "kubernetes_pods" {
          forward_to = [loki.write.default.receiver]
          stage.cri { }
          {{- if .Values.logs.extraProcessStages }}
          {{- .Values.logs.extraProcessStages | nindent 2 }}
          {{- end }}
        }

        loki.write "default" {
          endpoint {
            url = {{ .Values.logs.lokiEndpoint | quote }}
            {{- if .Values.logs.lokiTenantID }}
            tenant_id = {{ .Values.logs.lokiTenantID | quote }}
            {{- end }}
          }
        }
        {{- end }}
        {{- if .Values.extraConfig }}
        {{ .Values.extraConfig | nindent 8 }}
        {{- end }}

    mounts:
      varlog: true
      # Host mounts for the unix (node) exporter
      extra:
        - name: rootfs
          mountPath: /host/root
          readOnly: true
          mountPropagation: HostToContainer
        - name: procfs
          mountPath: /host/proc
          readOnly: true
        - name: sysfs
          mountPath: /host/sys
          readOnly: true
    resources:
      requests:
        cpu: "20m"
        memory: "100Mi"
        ephemeral-storage: "100Mi"
      limits:
        cpu: "1"
        memory: "700Mi"
        ephemeral-storage: "50Gi"
    livenessProbe:
      httpGet:
        path: /-/healthy
        port: 12345
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    enableHttpServerPort: false
    enableReporting: false

  service:
    enabled: false

  serviceAccount:
    create: true

  configReloader:
    enabled: false

  networkPolicy:
    enabled: true
    policyTypes:
      - Ingress
      - Egress
    ingress: []
    egress:
      - ports:
          - port: 53
            protocol: UDP
          - port: 53
            protocol: TCP
        to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
      - ports:
          - port: 80
            protocol: TCP
          - port: 8080
            protocol: TCP
        to:
          - namespaceSelector: {}
            podSelector:
              matchLabels:
                app.kubernetes.io/name: loki
                app.kubernetes.io/component: gateway
      - ports:
          - port: 80
            protocol: TCP
          - port: 8080
            protocol: TCP
        to:
          - namespaceSelector: {}
            podSelector:
              matchLabels:
                app.kubernetes.io/name: mimir
                app.kubernetes.io/component: gateway
      # Kubelet / cAdvisor on the local node
      - ports:
          - port: 10250
            protocol: TCP

  controller:
    type: "daemonset"
    replicas: 1
    priorityClassName: "alloy"
    volumes:
      extra:
        - name: rootfs
          hostPath:
            path: /
        - name: procfs
          hostPath:
            path: /proc
        - name: sysfs
          hostPath:
            path: /sys
    tolerations:
      - effect: NoSchedule
        operator: Exists

# ---------------------------------------------------------------------------
# cluster-metrics: single-replica Deployment for cluster-wide scrape targets (kube-state-metrics, annotation-based pod discovery etc)
# ---------------------------------------------------------------------------
cluster-metrics:
  enabled: false
  crds:
    create: false
  mimirEndpoint: "http://mimir-gateway.mimir/api/v1/push"
  mimirTenantID: ""

  # Labels added to every series, e.g. {cluster: prod}
  externalLabels: {}
  scrapeInterval: "60s"
  selfMonitor: true

  # Scrape Prometheus Operator ServiceMonitor / PodMonitor CRDs. Requires the CRDs to exist (set global.installPrometheusOperatorCRDs to true)
  serviceMonitors: false
  podMonitors: false

  # Multi-target proxy scrape of redis-exporter: each entry in redisExporterTargets is passed to
  # the exporter's /scrape endpoint via the `target` query param.
  redisExporterTargets: []
  redisExporterService: ""
  redisExporterScrapeInterval: "30s"
  redisExporterScrapeTimeout: "10s"

  # Blackbox probing, run in-process via Alloy's embedded blackbox exporter.
  # blackboxModules holds blackbox_exporter module definitions, keyed by module name; 
  # blackboxTargets is the list of probes to run against them, e.g. [{name: "example", address: "example.com:443", module: "tls_handshake"}].
  blackboxTargets: []
  blackboxModules: {}
  blackboxScrapeInterval: "30s"

  extraConfig: ""

  alloy:
    configMap:
      create: true
      content: |
        logging {
          level  = "warn"
          format = "json"
        }

        prometheus.remote_write "default" {
          {{- if .Values.externalLabels }}
          external_labels = {
            {{- range $k, $v := .Values.externalLabels }}
            {{ $k }} = {{ $v | quote }},
            {{- end }}
          }
          {{- end }}
          endpoint {
            url = {{ .Values.mimirEndpoint | quote }}
            {{- if .Values.mimirTenantID }}
            headers = {
              "X-Scope-OrgID" = {{ .Values.mimirTenantID | quote }},
            }
            {{- end }}
          }
        }

        discovery.kubernetes "pods" {
          role = "pod"
        }

        // kube-state-metrics is kept as a standalone module/deployment
        discovery.relabel "kube_state_metrics" {
          targets = discovery.kubernetes.pods.targets
          rule {
            source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
            regex         = "kube-state-metrics"
            action        = "keep"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_container_port_number"]
            regex         = "8080"
            action        = "keep"
          }
          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }
          // Duplicate label for dashboards/queries written against the older Prometheus convention.
          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "kubernetes_namespace"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }
          // Duplicate label for dashboards/queries written against the older Prometheus convention.
          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "kubernetes_pod_name"
          }
          rule {
            target_label = "job"
            replacement  = "kube-state-metrics"
          }
        }

        prometheus.scrape "kube_state_metrics" {
          targets         = discovery.relabel.kube_state_metrics.output
          forward_to      = [prometheus.remote_write.default.receiver]
          scrape_interval = {{ .Values.scrapeInterval | quote }}
        }

        // Annotation-based discovery: scrape pods with prometheus.io/scrape=true.
        discovery.relabel "annotated_pods" {
          targets = discovery.kubernetes.pods.targets
          rule {
            source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scrape"]
            regex         = "true"
            action        = "keep"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_phase"]
            regex         = "Running"
            action        = "keep"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scheme"]
            regex         = "(https?)"
            target_label  = "__scheme__"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_path"]
            regex         = "(.+)"
            target_label  = "__metrics_path__"
          }
          rule {
            source_labels = ["__address__", "__meta_kubernetes_pod_annotation_prometheus_io_port"]
            regex         = "([^:]+)(?::[0-9]+)?;([0-9]+)"
            replacement   = "$1:$2"
            target_label  = "__address__"
          }
          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }
          // Duplicate label for dashboards/queries written against the older Prometheus convention.
          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "kubernetes_namespace"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }
          // Duplicate label for dashboards/queries written against the older Prometheus convention.
          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "kubernetes_pod_name"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label  = "container"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_node_name"]
            target_label  = "node"
          }
        }

        prometheus.scrape "annotated_pods" {
          targets         = discovery.relabel.annotated_pods.output
          forward_to      = [prometheus.remote_write.default.receiver]
          scrape_interval = {{ .Values.scrapeInterval | quote }}
        }

        // Endpoints discovery, reused by service-endpoints and apiserver scraping.
        discovery.kubernetes "endpoints" {
          role = "endpoints"
        }

        // kubernetes-service-endpoints: scrape Services annotated prometheus.io/scrape=true.
        discovery.relabel "service_endpoints" {
          targets = discovery.kubernetes.endpoints.targets
          rule {
            source_labels = ["__meta_kubernetes_service_annotation_prometheus_io_scrape"]
            regex         = "true"
            action        = "keep"
          }
          rule {
            source_labels = ["__meta_kubernetes_service_name"]
            regex         = "kube-state-metrics"
            action        = "drop"
          }
          rule {
            source_labels = ["__meta_kubernetes_service_annotation_prometheus_io_scheme"]
            regex         = "(https?)"
            target_label  = "__scheme__"
          }
          rule {
            source_labels = ["__meta_kubernetes_service_annotation_prometheus_io_path"]
            regex         = "(.+)"
            target_label  = "__metrics_path__"
          }
          rule {
            source_labels = ["__address__", "__meta_kubernetes_service_annotation_prometheus_io_port"]
            regex         = "([^:]+)(?::[0-9]+)?;([0-9]+)"
            replacement   = "$1:$2"
            target_label  = "__address__"
          }
          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }
          // Duplicate label for dashboards/queries written against the older Prometheus convention.
          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "kubernetes_namespace"
          }
          rule {
            source_labels = ["__meta_kubernetes_service_name"]
            target_label  = "service"
          }
          // Duplicate label for dashboards/queries written against the older Prometheus convention.
          rule {
            source_labels = ["__meta_kubernetes_service_name"]
            target_label  = "kubernetes_name"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }
          // Duplicate label for dashboards/queries written against the older Prometheus convention.
          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "kubernetes_pod_name"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_node_name"]
            target_label  = "node"
          }
          rule {
            source_labels = ["__meta_kubernetes_service_name"]
            target_label  = "job"
          }
        }

        prometheus.scrape "service_endpoints" {
          targets         = discovery.relabel.service_endpoints.output
          forward_to      = [prometheus.remote_write.default.receiver]
          scrape_interval = {{ .Values.scrapeInterval | quote }}
        }

        // kubernetes-apiservers: scrape the API server's own /metrics
        discovery.relabel "apiserver" {
          targets = discovery.kubernetes.endpoints.targets
          rule {
            source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_service_name", "__meta_kubernetes_endpoint_port_name"]
            regex         = "default;kubernetes;https"
            action        = "keep"
          }
        }

        prometheus.scrape "apiserver" {
          targets           = discovery.relabel.apiserver.output
          forward_to        = [prometheus.remote_write.default.receiver]
          job_name          = "kubernetes-apiservers"
          scheme            = "https"
          bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
          scrape_interval   = {{ .Values.scrapeInterval | quote }}
          tls_config {
            ca_file     = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
            server_name = "kubernetes"
          }
        }

        {{- if .Values.redisExporterTargets }}
        discovery.relabel "redis_exporter" {
          targets = [
            {{- range .Values.redisExporterTargets }}
            {"__address__" = {{ . | quote }}},
            {{- end }}
          ]
          rule {
            source_labels = ["__address__"]
            target_label  = "__param_target"
          }
          rule {
            source_labels = ["__param_target"]
            target_label  = "instance"
          }
          rule {
            target_label = "__address__"
            replacement  = {{ required "cluster-metrics.redisExporterService must be set when redisExporterTargets is non-empty" .Values.redisExporterService | quote }}
          }
        }

        prometheus.scrape "redis_exporter" {
          targets         = discovery.relabel.redis_exporter.output
          forward_to      = [prometheus.remote_write.default.receiver]
          job_name        = "redis-exporter"
          metrics_path    = "/scrape"
          scrape_interval = {{ .Values.redisExporterScrapeInterval | quote }}
          scrape_timeout  = {{ .Values.redisExporterScrapeTimeout | quote }}
        }
        {{- end }}
        {{- if .Values.blackboxTargets }}
        {{- if not .Values.blackboxModules }}
        {{ fail "cluster-metrics.blackboxModules must be set when blackboxTargets is non-empty" }}
        {{- end }}
        prometheus.exporter.blackbox "probes" {
          config = {{ dict "modules" .Values.blackboxModules | toYaml | quote }}

          {{- range .Values.blackboxTargets }}
          target {
            name    = {{ .name | quote }}
            address = {{ .address | quote }}
            module  = {{ .module | quote }}
          }
          {{- end }}
        }

        prometheus.scrape "blackbox" {
          targets         = prometheus.exporter.blackbox.probes.targets
          forward_to      = [prometheus.remote_write.default.receiver]
          job_name        = "blackbox"
          scrape_interval = {{ .Values.blackboxScrapeInterval | quote }}
        }
        {{- end }}
        {{- if .Values.serviceMonitors }}
        // Scrape all ServiceMonitor CRDs cluster-wide (requires the operator CRDs)
        prometheus.operator.servicemonitors "servicemonitors" {
          forward_to = [prometheus.remote_write.default.receiver]
        }
        {{- end }}
        {{- if .Values.podMonitors }}
        // Scrape all PodMonitor CRDs cluster-wide (requires the operator CRDs)
        prometheus.operator.podmonitors "podmonitors" {
          forward_to = [prometheus.remote_write.default.receiver]
        }
        {{- end }}
        {{- if .Values.selfMonitor }}
        prometheus.exporter.self "alloy" { }

        discovery.relabel "alloy_self" {
          targets = prometheus.exporter.self.alloy.targets
          rule {
            target_label = "alloy_role"
            replacement  = "cluster-metrics"
          }
        }

        prometheus.scrape "alloy_self" {
          targets         = discovery.relabel.alloy_self.output
          forward_to      = [prometheus.remote_write.default.receiver]
          scrape_interval = {{ .Values.scrapeInterval | quote }}
        }
        {{- end }}
        {{- if .Values.extraConfig }}
        {{ .Values.extraConfig | nindent 8 }}
        {{- end }}

    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
        ephemeral-storage: "100Mi"
      limits:
        cpu: "2"
        memory: "2Gi"
        ephemeral-storage: "10Gi"
    livenessProbe:
      httpGet:
        path: /-/healthy
        port: 12345
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    enableHttpServerPort: true
    enableReporting: false

  service:
    enabled: true

  # Alloy's own UI (component graph/health), not exposed by the upstream chart's `ingress.*`
  # (that's wired to the Faro port only) — see templates/uiIngress.yaml.
  ui:
    ingress:
      enabled: false
      ingressClassName: ""
      annotations: {}
      host: ""

  serviceAccount:
    create: true

  configReloader:
    enabled: false

  networkPolicy:
    enabled: true
    policyTypes:
      - Ingress
      - Egress
    ingress: []
    egress:
      # All in-cluster scrape targets
      - to:
          - namespaceSelector: {}

  controller:
    type: "deployment"
    replicas: 1
    priorityClassName: "alloy"
    tolerations:
      - key: "mon"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      - key: "tools"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 90
            preference:
              matchExpressions:
                - key: mon
                  operator: In
                  values:
                    - "true"
          - weight: 10
            preference:
              matchExpressions:
                - key: tools
                  operator: In
                  values:
                    - "true"

# ---------------------------------------------------------------------------
# receiver: single Deployment for telemetry producers that are NOT a pod scheduled in this
# cluster — a browser (faro) or any other external/unauthenticated source — since those have
# no node to reach a local collector on, and so need a stable, cluster-wide-routable Service.
#
# otlp here is a FALLBACK, not the preferred path for an in-cluster OTLP producer.
# The node-agent Daemonset has node-local OTLP receiver (hostPort, reachable via status.hostIP in cluster)
# — once that lands, any in-cluster workload that can should adopt it.
# ---------------------------------------------------------------------------
receiver:
  enabled: false
  crds:
    create: false

  otlp:
    enabled: false
    tempoEndpoint: ""

  faro:
    enabled: false
    apiKey: ""
    corsAllowedOrigins: ["*"]
    # No default on purpose: this receives whatever is sent by anyone who can reach the public faro /collect route.
    # Point this at a dedicated instance, or at least to a distinct tenant.
    lokiEndpoint: ""
    lokiTenantID: ""

  extraConfig: ""

  alloy:
    configMap:
      create: true
      content: |
        logging {
          level  = "warn"
          format = "json"
        }
        {{- if .Values.faro.enabled }}

        loki.write "default" {
          endpoint {
            url = {{ required "receiver.faro.lokiEndpoint must be set when receiver.faro.enabled is true" .Values.faro.lokiEndpoint | quote }}
            {{- if .Values.faro.lokiTenantID }}
            tenant_id = {{ .Values.faro.lokiTenantID | quote }}
            {{- end }}
          }
        }

        faro.receiver "default" {
          extra_log_labels = {
            app             = "",
            kind            = "",
            app_environment = "",
            app_name        = "",
            event           = "",
            event_name      = "",
            source          = "faro-sdk",
          }
          server {
            listen_address      = "0.0.0.0"
            listen_port         = 12347
            api_key             = {{ .Values.faro.apiKey | quote }}
            cors_allowed_origins = {{ .Values.faro.corsAllowedOrigins | toJson }}
          }

          output {
            logs = [loki.process.faro_labels.receiver]
          }
        }

        loki.process "faro_labels" {
          forward_to = [loki.relabel.faro_transform.receiver]
          stage.logfmt {
            mapping = {
              "app_name"        = "",
              "app_environment" = "",
              "event_name"      = "",
              "kind"            = "",
            }
          }
          stage.labels {
            values = {
              app_name        = "",
              app_environment = "",
              "event_name"    = "",
              kind            = "",
            }
          }
        }

        loki.relabel "faro_transform" {
          forward_to = [loki.write.default.receiver]

          rule {
            source_labels = ["app_environment"]
            target_label  = "environment"
          }
          rule {
            source_labels = ["event_name"]
            target_label  = "event"
          }
          rule {
            source_labels = ["app_name"]
            target_label  = "app"
          }
          rule {
            action = "labeldrop"
            regex  = "event_name|app_name|app_environment"
          }
        }
        {{- end }}
        {{- if .Values.otlp.enabled }}

        otelcol.receiver.otlp "default" {
          grpc {
            endpoint = "0.0.0.0:4317"
          }
          http {
            endpoint = "0.0.0.0:4318"
          }

          output {
            traces = [otelcol.exporter.otlphttp.tempo.input]
          }
        }

        otelcol.exporter.otlphttp "tempo" {
          client {
            endpoint = {{ required "receiver.otlp.tempoEndpoint must be set when receiver.otlp.enabled is true" .Values.otlp.tempoEndpoint | quote }}
          }
        }
        {{- end }}
        {{- if .Values.extraConfig }}
        {{ .Values.extraConfig | nindent 8 }}
        {{- end }}

      name: null
      key: null

    extraPorts:
      # Bound only when faro.enabled renders the faro.receiver block above.
      - name: "http-faro"
        port: 12347
        targetPort: 12347
        protocol: "TCP"
        appProtocol: "http"
      # Bound only when otlp.enabled renders the otelcol.receiver.otlp block above.
      - name: "grpc-otlp"
        port: 4317
        targetPort: 4317
        protocol: "TCP"
        appProtocol: "grpc"
      - name: "http-otlp"
        port: 4318
        targetPort: 4318
        protocol: "TCP"
        appProtocol: "http"

    resources:
      requests:
        cpu: "20m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"
    livenessProbe:
      httpGet:
        path: /-/healthy
        port: 12345
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    enableHttpServerPort: false
    enableReporting: false

  # This subchart's sole purpose is being a stable Service (receiver) for push clients (OTLP exporters, browser Faro SDK).
  service:
    enabled: true
    type: ClusterIP

  # This receiver pod has no legitimate reason to talk to the K8s API server — and it's the one subchart reachable
  # from outside the cluster. Keep it unprivileged: no ClusterRole, no token to steal even if asked for one.
  rbac:
    create: false

  serviceAccount:
    create: true
    automountServiceAccountToken: false

  configReloader:
    enabled: false

  networkPolicy:
    enabled: true
    policyTypes:
      - Ingress
      - Egress
    # Receiver endpoint: callers can be any pod in the mesh.
    ingress:
      - {}
    egress:
      - ports:
          - port: 53
            protocol: UDP
          - port: 53
            protocol: TCP
        to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
      - ports:
          - port: 80
            protocol: TCP
          - port: 8080
            protocol: TCP
        to:
          - namespaceSelector: {}
            podSelector:
              matchLabels:
                app.kubernetes.io/name: loki
                app.kubernetes.io/component: gateway
      - ports:
          - port: 80
            protocol: TCP
          - port: 8080
            protocol: TCP
        to:
          - namespaceSelector: {}
            podSelector:
              matchLabels:
                app.kubernetes.io/name: mimir
                app.kubernetes.io/component: gateway
      # Tempo
      - ports:
          - port: 443
            protocol: TCP
        to:
          - ipBlock:
              cidr: 0.0.0.0/0

  controller:
    type: "deployment"
    replicas: 2
    priorityClassName: "alloy"
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "12345"
    podDisruptionBudget:
      # Keeps an endpoint alive for push-based clients (OTLP exporters, Faro) during node/pod churn.
      enabled: true
      maxUnavailable: 1
