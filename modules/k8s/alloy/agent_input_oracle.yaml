node-agent:
  logs:
    externalLabels:
      cluster: "{{ .toutput.oke.cluster_name }}"
  metrics:
    externalLabels:
      cluster: "{{ .toutput.oke.cluster_name }}"
  networkPolicy:
    egress:
      - ports:
          - port: 53
            protocol: UDP
          - port: 53
            protocol: TCP
        to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
      # Loki and Mimir, in this cluster or in another one.
      - ports:
          - port: 80
            protocol: TCP
          - port: 8080
            protocol: TCP
      # Kubelet / cAdvisor on the local node
      - ports:
          - port: 10250
            protocol: TCP
      - ports:
          - port: 443
            protocol: TCP
        to:
          - ipBlock:
              cidr: "{{ .toutput.oke.kubernetes_service_ip }}/32"
      # The same API server after Service translation, which is where Cilium checks it.
      - ports:
          - port: 6443
            protocol: TCP
        to:
          - ipBlock:
              cidr: "{{ .toutput.oke.private_endpoint_ip }}/32"
      - ports:
          - port: 4317
            protocol: TCP
        to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: '{{ .toptmodule.tempo | "tempo" }}'

cluster-metrics:
  externalLabels:
    cluster: "{{ .toutput.oke.cluster_name }}"
  # values.yaml's list with the API server added on the port Cilium checks it at, after
  # Service translation.
  networkPolicy:
    egress:
      # All in-cluster scrape targets
      - to:
          - namespaceSelector: {}
      # Loki and Mimir, in this cluster or in another one.
      - ports:
          - port: 80
            protocol: TCP
          - port: 8080
            protocol: TCP
      # The Kubernetes API, for discovery, and the API servers themselves, which are scraped
      # at their own addresses outside the pod network.
      - ports:
          - port: 443
            protocol: TCP
      - ports:
          - port: 6443
            protocol: TCP
        to:
          - ipBlock:
              cidr: "{{ .toutput.oke.private_endpoint_ip }}/32"

receiver:
  faro:
    externalLabels:
      cluster: "{{ .toutput.oke.cluster_name }}"
