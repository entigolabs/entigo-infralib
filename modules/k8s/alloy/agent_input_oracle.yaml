node-agent:
  metrics:
    externalLabels:
      cluster: "{{ .toutput.oke.cluster_name }}"
  networkPolicy:
    egress:
      - ports:
          - port: 53
            protocol: UDP
          - port: 53
            protocol: TCP
        to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
      # Loki and Mimir, in this cluster or in another one.
      - ports:
          - port: 80
            protocol: TCP
          - port: 8080
            protocol: TCP
      # Kubelet / cAdvisor on the local node
      - ports:
          - port: 10250
            protocol: TCP
      - ports:
          - port: 443
            protocol: TCP
        to:
          - ipBlock:
              cidr: "{{ .toutput.oke.kubernetes_service_ip }}/32"
      - ports:
          - port: 4317
            protocol: TCP
        to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: '{{ .toptmodule.tempo | "tempo" }}'

cluster-metrics:
  externalLabels:
    cluster: "{{ .toutput.oke.cluster_name }}"
