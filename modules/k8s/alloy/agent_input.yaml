node-agent:
  controller:
    priorityClassName: "{{ .module.name }}"
    podLabels:
      netpol-loki: '{{ .toptmodule.loki | "loki" }}'
  logs:
    lokiEndpoint: "http://{{ .tmodule.loki }}-gateway.{{ .tmodule.loki }}/loki/api/v1/push"
  metrics:
    mimirEndpoint: "http://{{ .tmodule.mimir }}-gateway.{{ .tmodule.mimir }}/api/v1/push"
  image:
    registry: '{{ .toptout.ecr-proxy.hub_registry | .toptout.gar-proxy.hub_registry | .toptout.acr-proxy.hub_registry | "docker.io" }}'
  configReloader:
    image:
      registry: '{{ .toptout.ecr-proxy.quay_registry | .toptout.gar-proxy.quay_registry | .toptout.acr-proxy.quay_registry | "quay.io" }}'
  # Optional lookup (not required): a stack that never deploys tempo must
  # still be able to render this module with traces.enabled left at its
  # default false. No fallback on purpose: if traces.enabled is turned on
  # without a tempo module, values.yaml fails the render instead of pointing
  # the exporter at a tempo that isn't there.
  traces:
    tempoNamespace: '{{ .toptmodule.tempo }}'
cluster-metrics:
  controller:
    priorityClassName: "{{ .module.name }}"
  mimirEndpoint: "http://{{ .tmodule.mimir }}-gateway.{{ .tmodule.mimir }}/api/v1/push"
receiver:
  controller:
    priorityClassName: "{{ .module.name }}"
