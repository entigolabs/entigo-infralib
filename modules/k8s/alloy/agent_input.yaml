node-agent:
  controller:
    priorityClassName: "{{ .module.name }}"
    podLabels:
      netpol-loki: '{{ .toptmodule.loki | "loki" }}'
  logs:
    lokiEndpoint: "http://loki-gateway.{{ .tmodule.loki }}/loki/api/v1/push"
  metrics:
    mimirEndpoint: "http://mimir-gateway.{{ .tmodule.mimir }}/api/v1/push"
    mimirTenantID: "{{ .config.prefix }}"
  image:
    registry: '{{ .toptout.ecr-proxy.hub_registry | .toptout.gar-proxy.hub_registry | .toptout.acr-proxy.hub_registry | "docker.io" }}'
  configReloader:
    image:
      registry: '{{ .toptout.ecr-proxy.quay_registry | .toptout.gar-proxy.quay_registry | .toptout.acr-proxy.quay_registry | "quay.io" }}'
  traces:
    tempoNamespace: '{{ .toptmodule.tempo }}'
cluster-metrics:
  controller:
    priorityClassName: "{{ .module.name }}"
  mimirEndpoint: "http://mimir-gateway.{{ .tmodule.mimir }}/api/v1/push"
  mimirTenantID: "{{ .config.prefix }}"
  gateway:
    name: '{{ .toptin.aws-alb.global.internalGateway | .toptin.google-gateway.global.internalGateway | .toptin.oracle-gateway.global.internalGateway | .toptin.azure-gateway.global.internalGateway | required }}'
    namespace: '{{ .toptmodule.aws-alb | .toptmodule.google-gateway | .toptmodule.oracle-gateway | .toptmodule.azure-gateway | required }}'
  ui:
    host: "{{ .module.name }}.{{ .toptout.route53.int_domain | .toptout.dns.int_domain | required }}"
  image:
    registry: '{{ .toptout.ecr-proxy.hub_registry | .toptout.gar-proxy.hub_registry | .toptout.acr-proxy.hub_registry | "docker.io" }}'
  configReloader:
    image:
      registry: '{{ .toptout.ecr-proxy.quay_registry | .toptout.gar-proxy.quay_registry | .toptout.acr-proxy.quay_registry | "quay.io" }}'
receiver:
  controller:
    priorityClassName: "{{ .module.name }}"
  image:
    registry: '{{ .toptout.ecr-proxy.hub_registry | .toptout.gar-proxy.hub_registry | .toptout.acr-proxy.hub_registry | "docker.io" }}'
  configReloader:
    image:
      registry: '{{ .toptout.ecr-proxy.quay_registry | .toptout.gar-proxy.quay_registry | .toptout.acr-proxy.quay_registry | "quay.io" }}'
