node-agent:
  image:
    registry: '{{ .toptout.gar-proxy.hub_registry | "docker.io" }}'
  configReloader:
    image:
      registry: '{{ .toptout.gar-proxy.quay_registry | "quay.io" }}'
  metrics:
    externalLabels:
      cluster: "{{ .toutput.gke.cluster_name }}"
  networkPolicy:
    egress:
      - ports:
          - port: 53
            protocol: UDP
          - port: 53
            protocol: TCP
        to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
      - ports:
          - port: 80
            protocol: TCP
          - port: 8080
            protocol: TCP
        to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: '{{ .toptmodule.loki | "loki" }}'
            podSelector:
              matchLabels:
                app.kubernetes.io/name: '{{ .toptmodule.loki | "loki" }}'
                app.kubernetes.io/component: gateway
      - ports:
          - port: 80
            protocol: TCP
          - port: 8080
            protocol: TCP
        to:
          - namespaceSelector: {}
            podSelector:
              matchLabels:
                app.kubernetes.io/name: mimir
                app.kubernetes.io/component: gateway
      # Kubelet / cAdvisor on the local node
      - ports:
          - port: 10250
            protocol: TCP
      # Kubernetes API
      - ports:
          - port: 443
            protocol: TCP
        to:
          - ipBlock:
              cidr: "{{ .toutput.gke.master_ipv4_cidr_block }}"
      # This list replaces values.yaml's egress list entirely, so the traces
      # exporter's rule (otelcol.exporter.otlp -> <tempo>:4317) has to be
      # repeated here — without it spans queue in Alloy and never reach Tempo.
      # Harmless when traces.enabled is false: nothing opens the connection.
      - ports:
          - port: 4317
            protocol: TCP
        to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: '{{ .toptmodule.tempo | "tempo" }}'

receiver:
  image:
    registry: '{{ .toptout.gar-proxy.hub_registry | "docker.io" }}'
  configReloader:
    image:
      registry: '{{ .toptout.gar-proxy.quay_registry | "quay.io" }}'

cluster-metrics:
  image:
    registry: '{{ .toptout.gar-proxy.hub_registry | "docker.io" }}'
  configReloader:
    image:
      registry: '{{ .toptout.gar-proxy.quay_registry | "quay.io" }}'
  externalLabels:
    cluster: "{{ .toutput.gke.cluster_name }}"
  networkPolicy:
    egress:
      # All in-cluster scrape targets
      - to:
          - namespaceSelector: {}
      # Kubernetes API server
      - ports:
          - port: 443
            protocol: TCP
        to:
          - ipBlock:
              cidr: "{{ .toutput.gke.master_ipv4_cidr_block }}"
