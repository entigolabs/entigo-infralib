node-agent:
  metrics:
    externalLabels:
      cluster: "{{ .toutput.aks.cluster_name }}"
  networkPolicy:
    egress:
      - ports:
          - port: 53
            protocol: UDP
          - port: 53
            protocol: TCP
        to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
      # Loki and Mimir, in this cluster or in another one.
      - ports:
          - port: 80
            protocol: TCP
          - port: 8080
            protocol: TCP
      # Kubelet / cAdvisor on the local node
      - ports:
          - port: 10250
            protocol: TCP
      - ports:
          - port: 443
            protocol: TCP
        to:
          - ipBlock:
              cidr: "{{ .toutput.vpc.api_server_cidrs[0] }}"
      # This list replaces values.yaml's egress list entirely, so the traces
      # exporter's rule (otelcol.exporter.otlp -> <tempo>:4317) has to be
      # repeated here — without it spans queue in Alloy and never reach Tempo.
      # Harmless when traces.enabled is false: nothing opens the connection.
      - ports:
          - port: 4317
            protocol: TCP
        to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: '{{ .toptmodule.tempo | "tempo" }}'

cluster-metrics:
  externalLabels:
    cluster: "{{ .toutput.aks.cluster_name }}"
  networkPolicy:
    egress:
      # All in-cluster scrape targets
      - to:
          - namespaceSelector: {}
      # Loki and Mimir, in this cluster or in another one.
      - ports:
          - port: 80
            protocol: TCP
          - port: 8080
            protocol: TCP
      # Kubernetes API server
      - ports:
          - port: 443
            protocol: TCP
        to:
          - ipBlock:
              cidr: "{{ .toutput.vpc.api_server_cidrs[0] }}"
