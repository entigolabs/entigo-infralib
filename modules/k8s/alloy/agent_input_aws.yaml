global:
  # Consumed by templates/aws/networkPolicy.yaml to scope the cluster-metrics UI ALB ingress.
  aws:
    publicSubnetCidrs: "{{ .toutput.vpc.public_subnets_cidr_blocks }}"
    privateSubnetCidrs: "{{ .toutput.vpc.private_subnets_cidr_blocks }}"
    serviceSubnetCidrs: "{{ .toutput.vpc.service_subnets_cidr_blocks }}"
node-agent:
  image:
    registry: '{{ .toptout.ecr-proxy.hub_registry | "docker.io" }}'
  configReloader:
    image:
      registry: '{{ .toptout.ecr-proxy.quay_registry | "quay.io" }}'
  metrics:
    externalLabels:
      cluster: "{{ .toutput.eks.cluster_name }}"
  networkPolicy:
    egress:
      - ports:
          - port: 53
            protocol: UDP
          - port: 53
            protocol: TCP
        to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
      - ports:
          - port: 80
            protocol: TCP
          - port: 8080
            protocol: TCP
        to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: '{{ .toptmodule.loki | "loki" }}'
            podSelector:
              matchLabels:
                app.kubernetes.io/name: '{{ .toptmodule.loki | "loki" }}'
                app.kubernetes.io/component: gateway
      - ports:
          - port: 443
            protocol: TCP
        to:
          - ipBlock:
              cidr: 172.20.0.1/32
cluster-metrics:
  image:
    registry: '{{ .toptout.ecr-proxy.hub_registry | "docker.io" }}'
  configReloader:
    image:
      registry: '{{ .toptout.ecr-proxy.quay_registry | "quay.io" }}'
  externalLabels:
    cluster: "{{ .toutput.eks.cluster_name }}"
receiver:
  image:
    registry: '{{ .toptout.ecr-proxy.hub_registry | "docker.io" }}'
  configReloader:
    image:
      registry: '{{ .toptout.ecr-proxy.quay_registry | "quay.io" }}'
