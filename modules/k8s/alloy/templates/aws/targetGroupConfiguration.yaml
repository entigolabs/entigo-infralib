{{- if and (eq .Values.global.cloudProvider "aws") (index .Values "cluster-metrics" "createRoute") }}
apiVersion: gateway.k8s.aws/v1beta1
kind: TargetGroupConfiguration
metadata:
  name: {{ .Release.Name }}-cluster-metrics
  namespace: {{ .Release.Namespace }}
spec:
  targetReference:
    name: {{ .Release.Name }}-cluster-metrics
  defaultConfiguration:
    targetType: ip
    healthCheckConfig:
      healthCheckPath: /
      matcher:
        httpCode: 200-499
{{- end }}
