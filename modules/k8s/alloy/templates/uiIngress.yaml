{{- $ingress := index .Values "cluster-metrics" "ui" "ingress" }}
{{- if $ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-cluster-metrics-ui
  namespace: {{ .Release.Namespace }}
  {{- with $ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $ingress.ingressClassName }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ required "cluster-metrics.ui.ingress.host must be set when cluster-metrics.ui.ingress.enabled is true" $ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-cluster-metrics
                port:
                  name: http-metrics
{{- end }}
