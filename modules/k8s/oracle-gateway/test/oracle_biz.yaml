# Point the modules that ask for the internal gateway at the external one, the
# same thing aws-alb/test/aws_*.yaml and google-gateway/test/google_*.yaml do.
# Test environments are short lived and have to be reachable without a VPN, and
# the unit tests ask for the internal gateway. Oracle names its gateways
# <release name>-<key>, so this resolves to oracle-gateway-external.
global:
  internalGateway: "{{ .module.name }}-external"
