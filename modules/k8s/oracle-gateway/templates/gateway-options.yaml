{{- if eq .Values.global.cloudProvider "oracle" }}
# Customization for the Deployment/Service Istio generates for the Gateway. Referenced from
# the Gateway's spec.infrastructure.parametersRef; each key is a Strategic Merge Patch
# applied to the corresponding generated resource (valid keys: deployment, service,
# serviceAccount, horizontalPodAutoscaler, podDisruptionBudget).
#
# Why this is needed: this namespace enforces the `restricted` Pod Security Standard (see
# argo-apps.yaml, the repo-wide convention), but Istio's auto-provisioned gateway pod does
# not set seccompProfile, so the ReplicaSet is refused outright with
#   violates PodSecurity "restricted:latest": seccompProfile (pod or container
#   "istio-proxy" must set securityContext.seccompProfile.type to "RuntimeDefault" ...)
# and the Service/load balancer ends up with no backends at all - the load balancer answers
# TCP then resets, which is how this first showed up. The repo's helm-deployed
# modules/k8s/istio-gateway avoids it by setting seccompProfile in its values; an
# auto-provisioned gateway has no values file, so it is patched here instead.
#
# Set at pod level, which satisfies the "pod or container" requirement for every container
# including the injected istio-proxy. Istio's generated pod already satisfies the other
# restricted requirements (runAsNonRoot, dropped capabilities, no privilege escalation).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-options
  namespace: {{ .Release.Namespace }}
  annotations:
    # Ahead of the Gateway, so Istio sees the patch on its first reconcile rather than
    # generating a non-compliant Deployment and correcting it afterwards.
    argocd.argoproj.io/sync-wave: "-1"
data:
  deployment: |
    spec:
      template:
        spec:
          securityContext:
            seccompProfile:
              type: RuntimeDefault
{{- end }}
