{{- if eq .Values.global.cloudProvider "oracle" }}
{{- $namespace := .Release.Namespace }}
{{- range $name, $cfg := .Values.gateways }}
{{- if and (kindIs "map" $cfg) $cfg.enabled }}
{{- $secretName := printf "%s-backend-tls" $name }}
{{- $cert := genSelfSignedCert (printf "%s-istio.%s.svc" $name $namespace) nil nil 3650 }}
---
# Throwaway self-signed cert for Envoy to present to NIC's backend TLS. NIC's own source
# (pkg/loadbalancer/loadbalancer.go, pkg/controllers/ingress/util.go) never sets
# VerifyPeerCertificate, so nothing validates this cert - it only needs to exist. Real MITM
# protection is OCI's own network fabric, not this chain of trust.
#
# Regenerated on every render - ArgoCD renders with `helm template`, where `lookup` has no
# cluster to read, so the existing Secret cannot be reused. argo-apps.yaml ignores this
# Secret's /data, same as oci-native-ingress-controller does for its webhook cert.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $namespace }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
{{- end }}
{{- end }}
{{- end }}
