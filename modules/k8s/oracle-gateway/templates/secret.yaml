{{- if eq .Values.global.cloudProvider "oracle" }}
# Throwaway self-signed cert for Envoy to present to NIC's backend TLS. NIC's own source
# (pkg/loadbalancer/loadbalancer.go, pkg/controllers/ingress/util.go) never sets
# VerifyPeerCertificate, so nothing validates this cert - it only needs to exist. Real MITM
# protection is OCI's own network fabric, not this chain of trust.
#
# Same lookup/reuse pattern as oci-native-ingress-controller's webhook cert
# (templates/webhook-certs.yaml), for the same reason: genSelfSignedCert churns every
# render otherwise. argo-apps.yaml still ignores this Secret's /data, same as that module.
{{- $secretName := printf "%s-backend-tls" .Release.Name }}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $cert := dict }}
{{- if $existingSecret }}
{{- $cert = dict "Cert" (index $existingSecret.data "tls.crt" | b64dec) "Key" (index $existingSecret.data "tls.key" | b64dec) }}
{{- else }}
{{- $cert = genSelfSignedCert (printf "%s.%s.svc" .Release.Name .Release.Namespace) nil nil 3650 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
{{- end }}
