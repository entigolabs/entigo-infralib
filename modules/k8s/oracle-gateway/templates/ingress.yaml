{{- if eq .Values.global.cloudProvider "oracle" }}
# NIC (not CCM) provisions this load balancer and terminates client TLS with the real
# wildcard cert by OCID - see the README for why. Host is a wildcard, not per-app: matches
# the certificate's own shape, and gives external-dns's `ingress` source a real hostname to
# publish one DNS record from.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  annotations:
    oci-native-ingress.oraclecloud.com/certificate-ocid: {{ .Values.global.oracle.certificateOcid | quote }}
    oci-native-ingress.oraclecloud.com/https-listener-port: "443"
    # backend-tls-enabled left unset (true, default) - NIC re-encrypts to Envoy with
    # templates/secret.yaml's throwaway cert, unverified. See that template's comment.
spec:
  ingressClassName: {{ .Values.global.oracle.ingressClassName }}
  rules:
    - host: {{ printf "*.%s" .Values.global.oracle.domain | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-istio
                port:
                  number: 443
  defaultBackend:
    service:
      name: {{ .Release.Name }}-istio
      port:
        number: 443
{{- end }}
