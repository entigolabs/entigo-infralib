metadata:
  annotations:
    # Wave 2: after gateway-api-crds (0) and after istio-base/istio-istiod + cert-manager
    # (1) - the Gateway needs istiod alive to be programmed and the ClusterIssuer to exist
    # before its certificates can be issued. Same wave as external-dns, which reads this
    # Gateway's status address, and ahead of argocd (3) and hello-world (default).
    infralib.entigo.io/sync-wave: "2"
spec:
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/warn: restricted
        tenancy.entigo.com/zone: infralib
