global:
  cloudProvider: ""

  oracle:
    # Base domain for the gateway's hostnames, filled from the dns module's output by
    # agent_input_oracle.yaml. Each entry in `hosts` becomes <host>.<domain>.
    domain: ""
    # Public subnet the OCI load balancer lands in. The oke cluster is created without
    # service_lb_subnet_ids, so the CCM needs the subnet supplied per service.
    loadBalancerSubnetId: ""

gatewayClassName: istio

# One HTTPS listener (and therefore one Let's Encrypt certificate) per entry, plus the
# single shared HTTP listener. Names must match the app module names, because each app's
# HTTPRoute attaches to `https-<name>` via sectionName - see the module README.
#
# Per-host listeners rather than one wildcard listener: a wildcard certificate would need
# ACME DNS-01, and cert-manager has no built-in OCI DNS solver (it would need a webhook).
# HTTP-01 cannot issue wildcards, so per-host it is - which also matches what the previous
# ingress-nginx setup did, and keeps one app's certificate failure from affecting others.
hosts: []

certificate:
  # cert-manager ClusterIssuer that signs the listener certificates. Set to "" to skip the
  # annotation entirely and manage the TLS secrets yourself.
  clusterIssuer: letsencrypt

# Redirect plain HTTP to HTTPS. Safe to leave on together with ACME HTTP-01: cert-manager's
# solver HTTPRoute matches the challenge path with `type: Exact`, and Gateway API ranks an
# Exact match above this rule's PathPrefix, so challenges are not shadowed by the redirect.
httpRedirect:
  enabled: true

service:
  # Classic (layer 4/7) flexible OCI load balancer, smallest shape - the same shape that
  # served ingress-nginx. It only passes TCP 80/443 through; TLS terminates in the Istio
  # gateway with full SNI, so OCI's one-certificate-per-listener limit never applies.
  #
  # Oracle's own Gateway API example suggests "nlb" (Network Load Balancer) instead, which
  # would be a cheaper true-L4 fit. Left on the proven classic "lb" for now so this
  # migration changes one thing at a time; revisiting it is a follow-up, and note NLB
  # differs in source-IP preservation and health-check behaviour.
  annotations:
    oci.oraclecloud.com/load-balancer-type: "lb"
    service.beta.kubernetes.io/oci-load-balancer-shape: "flexible"
    service.beta.kubernetes.io/oci-load-balancer-shape-flex-min: "10"
    service.beta.kubernetes.io/oci-load-balancer-shape-flex-max: "100"
