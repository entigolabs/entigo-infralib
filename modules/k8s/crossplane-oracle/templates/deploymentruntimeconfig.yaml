# Unlike crossplane-aws (IRSA role annotation) and crossplane-google (Workload Identity
# annotation), the service account carries no cloud-identity annotation: the provider
# authenticates via Instance Principal - the node's own identity - which needs no
# per-pod wiring (Basic OKE clusters have no Workload Identity; see providerconfig.yaml).
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: {{ .Release.Name }}-family
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: '1'
    helm.sh/resource-policy: keep
spec:
  deploymentTemplate:
    spec:
      selector: {}
      strategy: {}
      template:
        spec:
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - preference:
                    matchExpressions:
                      - key: tools
                        operator: In
                        values:
                          - 'true'
                  weight: 90
          containers:
            - name: package-runtime
              args:
                {{- with .Values.global.deploymentRuntimeConfig.args }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
              resources:
                requests:
                  cpu: 3m
                  memory: 275Mi
                limits:
                  cpu: 2000m
                  memory: 1024Mi
              securityContext:
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
          securityContext:
            fsGroup: 2000
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          serviceAccountName: {{ .Release.Name }}
          tolerations:
            - effect: NoSchedule
              key: tools
              operator: Equal
              value: 'true'
  serviceTemplate: {}
  serviceAccountTemplate:
    metadata:
      name: {{ .Release.Name }}
---
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: {{ .Release.Name }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: '1'
    helm.sh/resource-policy: keep
spec:
  deploymentTemplate:
    spec:
      selector: {}
      strategy: {}
      template:
        spec:
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - preference:
                    matchExpressions:
                      - key: tools
                        operator: In
                        values:
                          - 'true'
                  weight: 90
          containers:
            - name: package-runtime
              args:
                {{- with .Values.global.deploymentRuntimeConfig.args }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
              resources:
                requests:
                  cpu: 3m
                  memory: 250Mi
                limits:
                  cpu: 2000m
                  # 2Gi, not the 1Gi the other runtime config uses, because the identity
                  # provider spikes hard while starting: measured 1332Mi peak, settling to
                  # 671Mi once running (objectstorage, which shares this config, peaks at
                  # 129Mi). At 1Gi it was SIGKILLed about 15s in, roughly where it logs
                  # "falling back to eager controller setup" - and cri-o reported that as
                  # exit 137 with reason "Error" rather than OOMKilled, so no OOM event was
                  # ever recorded and nothing in the provider's own log looked wrong.
                  #
                  # The spike is a symptom: the provider logs "SafeStart disabled; CRD watch
                  # access denied" and then eagerly starts a controller for every identity
                  # kind instead of only the activated ones. Letting it watch CRDs would cut
                  # this down, and is the better fix if the memory ever becomes a problem.
                  memory: 2048Mi
              securityContext:
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
          securityContext:
            fsGroup: 2000
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          serviceAccountName: {{ .Release.Name }}
          tolerations:
            - effect: NoSchedule
              key: tools
              operator: Equal
              value: 'true'
  serviceTemplate: {}
