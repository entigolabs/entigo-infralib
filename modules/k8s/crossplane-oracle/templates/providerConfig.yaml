{{- if .Values.installProviderConfig }}
# OKE Workload Identity, so the provider acts as its own service account rather than as
# every instance in the compartment. The bootstrap policy in modules/oracle/oke scopes its
# grant to this cluster, namespace and service account - the service account name is pinned
# by deploymentRuntimeConfig.yaml rather than generated per provider revision, which is what
# makes it nameable from terraform. Per-app permissions are then created by Crossplane
# Policy CRs in each consuming module's templates/oracle/.
apiVersion: oci.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: {{ .Release.Name }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    helm.sh/resource-policy: keep
spec:
  credentials:
    source: Secret
    secretRef:
      name: {{ .Release.Name }}-creds
      namespace: {{ .Release.Namespace }}
      key: credentials
---
apiVersion: oci.m.upbound.io/v1beta1
kind: ClusterProviderConfig
metadata:
  name: {{ .Release.Name }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    helm.sh/resource-policy: keep
spec:
  credentials:
    source: Secret
    secretRef:
      name: {{ .Release.Name }}-creds
      namespace: {{ .Release.Namespace }}
      key: credentials
{{- end }}
