{{- if .Values.installProviderConfig }}
# Instance Principal: this is a Basic OKE cluster, so the OKEWorkloadIdentity auth
# variant (Enhanced-only) is unavailable. The provider acts as the node instances via
# the shared dynamic group created in modules/oracle/oke, whose policy grants it
# "manage policies" in the compartment - per-app permissions are then created by
# Crossplane Policy CRs in each consuming module's templates/oracle/.
apiVersion: oci.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: {{ .Release.Name }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    helm.sh/resource-policy: keep
spec:
  credentials:
    source: Secret
    secretRef:
      name: {{ .Release.Name }}-creds
      namespace: {{ .Release.Namespace }}
      key: credentials
---
apiVersion: oci.m.upbound.io/v1beta1
kind: ClusterProviderConfig
metadata:
  name: {{ .Release.Name }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    helm.sh/resource-policy: keep
spec:
  credentials:
    source: Secret
    secretRef:
      name: {{ .Release.Name }}-creds
      namespace: {{ .Release.Namespace }}
      key: credentials
{{- end }}
