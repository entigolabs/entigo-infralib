{{- if .Values.installProviderConfig }}
# The provider only supports credentials.source: Secret (no in-cluster/IRSA-style
# source), so Instance Principal auth still goes through a secret - but the payload
# contains no secret material, just the tenancy OCID and region; authentication itself
# comes from the node's instance identity via the OCI metadata service.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-creds
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
stringData:
  credentials: |
    {"tenancy_ocid": "{{ .Values.global.oracle.tenancyOcid }}", "auth": "InstancePrincipal", "region": "{{ .Values.global.oracle.region }}"}
{{- end }}
