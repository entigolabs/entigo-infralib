{{- if .Values.installProviderConfig }}
# The provider only supports credentials.source: Secret (no in-cluster/IRSA-style
# source), so auth still goes through a secret - but the payload contains no secret
# material, just the tenancy OCID and region. Authentication itself is OKE Workload
# Identity: the control plane vouches for this pod's service account, and the grant is
# scoped to it by the bootstrap policy in modules/oracle/oke.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-creds
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
stringData:
  credentials: |
    {"tenancy_ocid": "{{ .Values.global.oracle.tenancyOcid }}", "auth": "OKEWorkloadIdentity", "region": "{{ .Values.global.oracle.region }}"}
{{- end }}
