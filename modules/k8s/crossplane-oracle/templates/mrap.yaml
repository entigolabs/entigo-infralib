apiVersion: apiextensions.crossplane.io/v1alpha1
kind: ManagedResourceActivationPolicy
metadata:
  name: {{ .Release.Name }}
  annotations:
    argocd.argoproj.io/sync-wave: "18"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  activate:
  - 'policies.identity.oci.upbound.io'
{{- if .Values.global.createObservers }}
  - 'vcns.networking.oci.upbound.io'
  - 'subnets.networking.oci.upbound.io'
  - 'networksecuritygroups.networking.oci.upbound.io'
  - 'clusters.containerengine.oci.upbound.io'
  - 'nodepools.containerengine.oci.upbound.io'
  - 'keys.kms.oci.upbound.io'
{{- end }}
