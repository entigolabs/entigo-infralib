# Unlike crossplane-aws (IRSA role annotation) and crossplane-google (Workload Identity
# annotation), the service account carries no cloud-identity annotation - OKE Workload
# Identity needs none. What matters instead is that the name is pinned below rather than
# generated per provider revision, so modules/oracle/oke can name it in the IAM policy that
# grants this provider its permissions.
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: {{ .Release.Name }}-family
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: '1'
    helm.sh/resource-policy: keep
spec:
  deploymentTemplate:
    spec:
      selector: {}
      strategy: {}
      template:
        spec:
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - preference:
                    matchExpressions:
                      - key: tools
                        operator: In
                        values:
                          - 'true'
                  weight: 90
          containers:
            - name: package-runtime
              args:
                {{- with .Values.global.deploymentRuntimeConfig.args }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
              env:
                - name: OCI_RESOURCE_PRINCIPAL_VERSION
                  value: "2.2"
                - name: OCI_RESOURCE_PRINCIPAL_REGION
                  value: {{ .Values.global.oracle.region }}
              resources:
                {{- toYaml .Values.providerResources.family | nindent 16 }}
              securityContext:
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
          securityContext:
            fsGroup: 2000
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          serviceAccountName: {{ .Release.Name }}
          tolerations:
            - effect: NoSchedule
              key: tools
              operator: Equal
              value: 'true'
  serviceTemplate: {}
  serviceAccountTemplate:
    metadata:
      name: {{ .Release.Name }}
{{- $providers := include "crossplane-oracle.providers" . | fromYamlArray }}
{{- $configs := dict .Release.Name .Values.providerResources.default }}
{{- range $provider, $override := .Values.providerResources.providers }}
{{- if has $provider $providers }}
{{- $_ := set $configs (printf "%s-%s" $.Release.Name $provider) (mergeOverwrite (deepCopy $.Values.providerResources.default) $override) }}
{{- end }}
{{- end }}
{{- range $name, $resources := $configs }}
---
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: {{ $name }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: '1'
    helm.sh/resource-policy: keep
spec:
  deploymentTemplate:
    spec:
      selector: {}
      strategy: {}
      template:
        spec:
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - preference:
                    matchExpressions:
                      - key: tools
                        operator: In
                        values:
                          - 'true'
                  weight: 90
          containers:
            - name: package-runtime
              args:
                {{- with $.Values.global.deploymentRuntimeConfig.args }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
              env:
                - name: OCI_RESOURCE_PRINCIPAL_VERSION
                  value: "2.2"
                - name: OCI_RESOURCE_PRINCIPAL_REGION
                  value: {{ $.Values.global.oracle.region }}
              resources:
                {{- toYaml $resources | nindent 16 }}
              securityContext:
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
          securityContext:
            fsGroup: 2000
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          serviceAccountName: {{ $.Release.Name }}
          tolerations:
            - effect: NoSchedule
              key: tools
              operator: Equal
              value: 'true'
  serviceTemplate: {}
{{- end }}
