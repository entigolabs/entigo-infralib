# Temporary storage version migration for the provider v3 upgrade, remove once all environments are on v3.
# https://github.com/crossplane/upjet/blob/main/docs/applying-storage-version-migration.md
# The init container image must match the provider package version in provider.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-crd-status-patcher
  annotations:
    argocd.argoproj.io/sync-wave: '1'
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions/status"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-crd-status-patcher
  annotations:
    argocd.argoproj.io/sync-wave: '1'
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-crd-status-patcher
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}
    namespace: crossplane-system
{{- range $provider := concat .Values.global.requiredProviders .Values.global.extraProviders .Values.global.observerProviders | uniq }}
---
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: {{ $.Release.Name }}-sv-migration-{{ $provider }}
  annotations:
    argocd.argoproj.io/sync-wave: '1'
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    helm.sh/resource-policy: keep
spec:
  deploymentTemplate:
    spec:
      selector: {}
      strategy: {}
      template:
        spec:
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - preference:
                    matchExpressions:
                      - key: tools
                        operator: In
                        values:
                          - 'true'
                  weight: 90
          initContainers:
            - name: sv-migrator
              image: {{ $.Values.global.deploymentRuntimeConfig.imageRegistry }}/provider-gcp-{{ $provider }}:v3.0.3
              args:
                - init
              securityContext:
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
          containers:
            - name: package-runtime
              securityContext:
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
              args:
                {{- with $.Values.global.deploymentRuntimeConfig.args }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
              resources:
                requests:
                  cpu: 3m
                  memory: 130Mi
                limits:
                  cpu: 2000m
                  memory: 1024Mi
          securityContext:
            fsGroup: 2000
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          serviceAccountName: {{ $.Release.Name }}
          tolerations:
            - effect: NoSchedule
              key: tools
              operator: Equal
              value: 'true'
  serviceTemplate: {}
{{- end }}
