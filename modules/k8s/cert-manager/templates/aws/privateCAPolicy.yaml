{{- if and .Values.global.aws.privateCA.enabled (eq .Values.global.cloudProvider "aws") }}
# global.aws.privateCA.arns, else the CA of the default private domain of the route53 module
{{- $arns := .Values.global.aws.privateCA.arns }}
{{- if and (not $arns) .Values.global.aws.intCertificateAuthorityArn }}
{{- $arns = list .Values.global.aws.intCertificateAuthorityArn }}
{{- end }}
apiVersion: iam.aws.upbound.io/v1beta1
kind: Policy
metadata:
  name: {{ .Release.Name }}-privateca
  annotations:
    crossplane.io/external-name: "{{ .Release.Name }}-privateca"
    argocd.argoproj.io/sync-wave: '-2'
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  forProvider:
    tags:
      created-by: "entigo-infralib"
    # Issuing from the CAs of global.aws.privateCA.arns only (https://github.com/cert-manager/aws-privateca-issuer#configuration)
    policy: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Action": [
              "acm-pca:DescribeCertificateAuthority",
              "acm-pca:GetCertificate",
              "acm-pca:IssueCertificate"
            ],
            "Resource": [
              {{- range $i, $arn := $arns }}
              {{- if $i }},{{ end }}
              {{ $arn | quote }}
              {{- end }}
            ]
          }
        ]
      }

  providerConfigRef:
    name: {{ .Values.global.providerConfigRefName }}

{{- end }}
