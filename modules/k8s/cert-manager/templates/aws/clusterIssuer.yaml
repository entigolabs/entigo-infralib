{{- if and .Values.clusterIssuer.create (eq .Values.global.cloudProvider "aws") }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.clusterIssuer.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  acme:
    server: {{ .Values.acme.server }}
    {{- with .Values.acme.email }}
    email: {{ . }}
    {{- end }}
    privateKeySecretRef:
      name: {{ .Values.clusterIssuer.name }}-account-key
    {{- with .Values.acme.externalAccountBinding }}
    {{- if .keyID }}
    externalAccountBinding:
      keyID: {{ .keyID }}
      keySecretRef:
        {{- toYaml .keySecretRef | nindent 8 }}
    {{- end }}
    {{- end }}
    # Credentials from the IRSA role of the ServiceAccount; the zones by ID, so no lookup by name
    solvers:
      - selector:
          dnsZones:
            - {{ required "global.aws.pubZoneName is required for the ClusterIssuer" .Values.global.aws.pubZoneName | quote }}
        dns01:
          route53:
            region: {{ required "global.aws.region is required for the ClusterIssuer" .Values.global.aws.region }}
            hostedZoneID: {{ required "global.pubZoneId is required for the ClusterIssuer" .Values.global.pubZoneId }}
      {{- with .Values.global.intCertZoneId }}
      - selector:
          dnsZones:
            - {{ required "global.aws.intCertZoneName is required with global.intCertZoneId" $.Values.global.aws.intCertZoneName | quote }}
        dns01:
          route53:
            region: {{ $.Values.global.aws.region }}
            hostedZoneID: {{ . }}
      {{- end }}
{{- end }}
