{{- if and .Values.global.aws.privateCA.enabled (eq .Values.global.cloudProvider "aws") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-approve-awspca
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-approve-awspca
subjects:
  - kind: ServiceAccount
    name: {{ index .Values "cert-manager" "serviceAccount" "name" }}
    namespace: {{ .Release.Namespace }}
{{- end }}
