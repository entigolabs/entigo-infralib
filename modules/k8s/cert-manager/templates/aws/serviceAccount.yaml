{{- if eq .Values.global.cloudProvider "aws" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ index .Values "cert-manager" "serviceAccount" "name" }}
  {{- if .Values.clusterIssuer.create }}
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::{{ .Values.global.aws.account }}:role/{{ .Release.Name }}
  {{- end }}
{{- end }}
