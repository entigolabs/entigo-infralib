{{- if and .Values.awsPrivateCA.enabled (eq .Values.global.cloudProvider "aws") }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ index .Values "aws-privateca-issuer" "serviceAccount" "name" }}
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::{{ .Values.global.aws.account }}:role/{{ .Release.Name }}-privateca
{{- end }}
