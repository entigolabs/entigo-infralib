{{- if and .Values.aws.privateCA.enabled (eq .Values.global.cloudProvider "aws") }}
# The cert-manager approver may approve the requests of the AWS Private CA issuers. The subchart's own approverRole
# takes the namespace of cert-manager from values, this one follows the release
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-approve-awspca
rules:
  - apiGroups:
      - cert-manager.io
    resources:
      - signers
    verbs:
      - approve
    resourceNames:
      - awspcaclusterissuers.awspca.cert-manager.io/*
      - awspcaissuers.awspca.cert-manager.io/*
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-approve-awspca
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-approve-awspca
subjects:
  - kind: ServiceAccount
    name: {{ index .Values "cert-manager" "serviceAccount" "name" }}
    namespace: {{ .Release.Namespace }}
{{- end }}
