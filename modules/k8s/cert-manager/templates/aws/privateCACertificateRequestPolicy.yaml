{{- $allowed := include "cert-manager.privateCAPolicyAllowed" . | fromJson }}
{{- if and .Values.global.aws.privateCA.enabled .Values.global.aws.privateCA.policy.enabled $allowed (eq .Values.global.cloudProvider "aws") }}
# What may be requested from the AWS Private CA issuers, the one of this module and own ones alike
apiVersion: policy.cert-manager.io/v1alpha1
kind: CertificateRequestPolicy
metadata:
  name: {{ .Release.Name }}-privateca
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  allowed:
    {{- toYaml $allowed | nindent 4 }}
  selector:
    issuerRef:
      group: awspca.cert-manager.io
      kind: "*"
      name: "*"
{{- end }}
