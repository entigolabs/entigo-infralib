{{- if and .Values.global.aws.privateCA.enabled .Values.global.aws.privateCA.policy.enabled .Values.global.aws.privateCA.policy.allowed (eq .Values.global.cloudProvider "aws") }}
# Everyone: the requests cert-manager makes for Certificates and the CertificateRequests created directly
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-use-privateca-policy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-use-privateca-policy
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: system:authenticated
{{- end }}
