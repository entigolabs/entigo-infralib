{{- if eq .Values.global.cloudProvider "azure" }}
apiVersion: azure.entigo.com/v1alpha1
kind: WorkloadIdentity
metadata:
  name: {{ .Release.Name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  serviceAccountName: {{ index .Values "cert-manager" "serviceAccount" "name" }}
  roleAssignments:
    - role: DNS Zone Contributor
      scope: {{ .Values.global.azure.pubZoneId }}
    {{- with .Values.global.azure.intCertZoneId }}
    - role: DNS Zone Contributor
      scope: {{ . }}
    {{- end }}
{{- end }}
