{{- if and .Values.clusterIssuer.create (eq .Values.global.cloudProvider "azure") }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.clusterIssuer.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  acme:
    {{- include "cert-manager.acme" . | nindent 4 }}
    # The WorkloadIdentity of the ServiceAccount; the zone's resource group and name from its resource ID
    solvers:
      {{- range $zoneId := compact (list (required "global.pubZoneId is required for the ClusterIssuer" .Values.global.pubZoneId) .Values.global.intCertZoneId) }}
      {{- $id := splitList "/" $zoneId }}
      - selector:
          dnsZones:
            - {{ index $id 8 | quote }}
        dns01:
          azureDNS:
            subscriptionID: {{ index $id 2 }}
            resourceGroupName: {{ index $id 4 }}
            hostedZoneName: {{ index $id 8 }}
            environment: AzurePublicCloud
            managedIdentity: {}
      {{- end }}
{{- end }}
