{{- if or .Values.issuer.gateway.name .Values.issuer.ingressClassName }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
  annotations:
    # CRDs install in the same sync as this resource - skip dry-run so ArgoCD doesn't
    # fail the sync before the CRD is established (same pattern as aws-alb's IRSA CRs).
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "1"
spec:
  acme:
    server: {{ .Values.issuer.server }}
    email: {{ .Values.issuer.email }}
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - http01:
          {{- if .Values.issuer.gateway.name }}
          # Gateway API solver: cert-manager creates a temporary HTTPRoute pointing at
          # this Gateway rather than an Ingress, so no ingress controller is needed. The
          # Gateway must already exist and have a port-80 listener accepting routes from
          # this namespace - cert-manager never edits Gateways, and if nothing matches it
          # creates the route and then silently waits forever.
          gatewayHTTPRoute:
            parentRefs:
              - group: gateway.networking.k8s.io
                kind: Gateway
                name: {{ .Values.issuer.gateway.name }}
                {{- with .Values.issuer.gateway.namespace }}
                namespace: {{ . }}
                {{- end }}
          {{- else }}
          ingress:
            ingressClassName: {{ .Values.issuer.ingressClassName }}
            {{- with .Values.issuer.solverIngressAnnotations }}
            ingressTemplate:
              metadata:
                annotations:
                  {{- toYaml . | nindent 18 }}
            {{- end }}
          {{- end }}
{{- end }}
