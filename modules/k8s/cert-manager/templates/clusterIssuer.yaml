{{- if and .Values.clusterIssuer.create (has .Values.global.cloudProvider (list "aws" "azure")) }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.clusterIssuer.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  acme:
    server: {{ .Values.acme.server }}
    {{- with .Values.acme.email }}
    email: {{ . }}
    {{- end }}
    privateKeySecretRef:
      name: {{ .Values.clusterIssuer.name }}-account-key
    {{- with .Values.acme.externalAccountBinding }}
    {{- if .keyID }}
    externalAccountBinding:
      keyID: {{ .keyID }}
      keySecretRef:
        {{- toYaml .keySecretRef | nindent 8 }}
    {{- end }}
    {{- end }}
    solvers:
      {{- if eq .Values.global.cloudProvider "aws" }}
      {{- /* Credentials from the IRSA role of the ServiceAccount; the zone by ID, so no lookup by name */}}
      {{- $zones := list (dict "id" (required "global.pubZoneId is required for the ClusterIssuer" .Values.global.pubZoneId) "name" (required "global.aws.pubZoneName is required for the ClusterIssuer" .Values.global.aws.pubZoneName)) }}
      {{- with .Values.global.intCertZoneId }}
      {{- $zones = append $zones (dict "id" . "name" (required "global.aws.intCertZoneName is required with global.intCertZoneId" $.Values.global.aws.intCertZoneName)) }}
      {{- end }}
      {{- range $zone := $zones }}
      - selector:
          dnsZones:
            - {{ $zone.name | quote }}
        dns01:
          route53:
            {{- with $.Values.global.aws.region }}
            region: {{ . }}
            {{- end }}
            hostedZoneID: {{ $zone.id }}
      {{- end }}
      {{- end }}
      {{- if eq .Values.global.cloudProvider "azure" }}
      {{- range $zoneId := compact (list (required "global.pubZoneId is required for the ClusterIssuer" .Values.global.pubZoneId) .Values.global.intCertZoneId) }}
      {{- $id := splitList "/" $zoneId }}
      - selector:
          dnsZones:
            - {{ index $id 8 | quote }}
        dns01:
          azureDNS:
            subscriptionID: {{ index $id 2 }}
            resourceGroupName: {{ index $id 4 }}
            hostedZoneName: {{ index $id 8 }}
            environment: AzurePublicCloud
            managedIdentity: {}
      {{- end }}
      {{- end }}
{{- end }}
