global:
  cloudProvider: azure

cert-manager:
  # Split horizon: the DNS-01 self check runs through public resolvers. In the VNet the Azure resolver answers for the
  # int domain from its private zone, which has no public NS and not the challenge records (those are in its public
  # twin), so the check would never pass. Needs outbound port 53 to them; other DNS servers can be set instead if they
  # resolve the int domain from public DNS, not from the private zone
  dns01RecursiveNameservers: "1.1.1.1:53,8.8.8.8:53"
  dns01RecursiveNameserversOnly: true
  serviceAccount:
    create: false
    name: cert-manager
  podLabels:
    azure.workload.identity/use: "true"
  tolerations:
    - key: "tools"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
    - key: "CriticalAddonsOnly"
      operator: "Exists"
      effect: "NoSchedule"
  webhook:
    tolerations:
      - key: "tools"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      - key: "CriticalAddonsOnly"
        operator: "Exists"
        effect: "NoSchedule"
    # AKS Admissions Enforcer adds the last two expressions
    validatingWebhookConfiguration:
      namespaceSelector:
        matchExpressions:
          - key: "cert-manager.io/disable-validation"
            operator: "NotIn"
            values:
              - "true"
          - key: "control-plane"
            operator: "NotIn"
            values:
              - "true"
          - key: "kubernetes.azure.com/managedby"
            operator: "NotIn"
            values:
              - "aks"
  cainjector:
    tolerations:
      - key: "tools"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      - key: "CriticalAddonsOnly"
        operator: "Exists"
        effect: "NoSchedule"
