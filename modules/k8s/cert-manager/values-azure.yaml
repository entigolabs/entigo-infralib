global:
  cloudProvider: azure

cert-manager:
  podLabels:
    azure.workload.identity/use: "true"
  tolerations:
    - key: "tools"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
    - key: "CriticalAddonsOnly"
      operator: "Exists"
      effect: "NoSchedule"
  webhook:
    tolerations:
      - key: "tools"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      - key: "CriticalAddonsOnly"
        operator: "Exists"
        effect: "NoSchedule"
    # AKS Admissions Enforcer adds the last two expressions
    validatingWebhookConfiguration:
      namespaceSelector:
        matchExpressions:
          - key: "cert-manager.io/disable-validation"
            operator: "NotIn"
            values:
              - "true"
          - key: "control-plane"
            operator: "NotIn"
            values:
              - "true"
          - key: "kubernetes.azure.com/managedby"
            operator: "NotIn"
            values:
              - "aks"
  cainjector:
    tolerations:
      - key: "tools"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      - key: "CriticalAddonsOnly"
        operator: "Exists"
        effect: "NoSchedule"
