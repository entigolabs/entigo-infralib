global:
  cloudProvider: ""

# ACME ClusterIssuer with DNS-01 in the cloud DNS (templates/<cloud>/clusterIssuer.yaml)
clusterIssuer:
  name: letsencrypt

acme:
  server: https://acme-v02.api.letsencrypt.org/directory
  email: ""
  # For ACME CAs that require it (ZeroSSL, Sectigo, Google Public CA). The HMAC key Secret must be in this namespace
  externalAccountBinding:
    keyID: ""
    keySecretRef:
      name: ""
      key: ""

# More ClusterIssuers, spec as is (CA, Vault, ...):
#  - name: internal-ca
#    spec:
#      ca:
#        secretName: internal-ca
extraClusterIssuers: []

cert-manager:
  crds:
    enabled: true
    keep: true
  startupapicheck:
    enabled: false
  prometheus:
    enabled: true
  deploymentAnnotations:
    kube-score/ignore: pod-networkpolicy,pod-probes
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 90
          preference:
            matchExpressions:
              - key: tools
                operator: In
                values:
                  - "true"
  tolerations:
    - key: "tools"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
  resources:
    limits:
      cpu: 1000m
      memory: 512Mi
      ephemeral-storage: 1Gi
    requests:
      cpu: 10m
      memory: 64Mi
      ephemeral-storage: 24Mi
  webhook:
    deploymentAnnotations:
      kube-score/ignore: pod-networkpolicy,pod-probes
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 90
            preference:
              matchExpressions:
                - key: tools
                  operator: In
                  values:
                    - "true"
    tolerations:
      - key: "tools"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
        ephemeral-storage: 256Mi
      requests:
        cpu: 5m
        memory: 32Mi
        ephemeral-storage: 8Mi
  cainjector:
    deploymentAnnotations:
      kube-score/ignore: pod-networkpolicy,pod-probes
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 90
            preference:
              matchExpressions:
                - key: tools
                  operator: In
                  values:
                    - "true"
    tolerations:
      - key: "tools"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
        ephemeral-storage: 256Mi
      requests:
        cpu: 5m
        memory: 64Mi
        ephemeral-storage: 8Mi
