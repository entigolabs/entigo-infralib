global:
  cloudProvider: aws
  providerConfigRefName: crossplane-aws

  aws:
    account: ""
    clusterOIDC: ""
    region: ""
    # Route53 zone IDs carry no name, the solver selectors need the zone names
    # of global.pubZoneId and global.intCertZoneId
    pubZoneName: ""
    intCertZoneName: ""

# The gateways on AWS use ACM certificates, so by default cert-manager is installed alone. true adds the ACME
# ClusterIssuer with Route53 DNS-01 solvers and the IRSA role for it (crossplane-aws)
clusterIssuer:
  create: false

cert-manager:
  # The IRSA token is projected root-owned with mode 0600 and the controller runs as non-root: fsGroup makes it
  # readable (https://cert-manager.io/docs/configuration/acme/dns01/route53/)
  securityContext:
    fsGroup: 1001

# The subchart of global.aws.privateCA.enabled
aws-privateca-issuer:
  fullnameOverride: aws-privateca-issuer
  # One pod like the cert-manager deployments, the chart defaults to 2
  replicaCount: 1
  # The ServiceAccount with the IRSA role annotation comes from templates/aws/privateCAServiceAccount.yaml
  serviceAccount:
    create: false
    name: aws-privateca-issuer
  # templates/aws/privateCAApproverClusterRole.yaml and its binding instead: they follow the namespace of the release
  approverRole:
    enabled: false
  deploymentAnnotations:
    kube-score/ignore: pod-networkpolicy
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 90
          preference:
            matchExpressions:
              - key: tools
                operator: In
                values:
                  - "true"
  tolerations:
    - key: "tools"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
      ephemeral-storage: 256Mi
    requests:
      cpu: 5m
      memory: 32Mi
      ephemeral-storage: 8Mi
