apiVersion: v2
name: cert-manager
description: cert-manager with an ACME ClusterIssuer (DNS-01), for gateways that need TLS certificates as Kubernetes Secrets
type: application
version: 0.1.0
appVersion: "1.0"

dependencies:
  - name: cert-manager
    version: v1.21.3
    repository: https://charts.jetstack.io
  - name: aws-privateca-issuer
    version: v1.12.1
    repository: https://cert-manager.github.io/aws-privateca-issuer
    condition: global.aws.privateCA.enabled
  - name: cert-manager-approver-policy
    version: v0.29.0
    repository: https://charts.jetstack.io
    condition: global.aws.privateCA.policy.enabled
