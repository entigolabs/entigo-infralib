# Note what does NOT use this issuer: the platform tools (argocd, grafana, prometheus) are
# served by a single zone-wide wildcard certificate created in the infra step by
# modules/oracle/dns, because an OCI load balancer listener carries only one key pair and
# NIC puts every Ingress on the same listener. This ClusterIssuer stays for anything that
# genuinely needs its own certificate - which on Oracle means an app exposed through Istio
# rather than through NIC, since only Istio can do SNI across several certificates.
issuer:
  # modules/k8s/oci-native-ingress-controller's IngressClass. cert-manager's HTTP-01
  # solver service is NodePort by default, which is also what NIC requires on Flannel
  # clusters to populate LB backends.
  ingressClassName: oci-ic
  # NIC creates one LB listener per backend service port - without this the challenge
  # route lands on the solver service's port (8089), where Let's Encrypt (port 80)
  # never looks. Confirmed live via the LB's routing policies. This annotation merges
  # the solver's route onto the port-80 listener.
  solverIngressAnnotations:
    oci-native-ingress.oraclecloud.com/http-listener-port: "80"
