apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: test
spec:
  # The class every Oracle test cluster keeps; the external one is turned off there.
  ingressClassName: internal
  rules:
    - host: change-domain
      http:
        paths:
          - backend:
              service:
                name: test
                port:
                  number: 80
            path: /
            pathType: Prefix
