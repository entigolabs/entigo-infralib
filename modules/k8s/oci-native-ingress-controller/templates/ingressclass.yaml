{{- range $key, $class := .Values.ingressClasses }}
{{- if $class.enabled }}
---
apiVersion: "ingress.oraclecloud.com/v1beta1"
kind: IngressClassParameters
metadata:
  name: {{ $class.name }}-parameters
  namespace: {{ $.Values.deploymentNamespace }}
  annotations:
    # Pruned in an earlier wave than the controller Deployment (wave 0), so NIC is still
    # running to release the LB and clear its finalizer instead of being deleted alongside it.
    argocd.argoproj.io/sync-wave: '1'
spec:
  compartmentId: {{ $class.compartmentId | default $.Values.global.oracle.compartmentId | quote }}
  subnetId: {{ $class.subnetId | quote }}
  loadBalancerName: {{ $class.loadBalancerName | quote }}
  isPrivate: {{ $class.isPrivate }}
  minBandwidthMbps: {{ $class.minBandwidthMbps }}
  maxBandwidthMbps: {{ $class.maxBandwidthMbps }}
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: {{ $class.name }}
  annotations:
    # Same reasoning as IngressClassParameters above: this finalizes via
    # oci.oraclecloud.com/ingress-controller-protection, which only the controller Deployment
    # clears - pruning this before the Deployment (wave 0) is gone avoids a deadlocked
    # finalizer that never releases once nothing is left to process it.
    argocd.argoproj.io/sync-wave: '1'
    {{- if $class.isDefaultClass }}
    ingressclass.kubernetes.io/is-default-class: "true"
    {{- end }}
    {{- if $class.nsgIds }}
    # NIC attaches the LB to these NSGs - the only way it manages LB network access
    # (it never touches security lists). Without this the LB sits behind the subnet's
    # default security list, which blocks 80/443.
    oci-native-ingress.oraclecloud.com/network-security-group-ids: {{ $class.nsgIds | quote }}
    {{- end }}
spec:
  controller: oci.oraclecloud.com/native-ingress-controller
  parameters:
    scope: Namespace
    namespace: {{ $.Values.deploymentNamespace }}
    apiGroup: ingress.oraclecloud.com
    kind: ingressclassparameters
    name: {{ $class.name }}-parameters
{{- end }}
{{- end }}
