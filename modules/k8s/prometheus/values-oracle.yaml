global:
  cloudProvider: oracle
  providerConfigRefName: crossplane-oracle
  oracle:
    # The in-cluster kube-apiserver ClusterIP, for the kube-state-metrics egress policy
    # below. aws hardcodes its own equivalent (172.20.0.1) in values.yaml.
    kubernetesServiceIp: ""

prometheus:
  server:
    ingress:
      enabled: true
      # modules/k8s/oci-native-ingress-controller's IngressClass; the annotations are the
      # OCI equivalent of the alb ones in values-aws.yaml. See
      # modules/k8s/argocd/values-oracle.yaml for what each of them does - the
      # certificate-ocid one is added by agent_input_oracle.yaml.
      ingressClassName: oci-ic
      annotations:
        oci-native-ingress.oraclecloud.com/https-listener-port: "443"
        oci-native-ingress.oraclecloud.com/backend-tls-enabled: "false"
      # Empty rather than the aws-style list: the certificate is referenced by OCID, so no
      # Kubernetes TLS secret is involved. `hosts` is set in agent_input_oracle.yaml.
      tls: []
    persistentVolume:
      # OKE's default StorageClass. Named explicitly rather than relying on the default so
      # the intent survives a cluster whose default class differs.
      storageClass: oci-bv
      # OCI Block Volume has a 50GB floor - a smaller request is rounded up and billed at
      # 50GB anyway, so ask for what we actually get instead of the upstream chart's 8Gi.
      size: 50Gi

  kube-state-metrics:
    networkPolicy:
      egress:
        # Replaces the aws-shaped 172.20.0.1/32 entry from values.yaml (Helm list values are
        # replaced wholesale, not merged). Note NetworkPolicy is not actually enforced on
        # this cluster - OKE with FLANNEL_OVERLAY ships no policy controller - so this is
        # correctness for the day one is added rather than something load-bearing today.
        - to:
            - ipBlock:
                cidr: "" # set in agent_input_oracle.yaml from the oke module's output
          ports:
            - port: 443
              protocol: TCP
