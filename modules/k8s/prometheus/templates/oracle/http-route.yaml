{{- if eq .Values.global.cloudProvider "oracle" }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.global.oracle.gateway.name }}
      namespace: {{ .Values.global.oracle.gateway.namespace }}
      sectionName: {{ .Values.global.oracle.gateway.sectionName }}
  hostnames:
    - {{ .Values.global.oracle.hostname }}
  rules:
    - backendRefs:
        - group: ''
          kind: Service
          name: {{ .Release.Name }}-server
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
{{- end }}
