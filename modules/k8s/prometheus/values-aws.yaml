global:
  cloudProvider: aws
  providerConfigRefName: crossplane-aws

prometheus:
  server:
    ingress:
      ingressClassName: "alb"
      annotations:
        alb.ingress.kubernetes.io/ssl-redirect: "443"
        alb.ingress.kubernetes.io/group.name: internal
        alb.ingress.kubernetes.io/healthcheck-path: /
        alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS":443}]'
        alb.ingress.kubernetes.io/scheme: internal
        alb.ingress.kubernetes.io/success-codes: 200-499
        alb.ingress.kubernetes.io/target-type: ip
        # The same three paths the route keeps from the outside, see values.yaml.
        alb.ingress.kubernetes.io/actions.cluster-only: '{"type":"fixed-response","fixedResponseConfig":{"contentType":"text/plain","statusCode":"404","messageBody":"not found"}}'
      extraPaths:
        - path: /api/v1/write
          pathType: Exact
          backend:
            service:
              name: cluster-only
              port:
                name: use-annotation
        - path: /-/reload
          pathType: Exact
          backend:
            service:
              name: cluster-only
              port:
                name: use-annotation
        - path: /-/quit
          pathType: Exact
          backend:
            service:
              name: cluster-only
              port:
                name: use-annotation
      hosts:
        - prometheus
      tls: []
