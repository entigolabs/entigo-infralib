global:
  prefix: ""
  cloudProvider: ""
  providerConfigRefName: ""
  installPrometheusOperatorCRDs: false
  installBlackbox: false

prometheus-operator-crds:
  crds:
    annotations:
      argocd.argoproj.io/sync-options: ServerSideApply=true

prometheus-blackbox-exporter:
  resources:
    limits:
      memory: 300Mi
      cpu: 1
      ephemeral-storage: 250Mi
    requests:
      memory: 50Mi
      cpu: 25m
      ephemeral-storage: 1Mi
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 90
          preference:
            matchExpressions:
              - key: mon
                operator: In
                values:
                  - "true"
        - weight: 10
          preference:
            matchExpressions:
              - key: tools
                operator: In
                values:
                  - "true"
  tolerations:
    - key: "mon"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
    - key: "tools"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"

prometheus:
  fullnameOverride: prometheus
  scrapeConfigs:
    kubernetes-api-servers:
      # The API server's histograms are the largest source of series in a cluster, and no
      # bundled dashboard charts their buckets. The _sum and _count of each histogram stay,
      # so rates and averages still work, percentiles do not. The same list as
      # cluster-metrics.apiserverDropMetrics of the alloy module; set an empty list to keep
      # everything.
      metric_relabel_configs:
        - source_labels: [__name__]
          regex: ".+_bucket"
          action: drop
    kubernetes-nodes-cadvisor:
      # Per-container cAdvisor metrics that no bundled dashboard uses. The same list as
      # node-agent.metrics.cadvisorDropMetrics of the alloy module; set an empty list to
      # keep everything.
      metric_relabel_configs:
        - source_labels: [__name__]
          regex: "container_tasks_state|container_memory_failures_total|container_cpu_load_average_10s|container_fs_(io_current|io_time_seconds_total|io_time_weighted_seconds_total|reads_merged_total|sector_reads_total|sector_writes_total|writes_merged_total)|container_threads_max|container_last_seen"
          action: drop
      # The chart's cAdvisor job names the node only in `instance`. The Kubernetes dashboards
      # select container metrics with node="...", as kube-state-metrics and the alloy module
      # label them, so add it here too.
      post_relabel_configs: |
        - source_labels: [__meta_kubernetes_node_name]
          target_label: node
  server:
    # The remote write receiver is on so that the alloy module can use this Prometheus as its
    # store without further inputs. The list replaces the chart's, which holds
    # web.enable-lifecycle: the config reloader sidecar needs that one to call /-/reload.
    extraFlags:
      - web.enable-lifecycle
      - web.enable-remote-write-receiver
    route:
      main:
        # Neither flag has authentication, so writing, reloading and shutting down are for the
        # cluster only: a rule without a backend makes the gateway answer 404.
        additionalRules:
          - matches:
              - path:
                  type: Exact
                  value: /api/v1/write
              - path:
                  type: Exact
                  value: /-/reload
              - path:
                  type: Exact
                  value: /-/quit
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 90
            preference:
              matchExpressions:
                - key: mon
                  operator: In
                  values:
                    - "true"
          - weight: 10
            preference:
              matchExpressions:
                - key: tools
                  operator: In
                  values:
                    - "true"
    tolerations:
      - key: "mon"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      - key: "tools"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
    resources:
      limits:
        cpu: 4000m
        memory: 8Gi
        ephemeral-storage: 5Gi
      requests:
        cpu: 300m
        memory: 2048Mi
        ephemeral-storage: 10Mi
  configmapReload:
    prometheus:
      resources:
        limits:
          cpu: 1000m
          memory: 1Gi
          ephemeral-storage: 1Gi
        requests:
          cpu: 5m
          memory: 16Mi
          ephemeral-storage: 10Mi
  prometheus-pushgateway:
    enabled: false
  alertmanager:
    enabled: true
    configmapReload:
      enabled: true
      resources:
        limits:
          cpu: 1000m
          memory: 1Gi
          ephemeral-storage: 1Gi
        requests:
          cpu: 3m
          memory: 16Mi
          ephemeral-storage: 10Mi
    statefulSet:
      annotations:
        kube-score/ignore: pod-probes,pod-networkpolicy
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 90
            preference:
              matchExpressions:
                - key: mon
                  operator: In
                  values:
                    - "true"
          - weight: 10
            preference:
              matchExpressions:
                - key: tools
                  operator: In
                  values:
                    - "true"
    tolerations:
      - key: "mon"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      - key: "tools"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
    resources:
      limits:
        cpu: 100m
        memory: 1Gi
        ephemeral-storage: 1Gi
      requests:
        cpu: 10m
        memory: 32Mi
        ephemeral-storage: 10Mi
    networkPolicy:
      enabled: true

  kube-state-metrics:
    enabled: true
    metricLabelsAllowlist:
      - nodes=[eks.amazonaws.com/nodegroup,kubernetes.io/arch,node.kubernetes.io/instance-type,tenancy.entigo.com/zone,tenancy.entigo.com/zone-pool,eks.amazonaws.com/capacityType,topology.kubernetes.io/zone]
      - namespaces=[tenancy.entigo.com/zone]
    networkPolicy:
      enabled: true
      ingress:
        - ports:
            - port: http
            - port: metrics
      egress:
        - to:
            - ipBlock:
                cidr: 172.20.0.1/32
          ports:
            - port: 443
              protocol: TCP
        - to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: kube-system
              podSelector:
                matchLabels:
                  k8s-app: kube-dns
          ports:
            - protocol: UDP
              port: 53
            - protocol: TCP
              port: 53
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 90
            preference:
              matchExpressions:
                - key: mon
                  operator: In
                  values:
                    - "true"
          - weight: 10
            preference:
              matchExpressions:
                - key: tools
                  operator: In
                  values:
                    - "true"
    tolerations:
      - key: "mon"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      - key: "tools"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
    resources:
      limits:
        cpu: 1
        memory: 256Mi
        ephemeral-storage: 1Gi
      requests:
        cpu: 10m
        memory: 32Mi
        ephemeral-storage: 10Mi

  prometheus-node-exporter:
    priorityClassName: "prometheus-node-exporter"
    enabled: true
    daemonsetAnnotations:
      kube-score/ignore: pod-probes
    resources:
      limits:
        cpu: 1
        memory: 1Gi
        ephemeral-storage: 1Gi
      requests:
        cpu: 3m
        memory: 14Mi
        ephemeral-storage: 10Mi
    networkPolicy:
      enabled: true

  networkPolicy:
    enabled: true
  resources:
    limits:
      cpu: 1
      memory: 1Gi
      ephemeral-storage: 1Gi
    requests:
      cpu: 10m
      memory: 16Mi
      ephemeral-storage: 10Mi
