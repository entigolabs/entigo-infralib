global:
  installPrometheusOperatorCRDs: true
  installBlackbox: true
  server:
    remoteWrite:
      - name: "{{ .config.prefix }}"
        url: http://mimir-gateway.{{ .tmodule.mimir }}/api/v1/push
        headers:
          X-Scope-OrgID: "{{ .config.prefix }}"
prometheus:
  server:
    route:
      main:
        # google-gateway/test points internalGateway at the external gateway,
        # but the unit test probes the internal one in biz, the same way
        # aws_biz.yaml pins the service gateway.
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: Gateway
            name: "{{ .tmodule.google-gateway }}-internal"
            namespace: "{{ .tmodule.google-gateway }}"
            sectionName: https
