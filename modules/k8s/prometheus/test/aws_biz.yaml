global:
  installPrometheusOperatorCRDs: true
  installBlackbox: true
  server:
    remoteWrite:
      - name: "{{ .config.prefix }}"
        url: http://mimir-gateway.{{ .tmodule.mimir }}/api/v1/push
        headers:
          X-Scope-OrgID: "{{ .config.prefix }}"
prometheus:
  server:
    route:
      main:
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: Gateway
            name: service
            namespace: "{{ .tmodule.aws-alb }}"
            sectionName: https
