prometheus:
  kube-state-metrics:
    networkPolicy:
      egress:
        # API server in the vpc apiserver subnet (aks VNet integration)
        - to:
            - ipBlock:
                cidr: "{{ .toutput.vpc.apiserver_subnet_cidrs[0] }}"
          ports:
            - port: 443
        - to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: kube-system
              podSelector:
                matchLabels:
                  k8s-app: kube-dns
          ports:
            - protocol: UDP
              port: 53
            - protocol: TCP
              port: 53
