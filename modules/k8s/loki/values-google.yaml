global:
  cloudProvider: google
  providerConfigRefName: crossplane-google
  region: "EU"
  bucketName: ""

  google:
    projectID: ""
    gateway:
      # Still read by templates/google/healthCheckPolicy.yaml and
      # templates/google/networkPolicy.yaml. The gateway the route attaches to
      # is chosen in agent_input.yaml, not here.
      enabled: true
      extraHealthCheckCidrs: []
    bucket:
      location: ""
      lifecycleRule: []

loki:
  loki:
    storage:
      type: gcs
    # storage_config:
    #   boltdb_shipper:
    #     shared_store: gcs
    schemaConfig:
      configs:
        - from: "2022-01-11"
          index:
            period: 24h
            prefix: loki_index_
          object_store: gcs
          schema: v12
          store: boltdb-shipper
        - from: "2025-12-01" # Replace with future date
          store: tsdb
          object_store: gcs
          schema: v13
          index:
            prefix: index_
            period: 24h

  read:
    persistence:
      storageClass: standard

  gateway:
    ingress:
      enabled: false
    route:
      main:
        # google has no ingress, the gateway route is always on
        enabled: true

  networkPolicy:
    externalStorage:
      ports:
        - 443
    discovery:
      port: 53
      podSelector:
        matchLabels:
          k8s-app: kube-dns
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
