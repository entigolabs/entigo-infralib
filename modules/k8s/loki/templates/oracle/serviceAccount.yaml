{{- if eq .Values.global.cloudProvider "oracle" }}
# Plain ServiceAccount with no cloud identity attached. aws annotates this with an IRSA role
# and google pairs it with a GCP service account, both so loki can reach object storage as
# itself. Neither pattern is available here: loki authenticates with a Customer Secret Key
# because OCI's S3-compatibility endpoint accepts nothing else, so the credential arrives as
# an environment variable instead (see templates/oracle/credentials.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.loki.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
{{- end }}
