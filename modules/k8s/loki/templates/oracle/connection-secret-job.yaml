{{- if eq .Values.global.cloudProvider "oracle" }}
# Copies the Customer Secret Key out of the CR's status and into the Secret loki mounts.
#
# This should not be necessary. templates/oracle/credentials.yaml asks Crossplane for a
# connection secret via writeConnectionSecretToRef, and Crossplane does create it - empty.
# The upbound OCI provider creates the identitydomains.oci.upbound.io CustomerSecretKey resource
# on its async path (the CR carries an AsyncOperation condition) and publishes no connection
# details when that completes, so the Secret exists with zero keys while the CR reports
# Ready=True and Synced=True. loki then fails to start with "couldn't find key attribute.id in
# Secret loki/loki-object-storage", which reads like a naming mistake rather than an empty secret.
#
# The values are not lost, only in the wrong place: the provider copies both the key's access
# key ID and the secret itself into status.atProvider (see the SECURITY NOTE in credentials.yaml -
# they are plaintext in the CR either way). So this job reads them from there and writes the
# two keys the deployment expects.
#
# RBAC at wave -2, the job at -1, loki's workloads at the default wave. The CustomerSecretKey
# is also at -1, so the job may well start before it exists - which is fine and is why it
# polls rather than reads once: the async create takes a couple of minutes anyway.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-object-storage-secret
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
---
# The CustomerSecretKey/User/Group CRs are cluster-scoped, so reading and patching them needs
# a ClusterRole; writing the Secret is namespaced and stays a Role. All pinned to the single
# objects they touch. The job also patches Group here (see below): its members field takes
# plain ocid/type/value strings, so bridging in the User's OCID needs the same job-based
# approach as the CustomerSecretKey's connection details.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-object-storage-secret
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
rules:
  - apiGroups: ["identitydomains.oci.upbound.io"]
    resources: ["customersecretkeys", "users"]
    resourceNames: ["{{ .Release.Name }}"]
    verbs: ["get"]
  - apiGroups: ["identitydomains.oci.upbound.io"]
    resources: ["groups"]
    resourceNames: ["{{ .Release.Name }}"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-object-storage-secret
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-object-storage-secret
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ .Release.Name }}-object-storage-secret
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-object-storage-secret
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["{{ .Release.Name }}-object-storage"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-object-storage-secret
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-object-storage-secret
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ .Release.Name }}-object-storage-secret
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-object-storage-secret
  namespace: {{ .Release.Namespace }}
  annotations:
    # A Sync hook rather than a plain resource, for two reasons. Jobs are immutable, and
    # ArgoCD renders with `helm template` where .Release.Revision is always 1 - so a plain
    # Job with a fixed name is created once and never runs again, which would leave the
    # secret empty forever after a rebuild wiped it. BeforeHookCreation deletes the previous
    # Job and runs a fresh one on every sync, so the secret is repaired whenever it needs to
    # be and a rotated key is picked up.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: '-1'
    kube-score/ignore: pod-networkpolicy
spec:
  activeDeadlineSeconds: 600
  parallelism: 1
  completions: 1
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-object-storage-secret
    spec:
      serviceAccountName: {{ .Release.Name }}-object-storage-secret
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kubectl
          image: {{ .Values.job.image }}:{{ .Values.job.tag }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: 1000m
              memory: 512Mi
              ephemeral-storage: 200Mi
            requests:
              cpu: 1m
              memory: 16Mi
              ephemeral-storage: 2Mi
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              CR={{ .Release.Name }}
              SECRET={{ .Release.Name }}-object-storage
              NS={{ .Release.Namespace }}

              # The async create takes a couple of minutes; poll rather than assume.
              for i in $(seq 1 60); do
                ID=$(kubectl get customersecretkeys.identitydomains.oci.upbound.io "$CR" -o jsonpath='{.status.atProvider.accessKey}' 2>/dev/null || true)
                KEY=$(kubectl get customersecretkeys.identitydomains.oci.upbound.io "$CR" -o jsonpath='{.status.atProvider.secretKey}' 2>/dev/null || true)
                if [ -n "$ID" ] && [ -n "$KEY" ]; then
                  break
                fi
                echo "waiting for $CR to report its key ($i/60)"
                sleep 10
              done

              if [ -z "${ID:-}" ] || [ -z "${KEY:-}" ]; then
                echo "customersecretkey $CR never reported accessKey/secretKey in status.atProvider" >&2
                exit 1
              fi

              kubectl patch secret "$SECRET" -n "$NS" --type merge -p "$(printf '{"data":{"attribute.id":"%s","attribute.key":"%s"}}' \
                "$(printf %s "$ID" | base64 | tr -d '\n')" \
                "$(printf %s "$KEY" | base64 | tr -d '\n')")"
              echo "wrote attribute.id and attribute.key into $SECRET"

              # Group.members lands here the same way the CustomerSecretKey's connection details
              # land in the Secret above. Without this the group has no members, and OCI never
              # authorizes the user's calls even though the policy and the key both exist.
              #
              # value must be the User's SCIM id (32 chars, status.atProvider.id), not its OCID -
              # PutGroup rejects members.value over 40 characters, and an OCID is much longer.
              # ocid carries the real OCID separately; the schema keeps both fields.
              for i in $(seq 1 60); do
                USER_ID=$(kubectl get users.identitydomains.oci.upbound.io "$CR" -o jsonpath='{.status.atProvider.id}' 2>/dev/null || true)
                USER_OCID=$(kubectl get users.identitydomains.oci.upbound.io "$CR" -o jsonpath='{.status.atProvider.ocid}' 2>/dev/null || true)
                if [ -n "$USER_ID" ] && [ -n "$USER_OCID" ]; then
                  break
                fi
                echo "waiting for $CR to report its id ($i/60)"
                sleep 10
              done

              if [ -z "${USER_ID:-}" ] || [ -z "${USER_OCID:-}" ]; then
                echo "user $CR never reported id/ocid in status.atProvider" >&2
                exit 1
              fi

              kubectl patch groups.identitydomains.oci.upbound.io "$CR" --type merge -p "$(printf '{"spec":{"forProvider":{"members":[{"ocid":"%s","type":"User","value":"%s"}]}}}' \
                "$USER_OCID" "$USER_ID")"
              echo "added $USER_OCID as a member of group $CR"
{{- end }}
