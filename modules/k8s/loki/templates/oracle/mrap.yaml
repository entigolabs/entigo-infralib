{{- if eq .Values.global.cloudProvider "oracle" }}
# Crossplane v2 does not reconcile a managed resource until its kind is activated, and an
# unactivated resource sits with no status at all rather than erroring - so every kind this
# module creates has to be listed here or the bucket and credentials silently never appear.
apiVersion: apiextensions.crossplane.io/v1alpha1
kind: ManagedResourceActivationPolicy
metadata:
  name: {{ .Release.Name }}
  annotations:
    argocd.argoproj.io/sync-wave: '-3'
spec:
  activate:
  - 'buckets.objectstorage.oci.upbound.io'
  - 'policies.identity.oci.upbound.io'
{{- end }}
