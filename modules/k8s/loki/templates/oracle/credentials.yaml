{{- if eq .Values.global.cloudProvider "oracle" }}
{{- /*
  Prefix-first, matching the bucket name and every other Oracle resource: users and groups
  live in an identity domain, a namespace shared by per-app service accounts, and the teardown
  tooling finds this deployment's own objects by that leading prefix. "loki-tarmo" would be
  invisible to it.
*/ -}}
{{- $iamName := printf "%s-%s" .Values.global.prefix .Release.Name }}
# S3-compatible credentials for loki, as Crossplane resources.
#
# Why loki gets a dedicated IAM user when every other Oracle module here uses the shared
# instance-principal dynamic group: loki has no OCI-native storage backend (Loki 3.7.2 wires
# only azure/bos/filesystem/gcs/http/oss/s3/swift into its thanos object store), so it can
# only reach Object Storage through the S3-compatibility endpoint - and that endpoint
# authenticates solely with a Customer Secret Key, which is a credential of a *user*. Neither
# instance principal nor OKE Workload Identity applies. If
# https://github.com/grafana/loki/issues/23687 is ever implemented, all of this collapses to
# a providerConfigRef and the user, group and key can be deleted outright.
#
# These users and groups live in an identity domain (modules/oracle/identity-domain), a
# compartment-scoped resource, so creating them needs only compartment-level automation - no
# tenancy-admin grant.
#
# The chain is user -> group -> policy because OCI policies cannot name an individual user;
# they grant to groups, dynamic groups or any-user.
apiVersion: identitydomains.oci.upbound.io/v1alpha1
kind: User
metadata:
  name: {{ .Release.Name }}
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  deletionPolicy: Delete
  forProvider:
    idcsEndpoint: {{ .Values.global.oracle.identityDomainEndpoint }}
    schemas:
      - "urn:ietf:params:scim:schemas:core:2.0:User"
    userName: {{ $iamName }}
    displayName: {{ $iamName }}
    emails:
      - type: work
        value: {{ .Values.global.oracle.serviceUserEmail }}
        primary: true
  providerConfigRef:
    name: {{ .Values.global.providerConfigRefName }}
---
apiVersion: identitydomains.oci.upbound.io/v1alpha1
kind: Group
metadata:
  name: {{ .Release.Name }}
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  deletionPolicy: Delete
  forProvider:
    idcsEndpoint: {{ .Values.global.oracle.identityDomainEndpoint }}
    displayName: {{ $iamName }}
    schemas:
      - "urn:ietf:params:scim:schemas:core:2.0:Group"
    # No members here: forProvider.members takes plain ocid/type/value strings (confirmed
    # against the provider's generated schema - GroupMembersInitParameters has no ocidRef/
    # ocidSelector), so it can't hold a live Crossplane reference to the User's not-yet-known
    # OCID. templates/oracle/connection-secret-job.yaml's job patches this Group's members in
    # once the User reports its own OCID, the same way it bridges the CustomerSecretKey below.
  providerConfigRef:
    name: {{ .Values.global.providerConfigRefName }}
---
apiVersion: identity.oci.upbound.io/v1alpha1
kind: Policy
metadata:
  name: {{ .Release.Name }}
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  forProvider:
    compartmentId: {{ .Values.global.oracle.compartmentId }}
    name: {{ $iamName }}
    description: Grants loki's user read/write on its own bucket only
    freeformTags:
      created-by: "entigo-infralib"
    statements:
      # Scoped to this one bucket by name. inspect buckets is needed separately because
      # manage objects does not imply the ability to see the bucket it lives in.
      # A domain-scoped group is referenced as <domain-name>/<group-name>, no quotes (OCI's own
      # example: "Allow group Domain-B/Domain-B-Admins to ...").
      - Allow group {{ .Values.global.oracle.identityDomainDisplayName }}/{{ $iamName }} to manage objects in compartment id {{ .Values.global.oracle.compartmentId }} where target.bucket.name='{{ .Values.global.bucketName }}'
      - Allow group {{ .Values.global.oracle.identityDomainDisplayName }}/{{ $iamName }} to inspect buckets in compartment id {{ .Values.global.oracle.compartmentId }}
  providerConfigRef:
    name: {{ .Values.global.providerConfigRefName }}
---
apiVersion: identitydomains.oci.upbound.io/v1alpha1
kind: CustomerSecretKey
metadata:
  name: {{ .Release.Name }}
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  deletionPolicy: Delete
  # The generated key reaches loki through this Secret rather than through Helm values, so it
  # is never rendered into an Application manifest or a git repo. loki reads it as an
  # environment variable - see values-oracle.yaml.
  #
  # SECURITY NOTE: the provider ALSO copies the secret part into the CR's own
  # status.atProvider.secretKey as plaintext, so anyone who can read CustomerSecretKey resources can
  # read the key regardless of who can read this Secret. That is an upstream provider
  # behaviour, not something this chart can suppress - restrict RBAC on
  # customersecretkeys.identitydomains.oci.upbound.io accordingly.
  writeConnectionSecretToRef:
    name: {{ .Release.Name }}-object-storage
    namespace: {{ .Release.Namespace }}
  forProvider:
    idcsEndpoint: {{ .Values.global.oracle.identityDomainEndpoint }}
    displayName: {{ $iamName }}
    user:
      - ocidRef:
          name: {{ .Release.Name }}
  providerConfigRef:
    name: {{ .Values.global.providerConfigRefName }}
{{- end }}
