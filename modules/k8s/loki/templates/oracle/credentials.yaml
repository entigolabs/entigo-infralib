{{- if eq .Values.global.cloudProvider "oracle" }}
{{- $iamName := printf "%s-%s" .Values.global.prefix .Release.Name }}
# IAM policy granting loki's classic tenancy User read/write on its own bucket only.
#
# Why loki needs a classic User at all, rather than the Workload Identity every other Oracle
# module here uses: loki has no OCI-native storage backend (Loki 3.7.2 wires only
# azure/bos/filesystem/gcs/http/oss/s3/swift into its thanos object store), so it can only
# reach Object Storage through the S3-compatibility endpoint - and that endpoint authenticates
# solely with a Customer Secret Key, a credential of a *user*.
#
# Minting a User (or a Group, or an Identity Domain to hold either compartment-scoped) is a
# tenancy-root-only operation with no compartment-scoped or workload-identity equivalent - see
# modules/oracle/oke's comment above oci_identity_policy.controllers. So this module creates
# none of that: the client creates the classic User + CustomerSecretKey once, manually, with
# their own tenancy access, puts the User in the classic Group named below, and hands the key
# to the agent via `ei-agent add-custom --key=loki-attribute-id --value=<key OCID>` and
# `--key=loki-attribute-key --value=<key secret>` - see agent_input_oracle.yaml's extraEnv,
# which reads those same two fixed keys back via the agent's output-custom replacement tag
# (never write that tag literally in this file - Helm templates comments too, and the tag's
# hyphen is not a legal Go template field character). What this module *can* create,
# compartment-scoped, is the Policy granting that (client-managed) Group access to this one
# bucket - creating a Policy is the one thing every identity in this compartment is already
# trusted to do.
#
# NOTE: the output-custom value renders as a literal string wherever it's referenced, so this
# key ends up in the rendered Application manifest (and the agent's git repo), unlike a
# Kubernetes-Secret-only credential. Accepted tradeoff for now over building a full
# Vault+external-secrets path - revisit if that stops being acceptable.
apiVersion: identity.oci.upbound.io/v1alpha1
kind: Policy
metadata:
  name: {{ .Release.Name }}
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  forProvider:
    compartmentId: {{ .Values.global.oracle.compartmentId }}
    name: {{ $iamName }}
    description: Grants loki's user read/write on its own bucket only
    freeformTags:
      created-by: "entigo-infralib"
    statements:
      # Scoped to this one bucket by name. inspect buckets is needed separately because
      # manage objects does not imply the ability to see the bucket it lives in. A classic
      # (non-domain) group is referenced by plain name, unlike a domain-scoped one.
      - Allow group {{ .Values.global.oracle.serviceAccountGroupName }} to manage objects in compartment id {{ .Values.global.oracle.compartmentId }} where target.bucket.name='{{ .Values.global.bucketName }}'
      - Allow group {{ .Values.global.oracle.serviceAccountGroupName }} to inspect buckets in compartment id {{ .Values.global.oracle.compartmentId }}
  providerConfigRef:
    name: {{ .Values.global.providerConfigRefName }}
{{- end }}
