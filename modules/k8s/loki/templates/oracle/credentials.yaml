{{- if eq .Values.global.cloudProvider "oracle" }}
{{- /*
  Prefix-first, matching the bucket name and every other Oracle resource: users and groups
  live in the tenancy root, a namespace shared with the whole organisation, and the teardown
  tooling finds this deployment's own objects by that leading prefix. "loki-tarmo" would be
  invisible to it.
*/ -}}
{{- $iamName := printf "%s-%s" .Values.global.prefix .Release.Name }}
# S3-compatible credentials for loki, as Crossplane resources.
#
# Why loki gets a dedicated IAM user when every other Oracle module here uses the shared
# instance-principal dynamic group: loki has no OCI-native storage backend (Loki 3.7.2 wires
# only azure/bos/filesystem/gcs/http/oss/s3/swift into its thanos object store), so it can
# only reach Object Storage through the S3-compatibility endpoint - and that endpoint
# authenticates solely with a Customer Secret Key, which is a credential of a *user*. Neither
# instance principal nor OKE Workload Identity applies. If
# https://github.com/grafana/loki/issues/23687 is ever implemented, all of this collapses to
# a providerConfigRef and the user, group and key can be deleted outright.
#
# The chain is user -> group -> policy because OCI policies cannot name an individual user;
# they grant to groups, dynamic groups or any-user.
apiVersion: identity.oci.upbound.io/v1alpha1
kind: User
metadata:
  name: {{ .Release.Name }}
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  deletionPolicy: Delete
  forProvider:
    # Users are tenancy-scoped in OCI, so this is the tenancy OCID rather than the
    # compartment - the same distinction as dynamic groups in modules/oracle/oke.
    compartmentId: {{ .Values.global.oracle.tenancyOcid }}
    name: {{ $iamName }}
    # Required, not optional: a tenancy using OCI IAM Identity Domains (IDCS) rejects
    # CreateUser without one - "The primary email must be specified",
    # error.identity.user.primaryEmailNotSpecified. Nothing is ever sent here; it exists to
    # satisfy the API, so it points at the deployment's own domain rather than a real mailbox.
    email: {{ .Values.global.oracle.serviceUserEmail }}
    description: Object Storage access for loki via the S3-compatibility endpoint (no instance-principal path exists for it)
    freeformTags:
      created-by: "entigo-infralib"
  providerConfigRef:
    name: {{ .Values.global.providerConfigRefName }}
---
apiVersion: identity.oci.upbound.io/v1alpha1
kind: Group
metadata:
  name: {{ .Release.Name }}
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  deletionPolicy: Delete
  forProvider:
    compartmentId: {{ .Values.global.oracle.tenancyOcid }}
    name: {{ $iamName }}
    description: Holds loki's Object Storage user so a policy can name it
    freeformTags:
      created-by: "entigo-infralib"
  providerConfigRef:
    name: {{ .Values.global.providerConfigRefName }}
---
apiVersion: identity.oci.upbound.io/v1alpha1
kind: UserGroupMembership
metadata:
  name: {{ .Release.Name }}
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  deletionPolicy: Delete
  forProvider:
    userIdRef:
      name: {{ .Release.Name }}
    groupIdRef:
      name: {{ .Release.Name }}
  providerConfigRef:
    name: {{ .Values.global.providerConfigRefName }}
---
apiVersion: identity.oci.upbound.io/v1alpha1
kind: Policy
metadata:
  name: {{ .Release.Name }}
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  forProvider:
    compartmentId: {{ .Values.global.oracle.compartmentId }}
    name: {{ $iamName }}
    description: Grants loki's user read/write on its own bucket only
    freeformTags:
      created-by: "entigo-infralib"
    statements:
      # Scoped to this one bucket by name. inspect buckets is needed separately because
      # manage objects does not imply the ability to see the bucket it lives in.
      - Allow group {{ $iamName }} to manage objects in compartment id {{ .Values.global.oracle.compartmentId }} where target.bucket.name='{{ .Values.global.bucketName }}'
      - Allow group {{ $iamName }} to inspect buckets in compartment id {{ .Values.global.oracle.compartmentId }}
  providerConfigRef:
    name: {{ .Values.global.providerConfigRefName }}
---
apiVersion: identity.oci.upbound.io/v1alpha1
kind: CustomerSecretKey
metadata:
  name: {{ .Release.Name }}
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  deletionPolicy: Delete
  # The generated key reaches loki through this Secret rather than through Helm values, so it
  # is never rendered into an Application manifest or a git repo. loki reads it as an
  # environment variable - see values-oracle.yaml.
  #
  # SECURITY NOTE: the provider ALSO copies the secret part into the CR's own
  # status.atProvider.key as plaintext, so anyone who can read CustomerSecretKey resources can
  # read the key regardless of who can read this Secret. That is an upstream provider
  # behaviour, not something this chart can suppress - restrict RBAC on
  # customersecretkeys.identity.oci.upbound.io accordingly.
  writeConnectionSecretToRef:
    name: {{ .Release.Name }}-object-storage
    namespace: {{ .Release.Namespace }}
  forProvider:
    displayName: {{ $iamName }}
    userIdRef:
      name: {{ .Release.Name }}
  providerConfigRef:
    name: {{ .Values.global.providerConfigRefName }}
{{- end }}
