global:
  google:
    gateway:
      extraHealthCheckCidrs:
        - 192.168.0.0/16
    bucket:
      lifecycleRule:
        - action:
            type: Delete
          condition:
            age: 100
loki:
  gateway:
    route:
      main:
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: Gateway
            name: '{{ .toptin.google-gateway.global.externalGateway | required }}'
            namespace: '{{ .toptmodule.google-gateway | required }}'
            sectionName: https
  fullnameOverride: "{{ .module.name }}"
  nameOverride: "{{ .module.name }}"
  write:
    persistence:
      size: 3Gi
  read:
    persistence:
      size: 3Gi
  backend:
    persistence:
      size: 3Gi

  extraObjects:
    - apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: health-check-egress
      spec:
        podSelector:
          matchLabels:
            health-check: "true"
        policyTypes:
          - Egress
        egress:
          - to:
              - ipBlock:
                  cidr: 0.0.0.0/0
            ports:
              - protocol: TCP
                port: 443
