global:
  oracle:
    # The group the manually created user is in (templates/oracle/credentials.yaml).
    # The default is <prefix>-<module name>, and the module is named loki-biz here.
    serviceAccountGroupName: biz-loki

loki:
  gateway:
    route:
      main:
        # Off by default on Oracle (Grafana reaches loki in-cluster); the unit test
        # probes loki through the gateway, as on the other clouds.
        enabled: true
