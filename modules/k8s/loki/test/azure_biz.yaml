loki:
  gateway:
    route:
      main:
        parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: internal
          namespace: "{{ .tmodule.azure-gateway }}"
          sectionName: https
  fullnameOverride: '{{ .module.name }}'
  nameOverride: '{{ .module.name }}'
  write:
    persistence:
      size: 3Gi
  read:
    persistence:
      size: 3Gi
  backend:
    persistence:
      size: 3Gi
