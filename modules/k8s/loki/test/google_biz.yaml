loki:
  gateway:
    route:
      main:
        # google-gateway/test points internalGateway at the external gateway,
        # but the unit test probes the internal one in biz, the same way
        # aws_biz.yaml pins the service gateway.
        parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: "{{ .tmodule.google-gateway }}-internal"
          namespace: "{{ .tmodule.google-gateway }}"
          sectionName: https
  fullnameOverride: "{{ .module.name }}"
  nameOverride: "{{ .module.name }}"
  write:
    persistence:
      size: 3Gi
  read:
    persistence:
      size: 3Gi
  backend:
    persistence:
      size: 3Gi

  extraObjects:
    - apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: health-check-egress
      spec:
        podSelector:
          matchLabels:
            health-check: "true"
        policyTypes:
          - Egress
        egress:
          - to:
              - ipBlock:
                  cidr: 0.0.0.0/0
            ports:
              - protocol: TCP
                port: 443
