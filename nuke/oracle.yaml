regions:
- eu-frankfurt-2

accounts:
  ocid1.compartment.oc19..aaaaaaaavzlzuvoosubz3nz5f727qiidbicp5myfmoieb4xqthszyful262q:
    filters:
      OCICustomerSecretKey:
      - property: Name
        type: In
        values:
        - entigo-infralib-biz-state
        - entigo-infralib-pri-state
        # The exbiz environment of entigo-infralib-example-source shares this
        # compartment; its agent's state key, bootstrap policy, vault and key
        # survive like those of biz and pri.
        - entigo-infralib-exbiz-state
      # The manually created users of loki and mimir and the groups their bucket
      # policies name (modules/k8s/loki/templates/oracle/credentials.yaml). pri
      # runs no mimir. Their Customer Secret Keys need no filter: only the keys of
      # the user running the nuke are listed.
      OCIUser:
      - property: Name
        type: In
        values:
        - biz-loki
        - biz-mimir
        - pri-loki
      # The groups are named <prefix>-<module name>, and a k8s module is named
      # <module>-<prefix> in these environments.
      OCIGroup:
      - property: Name
        type: In
        values:
        - biz-loki-biz
        - biz-mimir-biz
        - pri-loki-pri
      OCIPolicy:
      - property: Name
        type: In
        values:
        - infralib-root-ca
        - infralib-agent-bootstrap
        - infralib-github-bootstrap
        - github-example-bootstrap
      OCIVault:
      - property: Name
        type: In
        values:
        - infralib-root-ca
        - biz-eu-frankfurt-2
        - at-eu-frankfurt-2
        - pri-eu-frankfurt-2
        - exbiz-eu-frankfurt-2
      OCIKey:
      - property: Name
        type: In
        values:
        - infralib-root-ca-key
        - biz-net-pca-ca-key
        - pri-net-pca-ca-key
        - biz-eu-frankfurt-2-agent
        - at-eu-frankfurt-2-agent
        - pri-eu-frankfurt-2-agent
        - exbiz-eu-frankfurt-2-agent
        - at-net-pca-ca
      OCICertificateAuthority:
      - property: Name
        type: In
        values:
        - infralib-root-ca
        - biz-net-pca-ca
        - pri-net-pca-ca
