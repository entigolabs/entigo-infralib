---
name: Update modules/oracle
on:
  push:
    branches:
    - main
    paths:
    - "modules/oracle/**"
  workflow_dispatch:
jobs:
  build:
    name: Test modules/oracle
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Get changed files
      id: changed-files
      uses: tj-actions/changed-files@v42
    - name: Wait for other workflow runs
      uses: softprops/turnstyle@v3
      with:
        abort-after-seconds: 3600
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Write OCI credentials
      env:
        OCI_CONFIG: ${{ secrets.OCI_CONFIG }}
        OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      run: |
        mkdir -p ~/.oci
        echo "${OCI_CONFIG}" > ~/.oci/config
        echo "${OCI_PRIVATE_KEY}" > ~/.oci/oci_api_key.pem
        chmod 600 ~/.oci/config ~/.oci/oci_api_key.pem

    - name: Run tests
      env:
        OCI_REGION: eu-frankfurt-2
        OCI_CONFIG_FILE: /home/runner/.oci/config
        OCI_COMPARTMENT_ID: ocid1.compartment.oc19..aaaaaaaavzlzuvoosubz3nz5f727qiidbicp5myfmoieb4xqthszyful262q
        PR_BRANCH: main
      run: |
        source common/generate_config.sh
        prepare_agent
        echo "sources:
        - url: https://github.com/entigolabs/entigo-infralib
          version: main
          force_version: true
        steps:" > agents/config.yaml

        default_oracle_conf

        docker pull $ENTIGO_INFRALIB_IMAGE
        docker pull $TFLINT_IMAGE
        run_agents

        PIDS=""
        echo "Changed modules:"
        # Keep only the paths that are an actual module, i.e. a directory with
        # a test.sh. This drops files that live directly under modules/oracle,
        # such as README.md, and modules deleted by this push.
        for module in $(for file in ${{ steps.changed-files.outputs.all_changed_files }} ${{ steps.changed-files.outputs.deleted_files }}; do
            echo "$file" | grep "modules/oracle" | grep -ve"nuke\.sh\|oci-nuke-config\.yml" | cut -d'/' -f1-3
        done | sort -u | while read -r module; do
            if [ -f "$module/test.sh" ]; then
                echo "$module"
            fi
        done); do
            ${module}/test.sh testonly &
            PIDS="$PIDS $!=${module}"
        done

        FAIL=""
        for p in $PIDS; do
            pid=$(echo $p | cut -d"=" -f1)
            name=$(echo $p | cut -d"=" -f2)
            wait $pid || FAIL="$FAIL $p"
            if [[ $FAIL == *$p* ]]; then
                echo "$p Failed"
            else
                echo "$p Done"
            fi
        done
        if [ "$FAIL" != "" ]; then
            echo "FAILED TESTS $FAIL"
            exit 2
        fi

    - name: Get latest release
      id: get_latest_release
      uses: actions/github-script@v6
      with:
        script: |
          const latestStableRelease = await github.rest.repos.getLatestRelease({ owner: context.repo.owner, repo: context.repo.repo });
          const versionString = '' + latestStableRelease.data.tag_name;
          const regex = /^v(\d+)\.(\d+)\.(\d+)$/;
          const match = versionString.match(regex);
          const major = parseInt(match[1], 10);
          const minor = parseInt(match[2], 10);
          const patch = parseInt(match[3], 10) + 1;
          const new_version = `v${major}.${minor}.${patch}`
          core.setOutput('new_version', new_version);

    - name: Authenticate with GitHub CLI
      if: github.event_name == 'push'
      run: gh auth login --with-token <<< ${{ secrets.GITHUB_TOKEN }}
    - name: Create Release
      if: github.event_name == 'push'
      id: create_release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git tag -a modules/oracle-${{ steps.get_latest_release.outputs.new_version }}-rc${{ github.run_number }} -m "Release modules/oracle-${{ steps.get_latest_release.outputs.new_version }}-rc${{ github.run_number }}"
        git push origin modules/oracle-${{ steps.get_latest_release.outputs.new_version }}-rc${{ github.run_number }}
        CHANGED=""
        for module in $(for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            echo "$file" | grep "^modules/" | grep -ve"nuke" | cut -d'/' -f1-3
        done | sort -u); do
            CHANGED="$CHANGED"$'\n'"  - $module"
        done
        for module in $(for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            echo "$file" | grep -e "^images/\|^providers/" | cut -d'/' -f1-2
        done | sort -u); do
            CHANGED="$CHANGED"$'\n'"  - $module"
        done

        RELEASE_URL=$(gh release create modules/oracle-${{ steps.get_latest_release.outputs.new_version }}-rc${{ github.run_number }} \
            --title "Release modules/oracle-${{ steps.get_latest_release.outputs.new_version }}-rc${{ github.run_number }}" \
            --generate-notes \
            --notes "## Changed modules, providers and images
        $CHANGED
        " \
            --draft=false \
            --latest=false \
            --prerelease=true)
        echo "RELEASE_URL=$RELEASE_URL" >> $GITHUB_ENV

    - name: Slack Success Release Message
      if: success() && github.event_name == 'push'
      uses: rtCamp/action-slack-notify@v2
      env:
        SLACK_COLOR: success
        SLACK_MESSAGE: Released modules/oracle-${{ steps.get_latest_release.outputs.new_version }}-rc${{ github.run_number }} ${{ env.RELEASE_URL }}
        SLACK_USERNAME: ${{ secrets.SLACK_USERNAME }}
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_ICON_EMOJI: ${{ secrets.SLACK_ICON_EMOJI }}
        MSG_MINIMAL: actions url,commit
        SLACK_FOOTER: ""
    - name: Slack Failed Message
      if: failure()
      uses: rtCamp/action-slack-notify@v2
      env:
        SLACK_COLOR: failure
        SLACK_MESSAGE: "Failed to update modules/oracle on main (run #${{ github.run_number }})"
        SLACK_USERNAME: ${{ secrets.SLACK_USERNAME }}
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_ICON_EMOJI: ${{ secrets.SLACK_ICON_EMOJI }}
        SLACK_FOOTER: ""
