# Garbage collection of the ECR Public repositories under
# public.ecr.aws/entigolabs, which cannot have lifecycle policies: deletes the
# untagged manifests no tag leads to any more and the signatures of images
# that are gone, and keeps what a tag reaches (the architectures and
# attestations of a multi-arch tag, attached SBOMs, cosign signatures) and
# everything pushed within the grace period. Release candidate and alpha tags
# older than the grace period are removed first, unless the image also has a
# moving tag such as latest or dev. images/ecr-public-gc.py has the rules.
#
# The weekly run (Monday 14:00 UTC) deletes; a run dispatched by hand only
# reports unless asked to delete. The job summary lists what was or would be
# deleted per repository and the 10 largest repositories of the registry.
name: ECR Public GC

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:
    inputs:
      repositories:
        description: "Repositories under public.ecr.aws/entigolabs, space separated"
        default: "entigo-infralib-test entigo-infralib-testing entigo-infralib-tools entigo-infralib-base entigo-infralib-google entigo-infralib-azure entigo-infralib-kubectl entigo-infralib-oracle entigo-infralib-aws entigo-infralib-agent"
      grace_days:
        description: "Keep everything pushed within this many days"
        default: "14"
      delete:
        description: "Delete (unchecked: only report)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ecr-public-gc

jobs:
  gc:
    name: Collect garbage
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # The repositories the scheduled run collects.
      REPOSITORIES: ${{ inputs.repositories || 'entigo-infralib-test entigo-infralib-testing entigo-infralib-tools entigo-infralib-base entigo-infralib-google entigo-infralib-azure entigo-infralib-kubectl entigo-infralib-oracle entigo-infralib-aws entigo-infralib-agent' }}
      GRACE_DAYS: ${{ inputs.grace_days || '14' }}
      DELETE: ${{ github.event_name == 'schedule' || inputs.delete == true }}
    steps:
    - uses: actions/checkout@v7
    - name: Collect garbage
      run: |
        set -euo pipefail
        args=(--grace-days "$GRACE_DAYS" --largest 10 --prune-prerelease)
        if [ "$DELETE" = true ]; then args+=(--delete); fi
        # shellcheck disable=SC2086
        python3 images/ecr-public-gc.py "${args[@]}" $REPOSITORIES
