# Garbage collection of the ECR Public repositories under
# public.ecr.aws/entigolabs, which cannot have lifecycle policies: deletes the
# untagged manifests no tag leads to any more and the signatures of images
# that are gone, and keeps what a tag reaches (the architectures and
# attestations of a multi-arch tag, attached SBOMs, cosign signatures) and
# everything pushed within the grace period. images/ecr-public-gc.py has the
# rules.
#
# The weekly run only reports until the repository variable
# ECR_PUBLIC_GC_DELETE is "true"; a run dispatched by hand deletes when asked
# to. The job summary lists what was or would be deleted per repository and
# the 10 largest repositories of the registry.
name: ECR Public GC

on:
  schedule:
    - cron: "17 3 * * 6"
  workflow_dispatch:
    inputs:
      repositories:
        description: "Repositories under public.ecr.aws/entigolabs, space separated"
        default: "entigo-infralib-test entigo-infralib-testing entigo-infralib-tools"
      grace_days:
        description: "Keep everything pushed within this many days"
        default: "14"
      delete:
        description: "Delete (unchecked: only report)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ecr-public-gc

jobs:
  gc:
    name: Collect garbage
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # The repositories the scheduled run collects.
      REPOSITORIES: ${{ inputs.repositories || 'entigo-infralib-test entigo-infralib-testing entigo-infralib-tools' }}
      GRACE_DAYS: ${{ inputs.grace_days || '14' }}
      DELETE: ${{ github.event_name == 'schedule' && vars.ECR_PUBLIC_GC_DELETE == 'true' || inputs.delete == true }}
    steps:
    - uses: actions/checkout@v7
    - name: Collect garbage
      run: |
        set -euo pipefail
        args=(--grace-days "$GRACE_DAYS" --largest 10)
        if [ "$DELETE" = true ]; then args+=(--delete); fi
        # shellcheck disable=SC2086
        python3 images/ecr-public-gc.py "${args[@]}" $REPOSITORIES
