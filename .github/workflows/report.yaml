# Reports the updates available to the modules' dependencies every Monday
# morning: one job and one Slack message per kind (k8s, aws, google, oracle),
# through the shared workflow of entigo-infralib-test, so that the long k8s
# list no longer buries the cloud ones. report/aws.sh adds the EKS AMI release
# versions, which the framework knows nothing about. Dispatch with `kinds` to
# report on some kinds only.
name: Report

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:
    inputs:
      kinds:
        description: comma separated kinds (k8s, aws, google, oracle); empty for all
        type: string
        default: ''

jobs:
  report:
    uses: entigolabs/entigo-infralib-test/.github/workflows/module-report.yaml@main
    with:
      kinds: ${{ inputs.kinds || '' }}
    secrets: inherit
