name: Nuke

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

jobs:
  nuke_aws:
    name: Nuke AWS account
    runs-on: ubuntu-latest
    steps:
    - name: Sleep for 5 minutes
      if: github.event_name == 'schedule'
      run: sleep 300
    - name: Slack Started Message
      if: github.event_name != 'schedule'
      uses: rtCamp/action-slack-notify@v2
      env:
        SLACK_COLOR: '#EBEB00'
        SLACK_MESSAGE: 'Nuking started of entigo-infralib AWS and google accounts!'
        SLACK_USERNAME: ${{ secrets.SLACK_USERNAME }}
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_ICON_EMOJI: ${{ secrets.SLACK_ICON_EMOJI }}
        MSG_MINIMAL: actions url,commit
        SLACK_FOOTER: ""
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Nuke entigo-infralib account
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION:  ${{ secrets.AWS_REGION }}
      run: |
        aws configservice stop-configuration-recorder --region $AWS_REGION --configuration-recorder-name biz-net-config-rules || true
        modules/aws/nuke.sh || modules/aws/nuke.sh
    - name: Slack Failed To Nuke Message
      if: ${{ failure() }}
      uses: rtCamp/action-slack-notify@v2
      env:
        SLACK_COLOR: 'failure'
        SLACK_MESSAGE: 'Failed to Nuke the entigo-infralib AWS account!'
        SLACK_USERNAME: ${{ secrets.SLACK_USERNAME }}
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_ICON_EMOJI: ${{ secrets.SLACK_ICON_EMOJI }}
        SLACK_FOOTER: ""

  nuke_gcp:
    name: Nuke Google project
    runs-on: ubuntu-latest
    steps:
    - name: Sleep for 5 minutes
      if: github.event_name == 'schedule'
      run: sleep 300
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Nuke entigo-infralib google project
      env:
        GOOGLE_APPLICATION_CREDENTIALS_JSON:  ${{ secrets.GOOGLE_CREDENTIALS }}
      run: |
        modules/google/nuke.sh || modules/google/nuke.sh
    - name: Slack Failed To Nuke Google Message
      if: ${{ failure() }}
      uses: rtCamp/action-slack-notify@v2
      env:
        SLACK_COLOR: 'failure'
        SLACK_MESSAGE: 'Failed to Nuke the entigo-infralib google project!'
        SLACK_USERNAME: ${{ secrets.SLACK_USERNAME }}
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_ICON_EMOJI: ${{ secrets.SLACK_ICON_EMOJI }}
        SLACK_FOOTER: ""

  nuke_oracle:
    name: Nuke Oracle compartment
    runs-on: ubuntu-latest
    steps:
    - name: Sleep for 5 minutes
      if: github.event_name == 'schedule'
      run: sleep 300
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Write OCI credentials
      env:
        OCI_CONFIG: ${{ secrets.OCI_CONFIG }}
        OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      run: |
        mkdir -p ~/.oci
        echo "${OCI_CONFIG}" > ~/.oci/config
        echo "${OCI_PRIVATE_KEY}" > ~/.oci/oci_api_key.pem
        chmod 600 ~/.oci/config ~/.oci/oci_api_key.pem
    - name: Nuke entigo-infralib oracle compartment
      env:
        OCI_REGION: eu-frankfurt-1
        OCI_CONFIG_FILE: /home/runner/.oci/config
        PREFIX: biz
      run: |
        modules/oracle/nuke.sh || modules/oracle/nuke.sh
    - name: Slack Failed To Nuke Oracle Message
      if: ${{ failure() }}
      uses: rtCamp/action-slack-notify@v2
      env:
        SLACK_COLOR: 'failure'
        SLACK_MESSAGE: 'Failed to Nuke the entigo-infralib oracle compartment!'
        SLACK_USERNAME: ${{ secrets.SLACK_USERNAME }}
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_ICON_EMOJI: ${{ secrets.SLACK_ICON_EMOJI }}
        SLACK_FOOTER: ""
