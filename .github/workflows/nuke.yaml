# Deletes everything in the test accounts that nuke/<cloud>.yaml does not
# keep, every evening, so that Agent Stable provisions the environments from
# scratch in the morning. One job per cloud; dispatch with a single cloud to
# nuke only that one, with dry_run to see what would go.
name: Nuke

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      cloud:
        description: cloud to nuke
        type: choice
        options: [all, aws, google, oracle, azure]
        default: all
      dry_run:
        description: only list what would be deleted
        type: boolean
        default: false

jobs:
  nuke:
    uses: entigolabs/entigo-infralib-test/.github/workflows/module-nuke.yaml@main
    with:
      clouds: ${{ inputs.cloud || '' }}
      # The Oracle tenancy-scoped listers need the environment prefixes: biz
      # (pri shares its tenancy resources) and exbiz, the environment of
      # entigo-infralib-example-source in the same compartment.
      prefixes: biz,exbiz
      dry_run: ${{ inputs.dry_run || false }}
    secrets: inherit
