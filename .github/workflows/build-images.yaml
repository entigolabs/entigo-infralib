# .github/workflows/build-images.yaml
#
# Every image is multi-arch (amd64 and arm64). Each architecture builds on a
# GitHub-hosted runner of its own kind, never under QEMU, which made the
# builds take the better part of an hour. The build jobs push single-platform images by
# digest only, to both registries, and the publish job joins the two digests
# into one index under the real tag per registry. A tag therefore never
# points at a half-built image, and the release and the downstream cascade
# (image-tag artifact, workflow_run) happen only once both halves exist.
name: Reusable Image Builder

on:
  workflow_call:
    inputs:
      path:
        required: true
        type: string
        description: "Path to image directory (e.g., images/base-tools)"
      name:
        required: true
        type: string
        description: "Image name (e.g., entigo-infralib-base-tools)"
      is_dev:
        required: false
        type: boolean
        default: false

jobs:
  tag:
    name: Resolve image tag
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
      is_dev: ${{ steps.tag.outputs.is_dev }}
    steps:
    # inputs.is_dev is only meaningful for push/pull_request/workflow_dispatch.
    # On workflow_run the caller cannot tell whether the cascade started from a
    # PR: github.event.workflow_run describes only the immediate parent, and two
    # hops out (tools -> google -> ...) that parent's own event is
    # "workflow_run", not "pull_request". So read the tag the parent recorded
    # instead. This is correct at any depth, because every build records its own.
    - name: Resolve image tag
      id: tag
      env:
        GH_TOKEN: ${{ github.token }}
        EVENT_NAME: ${{ github.event_name }}
        INPUT_IS_DEV: ${{ inputs.is_dev }}
        PARENT_RUN_ID: ${{ github.event.workflow_run.id }}
        PARENT_EVENT: ${{ github.event.workflow_run.event }}
      run: |
        set -euo pipefail
        if [ "${EVENT_NAME}" != "workflow_run" ]; then
          TAG=$([ "${INPUT_IS_DEV}" = "true" ] && echo dev || echo latest)
          echo "Triggered by ${EVENT_NAME}, is_dev=${INPUT_IS_DEV} -> ${TAG}"
        elif gh run download "${PARENT_RUN_ID}" -R "${GITHUB_REPOSITORY}" \
               -n image-tag -D "${RUNNER_TEMP}/parent" 2>/dev/null; then
          TAG=$(tr -d '[:space:]' < "${RUNNER_TEMP}/parent/image-tag.txt")
          echo "Parent run ${PARENT_RUN_ID} recorded tag ${TAG}"
        else
          # No artifact: a run predating this change, or an expired artifact.
          # Fall back to the single-hop guess rather than defaulting to latest.
          TAG=$([ "${PARENT_EVENT}" = "pull_request" ] && echo dev || echo latest)
          echo "Parent run ${PARENT_RUN_ID} recorded no tag, guessing ${TAG} from parent event ${PARENT_EVENT}"
        fi
        case "${TAG}" in
          dev|latest) ;;
          *) echo "Refusing to build unexpected tag '${TAG}'" >&2; exit 1 ;;
        esac
        echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"
        echo "is_dev=$([ "${TAG}" = dev ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  build:
    name: Build image ${{ inputs.name }} ${{ matrix.arch }}
    needs: tag
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        arch: [amd64, arm64]
        # GitHub-hosted runners of each architecture; both are 4 vCPU for a
        # public repository.
        include:
        - arch: amd64
          runner: ubuntu-latest
        - arch: arm64
          runner: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Log in to the registries
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      run: |
        set -euo pipefail
        echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
        aws ecr-public get-login-password --region us-east-1 | docker login -u AWS --password-stdin public.ecr.aws/entigolabs

    # push-by-digest: the image is pushed untagged to both registries and
    # only its digest comes out; the publish job below tags it.
    - name: Build and push by digest
      id: build
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.path }}
        platforms: linux/${{ matrix.arch }}
        build-args: |
          BASE_TAG=${{ needs.tag.outputs.image_tag }}
        outputs: type=image,"name=public.ecr.aws/entigolabs/${{ inputs.name }},docker.io/entigolabs/${{ inputs.name }}",push-by-digest=true,name-canonical=true,push=true
        provenance: mode=max
        sbom: true

    - name: Export the digest
      env:
        DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        set -euo pipefail
        mkdir -p "${RUNNER_TEMP}/digests"
        touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
        echo "${{ inputs.name }} ${{ matrix.arch }}: ${DIGEST}"

    - name: Upload the digest
      uses: actions/upload-artifact@v4
      with:
        name: digest-${{ inputs.name }}-${{ matrix.arch }}
        path: ${{ runner.temp }}/digests/*
        if-no-files-found: error
        retention-days: 1

    - name: Slack Failed Message
      if: failure()
      uses: rtCamp/action-slack-notify@v2
      env:
        SLACK_COLOR: 'failure'
        SLACK_MESSAGE: 'Failed to build ${{ inputs.name }} ${{ matrix.arch }} (run #${{ github.run_number }})'
        SLACK_USERNAME: ${{ secrets.SLACK_USERNAME }}
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_ICON_EMOJI: ${{ secrets.SLACK_ICON_EMOJI }}
        SLACK_FOOTER: ""

  publish:
    name: Publish image ${{ inputs.name }}
    needs: [tag, build]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download the digests
      uses: actions/download-artifact@v4
      with:
        pattern: digest-${{ inputs.name }}-*
        path: ${{ runner.temp }}/digests
        merge-multiple: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Get latest release
      id: get_latest_release
      uses: actions/github-script@v6
      with:
        script: |
          const latestStableRelease = await github.rest.repos.getLatestRelease({ owner: context.repo.owner, repo: context.repo.repo });
          const versionString = '' + latestStableRelease.data.tag_name;
          const regex = /^v(\d+)\.(\d+)\.(\d+)$/;
          const match = versionString.match(regex);
          const major = parseInt(match[1], 10);
          const minor = parseInt(match[2], 10);
          const patch = parseInt(match[3], 10) + 1;
          const new_version = `v${major}.${minor}.${patch}`
          core.setOutput('new_version', new_version);

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Log in to the registries
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      run: |
        set -euo pipefail
        echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
        aws ecr-public get-login-password --region us-east-1 | docker login -u AWS --password-stdin public.ecr.aws/entigolabs

    - name: Create the multi-arch manifests
      working-directory: ${{ runner.temp }}/digests
      env:
        IMAGE_TAG: ${{ needs.tag.outputs.image_tag }}
      run: |
        set -euo pipefail
        # One digest per architecture of the build matrix, or the image is
        # incomplete and gets no tag. The digests are the same in both
        # registries: the build pushed the same content to each.
        digests=(*)
        [ "${#digests[@]}" -eq 2 ] || { echo "::error::${{ inputs.name }}: expected 2 digests (amd64, arm64), found ${#digests[@]}: ${digests[*]}" >&2; exit 1; }
        for image in "public.ecr.aws/entigolabs/${{ inputs.name }}" "entigolabs/${{ inputs.name }}"; do
          sources=()
          for digest in "${digests[@]}"; do sources+=("${image}@sha256:${digest}"); done
          docker buildx imagetools create -t "${image}:${IMAGE_TAG}" "${sources[@]}"
          docker buildx imagetools inspect "${image}:${IMAGE_TAG}"
        done

    - name: Record image tag for downstream builds
      run: echo "${{ needs.tag.outputs.image_tag }}" > "${RUNNER_TEMP}/image-tag.txt"

    - name: Upload image tag
      uses: actions/upload-artifact@v4
      with:
        name: image-tag
        path: ${{ runner.temp }}/image-tag.txt
        retention-days: 1

    - name: Create Release
      if: ${{ needs.tag.outputs.is_dev != 'true' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ inputs.name }}-${{ steps.get_latest_release.outputs.new_version }}-rc${{ github.run_number }}
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git tag -a ${RELEASE_TAG} -m "Release ${RELEASE_TAG}"
        git push origin ${RELEASE_TAG}
        RELEASE_URL=$(gh release create ${RELEASE_TAG} \
          --title "Release ${RELEASE_TAG}" \
          --generate-notes \
          --draft=false \
          --latest=false \
          --prerelease=true)
        echo "RELEASE_URL=$RELEASE_URL" >> $GITHUB_ENV

    - name: Slack Success Release Message
      if: ${{ success() && needs.tag.outputs.is_dev != 'true' }}
      uses: rtCamp/action-slack-notify@v2
      env:
        SLACK_COLOR: 'success'
        SLACK_MESSAGE: 'Released ${{ inputs.name }}-${{ steps.get_latest_release.outputs.new_version }}-rc${{ github.run_number }} ${{ env.RELEASE_URL }}'
        SLACK_USERNAME: ${{ secrets.SLACK_USERNAME }}
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_ICON_EMOJI: ${{ secrets.SLACK_ICON_EMOJI }}
        MSG_MINIMAL: actions url,commit
        SLACK_FOOTER: ""

    - name: Slack Failed Message
      if: failure()
      uses: rtCamp/action-slack-notify@v2
      env:
        SLACK_COLOR: 'failure'
        SLACK_MESSAGE: 'Failed to build ${{ inputs.name }} (run #${{ github.run_number }})'
        SLACK_USERNAME: ${{ secrets.SLACK_USERNAME }}
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_ICON_EMOJI: ${{ secrets.SLACK_ICON_EMOJI }}
        SLACK_FOOTER: ""
