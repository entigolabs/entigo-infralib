# Agent configuration of the azure_pri environment: cloud azure, prefix pri,
# next to azure_biz in the same subscription, without kms and with wireguard.
# Inputs live in modules/<type>/<name>/test/azure_pri.yaml.
steps:
  - name: net
    type: terraform
    modules:
      - source: azure/vpc
      - source: azure/acr-proxy
      - source: azure/dns
  - name: infra
    type: terraform
    vpc:
      attach: true
    modules:
      - source: azure/crossplane
      - source: azure/aks
      - source: azure/aks-node-pool
      - source: azure/agc
  - name: apps
    type: argocd-apps
    argocd_namespace: argocd-pri
    modules:
      - source: argocd
      - name: azure-gateway
        source: azure-gateway
      - source: cert-manager
      - name: crossplane-azure
        source: crossplane-azure
      - name: crossplane-system
        source: crossplane-core
      - source: external-dns
      - source: external-secrets
      - source: grafana
      - source: harbor
      - source: istio-base
      - source: istio-gateway
      - name: istio-system
        source: istio-istiod
      - source: kiali
      - source: kyverno
      - source: loki
      - source: mimir
      - source: prometheus
      - source: trivy
      - source: wireguard
